services:

  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./docker_volume/postgres/data:/var/lib/postgresql/data/pgdata
      - ./docker_volume/postgres/logs:/var/log/postgresql
    ports: []
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1536M}
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-512M}
          cpus: "${POSTGRES_CPU_RESERVATION:-0.5}"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1024MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=2MB
      - -c
      - huge_pages=try
      - -c
      - min_wal_size=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - wal_level=replica
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=ddl
      - -c
      - log_disconnections=on
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - statement_timeout=300000

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: pgbouncer
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:?PGBOUNCER_AUTH_TYPE is required}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:?PGBOUNCER_POOL_MODE is required}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:?PGBOUNCER_MAX_CLIENT_CONN is required}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:?PGBOUNCER_DEFAULT_POOL_SIZE is required}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:?PGBOUNCER_MIN_POOL_SIZE is required}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:?PGBOUNCER_RESERVE_POOL_SIZE is required}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:?PGBOUNCER_RESERVE_POOL_TIMEOUT is required}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:?PGBOUNCER_SERVER_IDLE_TIMEOUT is required}
      CLIENT_IDLE_TIMEOUT: ${PGBOUNCER_CLIENT_IDLE_TIMEOUT:?PGBOUNCER_CLIENT_IDLE_TIMEOUT is required}
      LOG_CONNECTIONS: ${PGBOUNCER_LOG_CONNECTIONS:?PGBOUNCER_LOG_CONNECTIONS is required}
      LOG_DISCONNECTIONS: ${PGBOUNCER_LOG_DISCONNECTIONS:?PGBOUNCER_LOG_DISCONNECTIONS is required}
      LOG_STATS: ${PGBOUNCER_LOG_STATS:?PGBOUNCER_LOG_STATS is required}
      STATS_PERIOD: ${PGBOUNCER_STATS_PERIOD:?PGBOUNCER_STATS_PERIOD is required}
      LISTEN_PORT: "5432"
      LISTEN_ADDR: "0.0.0.0"
      ADMIN_USERS: ${POSTGRES_USER:?POSTGRES_USER is required}
      # auth_query lets pgbouncer look up any PG user's SCRAM verifier on-demand
      AUTH_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
    volumes:
      - ./docker_volume/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker_volume/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "5432:5432"
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEMORY_LIMIT:-128M}
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${PGBOUNCER_MEMORY_RESERVATION:-32M}
          cpus: "${PGBOUNCER_CPU_RESERVATION:-0.1}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis
    restart: unless-stopped
    env_file: .env
    environment:
      # Passed to redis-server by the redis-stack entrypoint via ${REDIS_ARGS}.
      # --protected-mode no and --daemonize no are already set by the entrypoint.
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
        --save 900 1
        --save 300 10
        --save 60 10000
        --appendonly yes
        --appendfsync everysec
        --bind 0.0.0.0
    volumes:
      - ./docker_volume/redis/data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"  # Redis Server Port
      - "8001:8001"                 # RedisInsight UI Port
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-384M}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-64M}
          cpus: "${REDIS_CPU_RESERVATION:-0.1}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
      image: neo4j:2026.04-enterprise
      container_name: neo4j
      restart: unless-stopped
      ports:
        - "7474:7474"
        - "7687:7687"
      environment:
        - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
        - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}

        # Allow unrecognised settings without hard failure (guards against version drift)
        - NEO4J_server_config_strict__validation_enabled=false

        # Plugins
        - NEO4J_PLUGINS=["apoc", "graph-data-science"]

        # Memory — Heap 3G + Pagecache 1.5G + ~512M JVM overhead ≈ 5G total, under 6G limit.
        # Sized for GDS (FastRP, K-NN, Louvain, PageRank) on ~320 tables without OOM.
        - NEO4J_server_memory_heap_initial__size=3g
        - NEO4J_server_memory_heap_max__size=3g
        - NEO4J_server_memory_pagecache_size=1500m

        # Transaction memory — GDS write-backs can exceed 256M in a single tx
        - NEO4J_db_transaction_concurrent_maximum=16
        - NEO4J_dbms_memory_transaction_total_max=1500m
        - NEO4J_db_memory_transaction_max=768m
        - NEO4J_db_transaction_timeout=30m
        - NEO4J_db_lock_acquisition_timeout=30s

        # JVM — G1GC tuned for 3G heap; GC log rotated so /logs/ doesn't fill.
        - NEO4J_server_jvm_additional=-XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=16m -XX:InitiatingHeapOccupancyPercent=35 -XX:+ParallelRefProcEnabled -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/logs/ -Xlog:gc*:file=/logs/gc.log:time,uptime:filecount=5,filesize=20m

        # GDS
        - NEO4J_gds_arrow_enabled=false

        # Bolt thread pool (Neo4j 5+ key names)
        - NEO4J_server_bolt_thread__pool__min__size=10
        - NEO4J_server_bolt_thread__pool__max__size=40
        - NEO4J_server_bolt_thread__pool__keep__alive=5m

        # Query cache (Neo4j 5+ key name)
        - NEO4J_dbms_cypher_min__replan__interval=10s

        # Security and Procedures — plugin installer sets unrestricted/allowlist automatically;
        # explicit values here are kept as a fallback in case the installer skips them.
        - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
        - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
        - NEO4J_apoc_export_file_enabled=false
        - NEO4J_apoc_import_file_enabled=false

        # Faster browser loading
        - NEO4J_browser_post__connect__cmd=
        - NEO4J_browser_remote__content__hostname__whitelist=

      volumes:
        - ./docker_volume/neo4j/data:/data
        - ./docker_volume/neo4j/logs:/logs
        - ./docker_volume/neo4j/import:/import
        - ./docker_volume/neo4j/plugins:/plugins

      ulimits:
        nofile:
          soft: 40000
          hard: 40000

      deploy:
        resources:
          limits:
            cpus: "4"
            memory: 6G
          reservations:
            cpus: "1"
            memory: 2G

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "wget -qO- http://localhost:7474/db/neo4j/cluster/available || wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
          ]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 120s

      networks:
        - db_net

  pgbouncer_redshift:
    build:
      context: ./pgbouncer_rr
      dockerfile: Dockerfile
    image: pgbouncer-rr-redshift:local
    container_name: pgbouncer_redshift
    restart: unless-stopped
    env_file: .env
    environment:
      REDSHIFT_HOST: ${REDSHIFT_HOST:?REDSHIFT_HOST is required}
      REDSHIFT_PORT: ${REDSHIFT_PORT:-5439}
      REDSHIFT_DB: ${REDSHIFT_DB:?REDSHIFT_DB is required}
      REDSHIFT_USER: ${REDSHIFT_USER:?REDSHIFT_USER is required}
      REDSHIFT_PASSWORD: ${REDSHIFT_PASSWORD:?REDSHIFT_PASSWORD is required}
      REDSHIFT_NUM_BACKENDS: ${REDSHIFT_NUM_BACKENDS:-1}
      PGB_ADMIN_USERS: "${REDSHIFT_USER},${REDSHIFT_READONLY_USER:-}"
      PGB_ADMIN_PASSWORDS: "${REDSHIFT_PASSWORD},${REDSHIFT_READONLY_PASSWORD:-}"
      PGBOUNCER_RR_POOL_MODE: ${PGBOUNCER_RR_POOL_MODE:-session}
      PGBOUNCER_RR_DEFAULT_POOL_SIZE: ${PGBOUNCER_RR_DEFAULT_POOL_SIZE:-10}
      PGBOUNCER_RR_MAX_CLIENT_CONN: ${PGBOUNCER_RR_MAX_CLIENT_CONN:-100}
      PGBOUNCER_RR_MIN_POOL_SIZE: ${PGBOUNCER_RR_MIN_POOL_SIZE:-2}
      PGBOUNCER_RR_RESERVE_POOL_SIZE: ${PGBOUNCER_RR_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_RR_RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RR_RESERVE_POOL_TIMEOUT:-3}
      PGBOUNCER_RR_SERVER_IDLE_TIMEOUT: ${PGBOUNCER_RR_SERVER_IDLE_TIMEOUT:-600}
      PGBOUNCER_RR_CLIENT_IDLE_TIMEOUT: ${PGBOUNCER_RR_CLIENT_IDLE_TIMEOUT:-1800}
      PGBOUNCER_RR_LOG_CONNECTIONS: ${PGBOUNCER_RR_LOG_CONNECTIONS:-1}
      PGBOUNCER_RR_LOG_DISCONNECTIONS: ${PGBOUNCER_RR_LOG_DISCONNECTIONS:-1}
      PGBOUNCER_RR_LOG_STATS: ${PGBOUNCER_RR_LOG_STATS:-1}
      PGBOUNCER_RR_STATS_PERIOD: ${PGBOUNCER_RR_STATS_PERIOD:-60}
    volumes:
      - ./docker_volume/pgbouncer_redshift/routing_rules.py:/home/pgbouncer/routing_rules.py:ro
    ports:
      - "5433:5432"
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_RR_MEMORY_LIMIT:-128M}
          cpus: "${PGBOUNCER_RR_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${PGBOUNCER_RR_MEMORY_RESERVATION:-32M}
          cpus: "${PGBOUNCER_RR_CPU_RESERVATION:-0.1}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5432'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    env_file: .env
    environment:
      CB_SERVER_NAME: ${CLOUDBEAVER_SERVER_NAME:-mti-brain-cloudbeaver}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN_NAME:-admin}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD:-admin}
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    ports:
      - "${CLOUDBEAVER_PORT:-5050}:8978"
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${CLOUDBEAVER_MEMORY_LIMIT:-1024M}
          cpus: "${CLOUDBEAVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${CLOUDBEAVER_MEMORY_RESERVATION:-256M}
          cpus: "${CLOUDBEAVER_CPU_RESERVATION:-0.25}"

networks:
  db_net:
    external: true
    name: db_net

volumes:
  cloudbeaver_data: