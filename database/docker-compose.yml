  jena-fuseki:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
      args:
        JENA_VERSION: ${JENA_ARQ_VERSION:-5.1.0}
    image: mti-brain-fuseki:latest
    container_name: jena-fuseki
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./docker_volume/fuseki-data:/work/data
      - ./docker_volume/fuseki-queries:/work/queries
      - ./docker_volume/fuseki-output:/work/output
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=${JENA_ADMIN_PASSWORD:?JENA_ADMIN_PASSWORD is required}
      - JVM_ARGS=-Xms${JENA_JVM_XMS:-256m} -Xmx${JENA_JVM_XMX:-512m}
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: ${JENA_MEMORY_LIMIT:-768M}
          cpus: "${JENA_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${JENA_MEMORY_RESERVATION:-256M}
          cpus: "${JENA_CPU_RESERVATION:-0.25}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:3030/$/ping' || wget -qO- http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  db_net:
    external: true
    name: db_net