- id: B.4
  title: Agency / currency / instrument code hints
  notes: |-
    - Agencies: `MOODYS`, `SP`, `FITCH`. Currencies: ISO codes (`USD,EUR,GBP,JPY,AUD,AED,…`).
    - Facilities encode meaning: `CF_<TYPE>_<CCY>_<SIZE>` (e.g. `CF_RCF_EUR_500M`).
    - Investments: `INV_<TYPE>_<n>` (`MMF/CD/TD/CP/REPO/BOND`). FX deals: `FXF-#######`.
      Hedges: `HR-#######`. Intercompany: `IC-#######`. SCF docs: `WCF-#######`.

