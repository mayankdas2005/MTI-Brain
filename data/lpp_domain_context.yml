title: LPP Treasury Analytics - Semantic Context Pack, Volume 2
dialect: redshift
description: |-
  Extends the base Context Pack with: **(A)** deeper metric formulas & edge cases,
  **(B)** natural-language phrasing → entity/synonym maps, **(C)** worked SQL
  templates for all test prompts. SQL is **Amazon Redshift** dialect (the schema
  uses `super`, dist/sort keys, column encodings). Replace `:params` at runtime.
metric_edge_cases:
- id: A.1
  title: Resolving the time grain
  notes: |-
    - **"Latest / current / now"** → for period tables use `MAX(period_date)` *within
      the requested `period_type`*; for daily snapshots use `MAX(date) ≤ today`. Never
      hard-code a date.
    - **TTM (trailing twelve months)** for **flow** metrics (revenue, EBITDA, FCF,
      interest, COGS) = SUM of the **4 most recent `period_type='Q'` rows per entity**.
      Do **not** mix a TTM flow with an `FY` row (double counts). For **stock** metrics
      (debt, cash, equity, shares) TTM is meaningless — use the latest point-in-time row.
    - **YoY** = same `period_type`, `period_date` vs `period_date - INTERVAL '1 year'`.
      Edge case: fiscal calendars may not land on natural quarter-ends — match on the
      *ranked* period (lag 4 quarters), not literal date arithmetic, if dates are irregular.
    - **YTD** = `period_date >= date_trunc('year', current fiscal year start)`. If the
      fiscal year ≠ calendar year, derive FY start from the FY rows present.
- id: A.2
  title: 'Consolidation & FX translation (the #1 source of wrong totals)'
  notes: |-
    - `company_financial_metric` is **per legal entity**, each in its own
      `reporting_currency`. To get a **global consolidated** figure you must either
      (a) use the pre-consolidated `GR_HOLDINGS` rows if present, or (b) translate each
      entity to USD with `fx_rate` (`rate_type='SPOT'`, `rate_date = period_date`) and sum.
    - **Do not double count**: if `GR_HOLDINGS` already represents the consolidated
      group, do **not** also add the subsidiary rows. Decide one or the other.
    - **Intercompany eliminations**: summing subsidiary `revenue`/`debt` overstates the
      group because intercompany balances (`intercompany_transaction`) aren't netted at
      entity level. Prefer the consolidated `GR_HOLDINGS` row for true group totals;
      use entity sums only for *operational* (already-external) measures like cash.
    - **Stock vs flow translation**: translate stock metrics at the **period-end spot**;
      flow metrics are ideally average-rate translated, but with only spot available,
      period-end spot is the documented approximation — state it.
- id: A.3
  title: Cash — avoiding the multi-view trap
  notes: |-
    - `cash_balance` has **one row per `(account_ref, balance_date, date_basis,
      includes_actual, includes_intraday, includes_confirmed, includes_estimated)`**.
      Selecting without pinning the flags **multiplies** the same account's cash across
      views. Canonical positions:
      - *Ledger/actual EOD cash*: `date_basis='VALUE_DATE' AND includes_actual AND
        includes_confirmed AND NOT includes_intraday AND NOT includes_estimated`.
      - *Available/projected cash*: also allow `includes_estimated` and `includes_intraday`
        per the question ("projected", "available", "intraday").
    - Reconcile to bank truth via `bank_statement_balance` `balance_type='CLOSING'`
      (filter `quality_status` to clean rows).
    - **Operating cash floor** ("usable" vs "trapped") comes from `liquidity_policy`
      (`policy_type` in MIN_CASH/OPERATING_FLOOR), scoped by `company_ref`/`company_group_ref`.
- id: A.4
  title: Debt, net debt & leverage
  notes: |-
    - **Outstanding debt bottom-up** = SUM `borrowing.principal_amount` where
      `status='OUTSTANDING'` (exclude REPAID). Split ST/LT by `repayment_date` ≤/ > 12 months.
    - **Net debt** = total_debt − cash_and_equivalents (some definitions also subtract
      `short_term_investments`). Report which subtraction you used.
    - **Debt/EBITDA (TTM)** = total_debt(latest) ÷ Σ EBITDA(4 latest Q). The stored
      `debt_to_ebitda` is *period-specific* (often annualized single-quarter) — when the
      user says "TTM", recompute the denominator; show the stored value as a check.
    - **Undrawn committed facility** = `commitment_amount` − Σ outstanding
      `borrowing.principal_amount` for that `facility_ref`. Count only **committed**
      types (`REVOLVING`, `TERM_LOAN`); exclude `OVERDRAFT`/uncommitted lines from
      "committed liquidity". Watch currency: facility ccy vs draw ccy → translate.
- id: A.5
  title: Cost of debt / capital
  notes: |-
    - **WACD bottom-up** = Σ(`all_in_rate` × `principal_amount`) ÷ Σ`principal_amount`
      over `status='OUTSTANDING'`, weighting in a common currency (→USD principal).
      For *forward* cost of undrawn, use `credit_facility.spread_bps` + current
      `benchmark_rate` of the facility's `benchmark_code`/tenor.
    - Floating-rate all-in today = latest `benchmark_rate(benchmark_code, tenor)` +
      `spread_bps`/100. Fixed draws carry their booked `all_in_rate`.
- id: A.6
  title: FX hedge ratio — netting & alignment
  notes: |-
    - Ratio = hedged notional ÷ forecast exposure, **per currency and aligned tenor**.
    - Exposure denominator: `fx_exposure_forecast.gross_exposure_amount` for the
      `exposure_currency`, **latest `snapshot_date`**, summed over the requested
      `forecast_period`/`tenor_bucket`. Net `direction` (LONG−SHORT) if the question is
      about *net* exposure; use gross if "gross exposure".
    - Hedged numerator: prefer `hedge_relationship.notional_amount` where `status='ACTIVE'`
      and `hedged_currency = C` (this respects hedge-accounting designation). Using raw
      `fx_forward` legs instead counts economic (not designated) hedges — state which.
    - Cap the ratio display at sensible bounds; >100% means over-hedged for that bucket.
- id: A.7
  title: Counterparty exposure
  notes: |-
    - `counterparty_exposure` is **already USD** and pre-aggregates deposits +
      investments + derivative MTM into `total_exposure` with `pct_of_total`. Use the
      latest `as_of_date`. Compare `total_exposure` to `bank.cash_exposure_limit_amount`
      for limit breaches; group by `bank.risk_tier_ref` for tiered concentration.
- id: A.8
  title: Working capital decomposition
  notes: |-
    - `CCC = DSO + DIO − DPO`. ΔCCC between periods decomposes additively into ΔDSO,
      ΔDIO, −ΔDPO. Dollarize a driver as `Δdays × (revenue_ttm or cogs_ttm / 365)`:
      DSO/AR uses revenue_ttm; DPO & DIO use cogs_ttm.
    - **No inventory-balance table**: DIO is only available as `dio_days`; implied
      inventory ≈ `dio_days × cogs_ttm / 365`. Flag as derived.
    - "By business segment" → there is no segment dimension; map to **entity**
      (`company_ref`) or **region** (`gen_company_region.region`).
- id: A.9
  title: Share-of-wallet & bank fees
  notes: |-
    - Share of wallet = Σ`bank_fee.charged_amount` by `bank_ref` ÷ grand total over the
      window (→USD). "Fee leakage" = Σ`overage_amount` or `charged_amount − expected_amount`
      where `flagged`. Optionally weight by `bank_service_type.category`.
- id: A.10
  title: Snapshot/vintage hygiene
  notes: |-
    - `forecast_cash_flow`/`forecast_vs_actual` carry multiple `snapshot_id`s; pin to one
      (latest `forecast_snapshot.snapshot_date`) unless explicitly comparing vintages.
    - `fx_exposure_forecast.snapshot_date` likewise — never sum across snapshots.
- id: A.11
  title: Modeled answers (label assumptions)
  notes: |-
    Prompts asking to *optimize*, *stress*, *recommend*, or *project beyond stored
    horizons* combine stored series with scenario logic. Always: (1) pull the stored
    baseline, (2) state the assumption set, (3) keep modeled outputs visibly separate
    from queried facts.

