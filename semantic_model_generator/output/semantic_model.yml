classes:
  AchReturn:
    source_table: lpp.ach_return
    columns:
    - property: amount
      db_column: amount
      type: decimal
    - property: returnCategory
      db_column: return_category
      type: string
    - property: returnDate
      db_column: return_date
      type: date
    - property: returnReasonCode
      db_column: return_reason_code
      type: string
    relationships:
    - property: originalTransfer
      target: Transfer
      db_column: original_transfer_ref
    - property: originatedBy
      target: Company
      db_column: company_ref
  AchTransaction:
    source_table: (sql) lpp.transfer
    sql_query: SELECT UUID FROM LPP.TRANSFER WHERE PAYMENT_RAIL IN ('ACH','SEPA_CT','SEPA_DD')
    subclass_of: PaymentTransaction
  Acquirer:
    source_table: lpp.acquirer
    comment: e.g. Chase Paymentech, Fiserv, Worldpay.
    columns:
    - property: code
      db_column: code
      type: string
    - property: name
      db_column: name
      type: string
    - property: region
      db_column: region
      type: string
    relationships:
    - property: affiliatedBank
      target: Bank
      db_column: bank_ref
    - property: settlementAccount
      target: BankAccount
      db_column: settlement_account_ref
  AcquirerContract:
    source_table: lpp.acquirer_contract
    columns:
    - property: effectiveFrom
      db_column: effective_from
      type: date
    - property: effectiveTo
      db_column: effective_to
      type: date
    - property: processorMarginBps
      db_column: processor_margin_bps
      type: decimal
    - property: settlementLagDays
      db_column: settlement_lag_business_days
      type: integer
    - property: status
      db_column: contract_status
      type: string
    - property: uptimeSlaPct
      db_column: uptime_sla_pct
      type: decimal
    relationships:
    - property: withAcquirer
      target: Acquirer
      db_column: acquirer_ref
  AcquirerSlaMetric:
    source_table: lpp.acquirer_sla_metric
    columns:
    - property: authRatePct
      db_column: auth_rate_pct
      type: decimal
    - property: measurementDate
      db_column: measurement_date
      type: date
    - property: settlementOnTimePct
      db_column: settlement_on_time_pct
      type: decimal
    - property: uptimePct
      db_column: uptime_pct
      type: decimal
    relationships:
    - property: forAcquirer
      target: Acquirer
      db_column: acquirer_ref
  ApInvoice:
    source_table: (sql) lpp.ap_invoice
    sql_query: "WITH maxd AS (SELECT MAX(issue_date) AS d FROM lpp.ap_invoice)\r\n\
      \        SELECT i.uuid FROM lpp.ap_invoice i, maxd\r\n        WHERE i.issue_date\
      \ >= maxd.d - INTERVAL '365 days'"
    columns:
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
  ArInvoice:
    source_table: (sql) lpp.ar_invoice
    sql_query: "WITH maxd AS (SELECT MAX(issue_date) AS d FROM lpp.ar_invoice)\r\n\
      \        SELECT i.uuid FROM lpp.ar_invoice i, maxd\r\n        WHERE i.issue_date\
      \ >= maxd.d - INTERVAL '30 days'"
    columns:
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
  Balance:
    source_table: (sql) lpp.bank_statement_balance
    sql_query: "WITH maxd AS (SELECT MAX(statement_date) AS d FROM lpp.bank_statement_balance)\r\
      \n        SELECT b.account_ref, b.statement_date, b.balance_type\r\n       \
      \ FROM lpp.bank_statement_balance b, maxd\r\n        WHERE b.statement_date\
      \ >= maxd.d - INTERVAL '365 days'"
    columns:
    - property: availableBalance
      db_column: amount
      type: decimal
    - property: closingBalance
      db_column: amount
      type: decimal
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast7Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
    - property: isLatestSnapshot
      db_column: ''
      type: boolean
    - property: openingBalance
      db_column: amount
      type: decimal
  BalanceSnapshot:
    source_table: lpp.cash_balance
    comment: Point-in-time balance for a bank account (opening, closing, average,
      available).
    columns:
    - property: amount
      db_column: amount
      type: decimal
    - property: asOfDate
      db_column: statement_date
      type: date
    - property: asOfDate
      db_column: balance_date
      type: date
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: status
      db_column: quality_status
      type: string
    relationships:
    - property: forAccount
      target: BankAccount
      db_column: account_ref
  Bank:
    source_table: lpp.bank
    sql_query: "SELECT from_entity_code, to_entity_code\r\n        FROM lpp.kg_relationship\r\
      \n        WHERE relationship_type = 'BOARD_MEMBER_OVERLAP' AND status = 'ACTIVE'"
    columns:
    - property: bic
      db_column: bic
      type: string
    - property: code
      db_column: code
      type: string
    - property: lei
      db_column: lei
      type: string
    - property: name
      db_column: description1
      type: string
    relationships:
    - property: brain:boardMemberOverlap
      target: Bank
      db_column: to_entity_code
    - property: brain:sharedParentInstitution
      target: ThirdParty
      db_column: to_entity_code
    - property: brain:sharedParentInstitution
      target: Bank
      db_column: to_entity_code
  BankAccount:
    source_table: lpp.bank_account
    sql_query: "SELECT a.CODE AS ACCOUNT_CODE, b.BANK_REF\r\n        FROM LPP.BANK_ACCOUNT\
      \ a\r\n        JOIN LPP.BANK_BRANCH  b ON a.BRANCH_REF = b.CODE"
    columns:
    - property: code
      db_column: code
      type: string
    relationships:
    - property: atBranch
      target: BankBranch
      db_column: branch_ref
    - property: hasCurrency
      target: Currency
      db_column: currency_ref
    - property: heldAt
      target: Bank
      db_column: bank_ref
    - property: ownedBy
      target: Company
      db_column: company_ref
  BankAccountSignatory:
    source_table: lpp.bank_account_signatory
    columns:
    - property: authorityLimitAmount
      db_column: authority_limit_amount
      type: decimal
    - property: nextRecertifyDueDate
      db_column: next_recertify_due_date
      type: date
    - property: role
      db_column: role
      type: string
    - property: status
      db_column: status
      type: string
    relationships:
    - property: onBankAccount
      target: BankAccount
      db_column: bank_account_ref
    - property: signatoryUser
      target: User
      db_column: user_ref
  BankBranch:
    source_table: lpp.bank_branch
    columns:
    - property: code
      db_column: code
      type: string
    - property: countryCode
      db_column: country_code
      type: string
    relationships:
    - property: branchOf
      target: Bank
      db_column: bank_ref
  BankFee:
    source_table: lpp.bank_fee
    columns:
    - property: asOfDate
      db_column: charge_date
      type: date
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: exceedsRateCard
      db_column: flagged
      type: boolean
    - property: feeAmount
      db_column: charged_amount
      type: decimal
    relationships:
    - property: chargedBy
      target: Bank
      db_column: bank_ref
    - property: feeServiceType
      target: FeeServiceType
      db_column: service_code
    - property: forAccount
      target: BankAccount
      db_column: bank_account_ref
    - property: governedBy
      target: RateCard
      db_column: rate_card_ref
  Bond:
    source_table: (sql) lpp.credit_facility
    sql_query: SELECT CODE FROM LPP.CREDIT_FACILITY WHERE FACILITY_TYPE = 'BOND'
    subclass_of: DebtInstrument
  Branch:
    source_table: (sql) lpp.bank_branch
    sql_query: SELECT CODE, COUNTRY_CODE, REGION FROM LPP.BANK_BRANCH
    relationships:
    - property: inCountry
      target: Country
      db_column: country_code
    - property: inRegion
      target: Region
      db_column: region
  CapitalAllocationActual:
    source_table: lpp.capital_allocation_actual
    columns:
    - property: amount
      db_column: amount
      type: decimal
    - property: bucket
      db_column: bucket
      type: string
    - property: frameworkTargetPct
      db_column: framework_target_pct
      type: decimal
    - property: periodDate
      db_column: period_date
      type: date
    relationships:
    - property: forCompany
      target: Company
      db_column: company_ref
  CardAuthorization:
    source_table: lpp.card_authorization
    columns:
    - property: amount
      db_column: amount
      type: decimal
    - property: auth3dsStatus
      db_column: auth_3ds_status
      type: string
    - property: authDecision
      db_column: decision
      type: string
    - property: authRequestTimestamp
      db_column: auth_request_ts
      type: dateTime
    - property: authResponseTimestamp
      db_column: auth_response_ts
      type: dateTime
    - property: cnpIndicator
      db_column: cnp_indicator
      type: boolean
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: declineReasonCode
      db_column: decline_reason_code
      type: string
    - property: responseTimeMs
      db_column: response_time_ms
      type: integer
    - property: transactionSizeBand
      db_column: transaction_size_band
      type: string
    relationships:
    - property: authForPos
      target: PosTxn
      db_column: pos_transaction_ref
    - property: onNetwork
      target: CardNetwork
      db_column: network_code
    - property: viaAcquirer
      target: Acquirer
      db_column: acquirer_ref
  CardNetwork:
    source_table: lpp.card_network
    subclass_of: Concept
    columns:
    - property: code
      db_column: code
      type: string
    - property: name
      db_column: name
      type: string
    - property: networkType
      db_column: network_type
      type: string
  CardPaymentRollup:
    source_table: (sql) lpp.card_settlement_batch
    sql_query: "SELECT\r\n            acquirer_ref                               \
      \ AS ACQ_CODE,\r\n            network_code                                AS\
      \ NET_CODE,\r\n            CAST(bank_deposit_ts AS DATE)               AS ROLLUP_DATE,\r\
      \n            SUM(gross_sales_amount)                     AS GROSS_SALES,\r\n\
      \            SUM(net_settlement_amount)                  AS NET_SETTLEMENT,\r\
      \n            SUM(interchange_amount)                     AS INTERCHANGE,\r\n\
      \            SUM(network_assessment_amount)              AS NETWORK_ASSESS,\r\
      \n            SUM(processor_margin_amount)                AS PROCESSOR_MARGIN,\r\
      \n            COUNT(*)                                    AS BATCH_COUNT\r\n\
      \        FROM lpp.card_settlement_batch\r\n        WHERE bank_deposit_ts IS\
      \ NOT NULL\r\n        GROUP BY 1, 2, 3"
    comment: Pre-aggregated card settlement totals per (acquirer x network x date).
    columns:
    - property: asOfDate
      db_column: rollup_date
      type: date
    - property: batchCount
      db_column: batch_count
      type: integer
    - property: grossSalesAmount
      db_column: gross_sales
      type: decimal
    - property: interchangeAmount
      db_column: interchange
      type: decimal
    - property: netSettlementAmount
      db_column: net_settlement
      type: decimal
    - property: networkAssessmentAmount
      db_column: network_assess
      type: decimal
    - property: processorMarginAmount
      db_column: processor_margin
      type: decimal
    relationships:
    - property: onNetwork
      target: CardNetwork
      db_column: net_code
    - property: viaAcquirer
      target: Acquirer
      db_column: acq_code
  CardRebateEarning:
    source_table: lpp.card_rebate_earning
    columns:
    - property: eligibleSpend
      db_column: eligible_spend
      type: decimal
    - property: periodDate
      db_column: period_date
      type: date
    - property: rebateEarned
      db_column: rebate_earned
      type: decimal
    - property: spendCategory
      db_column: spend_category
      type: string
    relationships:
    - property: underProgram
      target: CardRebateProgram
      db_column: program_ref
  CardRebateProgram:
    source_table: lpp.card_rebate_program
    columns:
    - property: code
      db_column: code
      type: string
    - property: programType
      db_column: program_type
      type: string
    - property: rebateBpsAtTarget
      db_column: rebate_bps_at_target
      type: decimal
    relationships:
    - property: issuerBank
      target: Bank
      db_column: issuer_bank_ref
  CardSettlementBatch:
    source_table: lpp.card_settlement_batch
    columns:
    - property: bankDepositTimestamp
      db_column: bank_deposit_ts
      type: dateTime
    - property: batchCloseTimestamp
      db_column: batch_close_ts
      type: dateTime
    - property: grossSalesAmount
      db_column: gross_sales_amount
      type: decimal
    - property: interchangeAmount
      db_column: interchange_amount
      type: decimal
    - property: netSettlementAmount
      db_column: net_settlement_amount
      type: decimal
    - property: networkAssessmentAmount
      db_column: network_assessment_amount
      type: decimal
    - property: processorMarginAmount
      db_column: processor_margin_amount
      type: decimal
    - property: processorSettleTimestamp
      db_column: processor_settle_ts
      type: dateTime
    - property: slaMet
      db_column: sla_met
      type: boolean
    relationships:
    - property: onNetwork
      target: CardNetwork
      db_column: network_code
    - property: settledTo
      target: BankAccount
      db_column: bank_account_ref
    - property: viaAcquirer
      target: Acquirer
      db_column: acquirer_ref
  CardSettlementLine:
    source_table: lpp.card_settlement_line
    columns:
    - property: crossBorder
      db_column: cross_border
      type: boolean
    - property: grossAmount
      db_column: gross_amount
      type: decimal
    - property: interchangeBps
      db_column: interchange_bps
      type: decimal
    - property: issuerCountry
      db_column: issuer_country
      type: string
    relationships:
    - property: inBatch
      target: SettleBatch
      db_column: batch_ref
    - property: settlesAuth
      target: CardAuth
      db_column: authorization_ref
  CashFlow:
    source_table: (sql) lpp.cash_flow
    sql_query: "WITH maxd AS (SELECT MAX(value_date) AS d FROM lpp.cash_flow)\r\n\
      \        SELECT c.uuid FROM lpp.cash_flow c, maxd\r\n        WHERE c.value_date\
      \ >= maxd.d - INTERVAL '365 days'"
    columns:
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast7Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
  CashForecast:
    source_table: lpp.forecast_snapshot
    columns:
    - property: asOfDate
      db_column: snapshot_date
      type: date
    - property: code
      db_column: snapshot_id
      type: string
    - property: name
      db_column: description
      type: string
  CashRollup:
    source_table: (sql) lpp.bank_statement_balance
    sql_query: "SELECT\r\n            a.company_ref           AS ENTITY_CODE,\r\n\
      \            b.currency_code         AS CURRENCY,\r\n            b.statement_date\
      \        AS ROLLUP_DATE,\r\n            SUM(b.amount)           AS TOTAL_CASH,\r\
      \n            COUNT(DISTINCT b.account_ref) AS N_ACCOUNTS\r\n        FROM lpp.bank_statement_balance\
      \ b\r\n        JOIN lpp.bank_account a ON b.account_ref = a.code\r\n       \
      \ WHERE b.balance_type = 'CLOSING'\r\n        GROUP BY 1, 2, 3"
    comment: Pre-aggregated total cash per (entity x currency x date).
    columns:
    - property: asOfDate
      db_column: rollup_date
      type: date
    - property: currencyCode
      db_column: currency
      type: string
    - property: nAccounts
      db_column: n_accounts
      type: integer
    - property: totalCash
      db_column: total_cash
      type: decimal
    relationships:
    - property: forEntity
      target: Company
      db_column: entity_code
  Chargeback:
    source_table: lpp.chargeback
    columns:
    - property: amount
      db_column: amount
      type: decimal
    - property: classification
      db_column: classification
      type: string
    - property: initiatedDate
      db_column: initiated_date
      type: date
    - property: reasonCategory
      db_column: reason_category
      type: string
    - property: reasonCode
      db_column: reason_code
      type: string
    - property: resolvedDate
      db_column: resolved_date
      type: date
    - property: status
      db_column: status
      type: string
    relationships:
    - property: disputesAuth
      target: CardAuth
      db_column: authorization_ref
    - property: onNetwork
      target: CardNetwork
      db_column: network_code
    - property: viaAcquirer
      target: Acquirer
      db_column: acquirer_ref
  CheckPayment:
    source_table: (sql) lpp.transfer
    sql_query: SELECT UUID FROM LPP.TRANSFER WHERE PAYMENT_RAIL = 'CHECK'
    subclass_of: PaymentTransaction
  CommercialPaperProgram:
    source_table: (sql) lpp.credit_facility
    sql_query: SELECT CODE FROM LPP.CREDIT_FACILITY WHERE FACILITY_TYPE IN ('CP_PROGRAM','COMMERCIAL_PAPER')
    subclass_of: DebtInstrument
  Company:
    source_table: lpp.company
    sql_query: "SELECT from_entity_code, to_entity_code\r\n        FROM lpp.kg_relationship\r\
      \n        WHERE relationship_type = 'NEGOTIATING_HISTORY' AND status = 'ACTIVE'"
    columns:
    - property: code
      db_column: code
      type: string
    - property: countryCode
      db_column: country
      type: string
    - property: lei
      db_column: lei
      type: string
    - property: name
      db_column: name
      type: string
    relationships:
    - property: brain:negotiatingHistory
      target: Bank
      db_column: to_entity_code
    - property: brain:strategicVendorTier
      target: ThirdParty
      db_column: to_entity_code
  CompanyFinancialMetric:
    source_table: lpp.company_financial_metric
    columns:
    - property: debtToEbitda
      db_column: debt_to_ebitda
      type: decimal
    - property: dilutedEps
      db_column: diluted_eps
      type: decimal
    - property: dilutedSharesOutstanding
      db_column: diluted_shares_outstanding
      type: decimal
    - property: ebitda
      db_column: ebitda
      type: decimal
    - property: freeCashFlow
      db_column: free_cash_flow
      type: decimal
    - property: netDebt
      db_column: net_debt
      type: decimal
    - property: periodDate
      db_column: period_date
      type: date
    - property: periodType
      db_column: period_type
      type: string
    - property: revenue
      db_column: revenue
      type: decimal
    - property: waccPct
      db_column: wacc_pct
      type: decimal
    relationships:
    - property: forCompany
      target: Company
      db_column: company_ref
  ConcentrationAccount:
    source_table: (sql) lpp.bank_account
    sql_query: SELECT CODE FROM LPP.BANK_ACCOUNT WHERE ACCOUNT_PURPOSE = 'CONCENTRATION'
    subclass_of: BankAccount
  Counterparty:
    source_table: lpp.third_party
    columns:
    - property: code
      db_column: code
      type: string
    - property: name
      db_column: name
      type: string
  CounterpartyExposure:
    source_table: lpp.counterparty_exposure
    comment: Materialized total exposure to a bank as of a date. Often derivable from
      instruments via SPARQL, but stored when reported.
    columns:
    - property: amount
      db_column: total_exposure
      type: decimal
    - property: asOfDate
      db_column: as_of_date
      type: date
    - property: currencyCode
      db_column: reporting_currency
      type: string
    relationships:
    - property: counterparty
      target: Bank
      db_column: counterparty_bank_ref
  Country:
    source_table: (sql) lpp.company
    sql_query: "SELECT DISTINCT COUNTRY AS COUNTRY_CODE FROM LPP.COMPANY\r\n     \
      \   WHERE COUNTRY IS NOT NULL\r\n        UNION\r\n        SELECT DISTINCT COUNTRY_CODE\
      \ FROM LPP.BANK_BRANCH\r\n        WHERE COUNTRY_CODE IS NOT NULL"
    columns:
    - property: countryCode
      db_column: country_code
      type: string
  CreditFacility:
    source_table: lpp.credit_facility
    subclass_of: DebtInstrument
    columns:
    - property: code
      db_column: code
      type: string
    - property: expirationDate
      db_column: maturity_date
      type: date
    - property: maturityDate
      db_column: maturity_date
      type: date
    - property: principalAmount
      db_column: commitment_amount
      type: decimal
    - property: rateBenchmark
      db_column: benchmark_code
      type: string
    - property: rateSpread
      db_column: spread_bps
      type: decimal
    - property: status
      db_column: status
      type: string
    - property: tradeDate
      db_column: start_date
      type: date
    relationships:
    - property: hasCurrency
      target: Currency
      db_column: currency_ref
    - property: lender
      target: Bank
      db_column: lender_bank_ref
    - property: tradedBy
      target: Company
      db_column: company_ref
  CreditRating:
    source_table: lpp.credit_rating
    columns:
    - property: agency
      db_column: agency
      type: string
    - property: asOfDate
      db_column: as_of_date
      type: date
    - property: isCurrent
      db_column: is_current
      type: boolean
    - property: outlook
      db_column: outlook
      type: string
    - property: ratingGrade
      db_column: rating_grade
      type: string
    relationships:
    - property: forCompany
      target: Company
      db_column: company_ref
  CrossBorderPaymentLeg:
    source_table: lpp.cross_border_payment_leg
    columns:
    - property: corridor
      db_column: corridor
      type: string
    - property: destinationCountry
      db_column: destination_country
      type: string
    - property: fxSpreadBps
      db_column: fx_spread_bps
      type: decimal
    - property: liftingFees
      db_column: lifting_fees
      type: decimal
    - property: originationCountry
      db_column: origination_country
      type: string
  Currency:
    source_table: lpp.currency
    columns:
    - property: code
      db_column: code
      type: string
    - property: name
      db_column: description
      type: string
  Customer:
    source_table: (sql) lpp.third_party
    sql_query: SELECT CODE FROM LPP.THIRD_PARTY WHERE DEBTOR = TRUE
    subclass_of: Counterparty
  DebtMaturity:
    source_table: lpp.borrowing
    comment: Scheduled principal repayment on a debt instrument.
    columns:
    - property: allInCost
      db_column: all_in_rate
      type: decimal
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: drawnAmount
      db_column: principal_amount
      type: decimal
    - property: maturityDate
      db_column: repayment_date
      type: date
    - property: principalAmount
      db_column: principal_amount
      type: decimal
    - property: status
      db_column: status
      type: string
    - property: tradeDate
      db_column: drawdown_date
      type: date
    relationships:
    - property: scheduledOn
      target: DebtInstrument
      db_column: facility_ref
    - property: tradedBy
      target: Company
      db_column: company_ref
  DerivativeMtm:
    source_table: lpp.derivative_mtm
    comment: Periodic valuation of a derivative deal against a counterparty bank.
    columns:
    - property: asOfDate
      db_column: valuation_date
      type: date
    - property: currencyCode
      db_column: mtm_currency
      type: string
    - property: mtmAmount
      db_column: mtm_amount
