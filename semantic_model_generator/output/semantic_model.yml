  PaymentMethodRollup:
    source:
      type: sql_query
      tables:
      - lpp.transfer
      sql: "SELECT\r\n            payment_rail                                                AS METHOD,\r\n            value_date\
        \                                                  AS ROLLUP_DATE,\r\n            COUNT(*)                       \
        \                             AS TXN_COUNT,\r\n            SUM(amount)                                           \
        \      AS TXN_VALUE,\r\n            1.0 * SUM(CASE WHEN status IN ('SETTLED','COMPLETED','ACK')\r\n              \
        \             THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0)      AS SUCCESS_RATE,\r\n            1.0 * SUM(CASE WHEN status\
        \ IN ('REPAIR','REPAIRED','MANUAL_REPAIR')\r\n                           THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0) \
        \     AS REPAIR_RATE\r\n        FROM lpp.transfer\r\n        WHERE payment_rail IS NOT NULL AND value_date IS NOT\
        \ NULL\r\n        GROUP BY 1, 2"
    ontology_class: lpp:PaymentMethodRollup
    columns:
      repair_rate:
        predicate: lpp:repairRate
        type: decimal
      rollup_date:
        predicate: lpp:asOfDate
        type: date
      success_rate:
        predicate: lpp:successRate
        type: decimal
      txn_count:
        predicate: lpp:txnCount
        type: integer
      txn_value:
        predicate: lpp:txnValue
        type: decimal
    connections:
