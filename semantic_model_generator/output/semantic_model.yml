  PaymentMethodRollup:
    source_table: (sql) lpp.transfer
    sql_query: "SELECT\r\n            payment_rail                               \
      \                 AS METHOD,\r\n            value_date                     \
      \                             AS ROLLUP_DATE,\r\n            COUNT(*)      \
      \                                              AS TXN_COUNT,\r\n           \
      \ SUM(amount)                                                 AS TXN_VALUE,\r\
      \n            1.0 * SUM(CASE WHEN status IN ('SETTLED','COMPLETED','ACK')\r\n\
      \                           THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0)      AS\
      \ SUCCESS_RATE,\r\n            1.0 * SUM(CASE WHEN status IN ('REPAIR','REPAIRED','MANUAL_REPAIR')\r\
      \n                           THEN 1 ELSE 0 END) / NULLIF(COUNT(*),0)      AS\
      \ REPAIR_RATE\r\n        FROM lpp.transfer\r\n        WHERE payment_rail IS\
      \ NOT NULL AND value_date IS NOT NULL\r\n        GROUP BY 1, 2"
    comment: Pre-aggregated payment throughput per (rail x date).
    columns:
    - property: asOfDate
      db_column: rollup_date
      type: date
    - property: repairRate
      db_column: repair_rate
      type: decimal
    - property: successRate
      db_column: success_rate
      type: decimal
    - property: txnCount
      db_column: txn_count
      type: integer
    - property: txnValue
      db_column: txn_value
      type: decimal
    relationships:
    - property: paymentMethod
      target: PaymentMethod
      db_column: method
