    source_table: (sql) lpp.credit_facility
    sql_query: SELECT CODE FROM LPP.CREDIT_FACILITY WHERE FACILITY_TYPE = 'REVOLVER'
    subclass_of: CreditFacility
  RtpTransaction:
    source_table: (sql) lpp.transfer
    sql_query: SELECT UUID FROM LPP.TRANSFER WHERE PAYMENT_RAIL = 'RTP'
    subclass_of: PaymentTransaction
  ScenarioAssumption:
    source_table: lpp.stress_run_result
    columns:
    - property: asOfDate
      db_column: breach_date
      type: date
    - property: cashFlowImpact
      db_column: min_projected_cash
      type: decimal
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: status
      db_column: breach_severity
      type: string
    relationships:
    - property: forEntity
      target: Company
      db_column: company_ref
    - property: underScenario
      target: Scenario
      db_column: scenario_ref
  SettleBatch:
    source_table: (sql) lpp.card_settlement_batch
    sql_query: "WITH maxd AS (SELECT MAX(CAST(bank_deposit_ts AS DATE)) AS d FROM\
      \ lpp.card_settlement_batch)\r\n        SELECT b.uuid FROM lpp.card_settlement_batch\
      \ b, maxd\r\n        WHERE CAST(b.bank_deposit_ts AS DATE) >= maxd.d - INTERVAL\
      \ '365 days'"
    columns:
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast7Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
  StressTest:
    source_table: lpp.stress_scenario
    subclass_of: Scenario
    columns:
    - property: code
      db_column: code
      type: string
    - property: name
      db_column: description
      type: string
    - property: scenarioType
      db_column: scenario_type
      type: string
  SweepEvent:
    source_table: lpp.sweep_execution
    sql_query: "WITH maxd AS (SELECT MAX(execution_date) AS d FROM lpp.sweep_execution)\r\
      \n        SELECT s.uuid FROM lpp.sweep_execution s, maxd\r\n        WHERE s.execution_date\
      \ >= maxd.d - INTERVAL '90 days'"
    comment: Movement from a subsidiary or collection account into a concentration
      account, executed under a sweep rule.
    columns:
    - property: amount
      db_column: swept_amount
      type: decimal
    - property: asOfDate
      db_column: execution_date
      type: date
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast7Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
    - property: status
      db_column: status
      type: string
    relationships:
    - property: appliesRule
      target: SweepRule
      db_column: instruction_ref
    - property: destinationAccount
      target: BankAccount
      db_column: target_account_ref
    - property: sourceAccount
      target: BankAccount
      db_column: source_account_ref
  SweepRule:
    source_table: lpp.sweep_instruction
    comment: Configuration governing target balance, threshold, frequency, and direction
      for a sweep.
    columns:
    - property: TargetBalance
      db_column: target_balance
      type: decimal
    - property: code
      db_column: code
      type: string
    - property: currencyCode
      db_column: target_balance_ccy
      type: string
    - property: minimumThreshold
      db_column: threshold_amount
      type: decimal
    relationships:
    - property: destinationAccount
      target: BankAccount
      db_column: target_account_ref
    - property: sourceAccount
      target: BankAccount
      db_column: source_account_ref
  TermLoan:
    source_table: (sql) lpp.credit_facility
    sql_query: SELECT CODE FROM LPP.CREDIT_FACILITY WHERE FACILITY_TYPE = 'TERM_LOAN'
    subclass_of: CreditFacility
  ThirdParty:
    source_table: (sql) lpp.kg_relationship
    sql_query: "SELECT from_entity_code, to_entity_code\r\n        FROM lpp.kg_relationship\r\
      \n        WHERE relationship_type = 'SUPPLIER_SUBSTITUTION_RISK' AND status\
      \ = 'ACTIVE'"
    relationships:
    - property: brain:supplierSubstitutionRisk
      target: ThirdParty
      db_column: to_entity_code
  Transaction:
    source_table: lpp.cash_flow
    comment: Abstract parent for any monetary movement.
    columns:
    - property: amount
      db_column: flow_amount
      type: decimal
    - property: currencyCode
      db_column: flow_currency
      type: string
    - property: reference
      db_column: reference
      type: string
    - property: status
      db_column: status
      type: string
    - property: tradeDate
      db_column: transaction_date
      type: date
    - property: valueDate
      db_column: value_date
      type: date
    relationships:
    - property: fromAccount
      target: BankAccount
      db_column: account_ref
  Transfer:
    source_table: (sql) lpp.transfer
    sql_query: "WITH maxd AS (SELECT MAX(value_date) AS d FROM lpp.transfer)\r\n \
      \       SELECT t.uuid FROM lpp.transfer t, maxd\r\n        WHERE t.value_date\
      \ >= maxd.d - INTERVAL '7 days'"
    columns:
    - property: inLast30Days
      db_column: ''
      type: boolean
    - property: inLast7Days
      db_column: ''
      type: boolean
    - property: inLast90Days
      db_column: ''
      type: boolean
    - property: inLastYear
      db_column: ''
      type: boolean
  User:
    source_table: (sql) lpp.kg_relationship
    sql_query: "SELECT from_entity_code, to_entity_code\r\n        FROM lpp.kg_relationship\r\
      \n        WHERE relationship_type = 'KNOWLEDGE_OWNER_OF'\r\n          AND from_entity_type\
      \ = 'APP_USER' AND to_entity_type = 'HEDGE_RELATIONSHIP'\r\n          AND status\
      \ = 'ACTIVE'"
    relationships:
    - property: brain:knowledgeOwnerOf
      target: Hedge
      db_column: to_entity_code
    - property: brain:knowledgeOwnerOf
      target: CreditFacility
      db_column: to_entity_code
    - property: brain:rmRelationship
      target: Bank
      db_column: to_entity_code
  Vendor:
    source_table: (sql) lpp.third_party
    sql_query: SELECT CODE FROM LPP.THIRD_PARTY WHERE CREDITOR = TRUE
    subclass_of: Counterparty
  VendorPaymentRollup:
    source_table: (sql) lpp.ap_invoice
    sql_query: "SELECT\r\n            vendor_ref                                 \
      \             AS VENDOR_CODE,\r\n            TO_CHAR(DATE_TRUNC('month', issue_date),\
      \ 'YYYY-MM')     AS YEAR_MONTH,\r\n            SUM(invoice_amount)         \
      \                            AS TOTAL_BILLED,\r\n            SUM(COALESCE(paid_amount,\
      \ 0))                           AS TOTAL_PAID,\r\n            1.0 * SUM(CASE\
      \ WHEN paid_date IS NOT NULL\r\n                            AND paid_date <=\
      \ due_date THEN 1 ELSE 0 END)\r\n                  / NULLIF(COUNT(*), 0)   \
      \                          AS ON_TIME_RATE\r\n        FROM lpp.ap_invoice\r\n\
      \        WHERE vendor_ref IS NOT NULL AND issue_date IS NOT NULL\r\n       \
      \ GROUP BY 1, 2"
    comment: Pre-aggregated payables per (vendor x month).
    columns:
    - property: onTimeRate
      db_column: on_time_rate
      type: decimal
    - property: periodMonth
      db_column: year_month
      type: string
    - property: totalBilled
      db_column: total_billed
      type: decimal
    - property: totalPaid
      db_column: total_paid
      type: decimal
    relationships:
    - property: vendor
      target: Counterparty
      db_column: vendor_code
  WireTransfer:
    source_table: (sql) lpp.transfer
    sql_query: SELECT UUID FROM LPP.TRANSFER WHERE PAYMENT_RAIL = 'WIRE'
    subclass_of: PaymentTransaction
  WorkingCapitalMetric:
    source_table: lpp.working_capital_metric
    comment: DSO, DPO, DIO, CCC computed for an entity over a period.
    columns:
    - property: asOfDate
      db_column: period_date
      type: date
    - property: currencyCode
      db_column: currency_code
      type: string
    - property: dioDays
      db_column: dio_days
      type: decimal
    - property: dpoDays
      db_column: dpo_days
      type: decimal
    - property: dsoDays
      db_column: dso_days
      type: decimal
    relationships:
    - property: forEntity
      target: Company
      db_column: company_ref
  brain:BehavioralPattern:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'BEHAVIORAL_PATTERN'
  brain:Evaluation:
    source_table: lpp.brain_evaluation
    columns:
    - property: brain:answerSummary
      db_column: answer_summary
      type: string
    - property: brain:evaluatedAt
      db_column: evaluated_at
      type: dateTime
    - property: brain:expansionHops
      db_column: expansion_hops
      type: integer
    - property: brain:queryText
      db_column: query_text
      type: string
    relationships:
    - property: prov:wasAssociatedWith
      target: User
      db_column: user_code
  brain:RMSignal:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'RM_SIGNAL'
  brain:SideAgreement:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'SIDE_AGREEMENT'
  brain:StrategicPreference:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'STRATEGIC_PREFERENCE'
  brain:TribalFact:
    source_table: lpp.tribal_knowledge_fact
    columns:
    - property: brain:confidence
      db_column: confidence
      type: string
    - property: brain:effectiveFrom
      db_column: effective_from
      type: date
    - property: brain:effectiveTo
      db_column: effective_to
      type: date
    - property: brain:factType
      db_column: fact_type
      type: string
    - property: brain:narrative
      db_column: narrative
      type: string
    - property: brain:status
      db_column: status
      type: string
    - property: brain:title
      db_column: title
      type: string
    - property: brain:triggerCondition
      db_column: trigger_condition
      type: string
    - property: prov:generatedAtTime
      db_column: captured_at
      type: dateTime
    relationships:
    - property: brain:supersededBy
      target: Fact
      db_column: superseded_by
    - property: prov:wasAttributedTo
      target: User
      db_column: captured_by_user
    - property: prov:wasGeneratedBy
      target: Session
      db_column: source_session
  brain:UndocumentedConstraint:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'UNDOCUMENTED_CONSTRAINT'
  brain:VerbalCommitment:
    source_table: (sql) lpp.tribal_knowledge_fact
    sql_query: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'VERBAL_COMMITMENT'
  prov:Activity:
    source_table: lpp.sme_feedback_session
    columns:
    - property: brain:topic
      db_column: topic
      type: string
    - property: prov:endedAtTime
      db_column: ended_at
      type: dateTime
    - property: prov:startedAtTime
      db_column: started_at
      type: dateTime
    relationships:
    - property: brain:transcriptUri
      target: '?'
      db_column: transcript_uri
    - property: prov:wasAssociatedWith
      target: User
      db_column: sme_user
