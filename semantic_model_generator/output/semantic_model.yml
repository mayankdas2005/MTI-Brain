      tables:
      - lpp.bank_account
      - lpp.bank_statement_balance
      sql: "SELECT\r\n            a.company_ref           AS ENTITY_CODE,\r\n            b.currency_code         AS CURRENCY,\r\
        \n            b.statement_date        AS ROLLUP_DATE,\r\n            SUM(b.amount)           AS TOTAL_CASH,\r\n  \
