  BalanceLatestFlag:
    source:
      type: sql_query
      tables:
      - lpp.bank_statement_balance
      sql: "SELECT b.account_ref, b.statement_date, b.balance_type\r\n        FROM lpp.bank_statement_balance b\r\n      \
        \  JOIN (\r\n            SELECT account_ref, balance_type, MAX(statement_date) AS maxd\r\n            FROM lpp.bank_statement_balance\r\
        \n            GROUP BY 1, 2\r\n        ) m\r\n          ON  b.account_ref  = m.account_ref\r\n          AND b.balance_type\
        \ = m.balance_type\r\n          AND b.statement_date = m.maxd"
