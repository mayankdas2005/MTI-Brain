  VerbalCommitment:
    source:
      type: sql_query
      tables:
      - lpp.tribal_knowledge_fact
      sql: SELECT uuid FROM lpp.tribal_knowledge_fact WHERE fact_type = 'VERBAL_COMMITMENT'
    ontology_class: brain:VerbalCommitment
    named_graph: https://lpp.example/graph/treasury/brain
  WcfDocument:
    source:
      type: table
      table: lpp.wcf_document
    ontology_class: lpp:Invoice
    columns:
      amount:
        predicate: lpp:invoiceAmount
        type: decimal
      currency_code:
        predicate: lpp:currencyCode
        type: varchar
      document_number:
        predicate: lpp:reference
        type: varchar
      due_date:
        predicate: lpp:dueDate
        type: date
      issue_date:
        predicate: lpp:invoiceDate
        type: date
      status:
        predicate: lpp:status
        type: varchar
    connections:
    - predicate: lpp:billedFrom
      via_columns:
      - supplier_ref
      target_entity_type: third-party
      iri_template: https://lpp.example/id/third-party/{SUPPLIER_REF}
    - predicate: lpp:tradedBy
      via_columns:
      - buyer_company
      target_entity_type: company
      iri_template: https://lpp.example/id/company/{BUYER_COMPANY}
  WorkingCapitalMetric:
    source:
      type: table
      table: lpp.working_capital_metric
    ontology_class: lpp:WorkingCapitalMetric
    columns:
      currency_code:
        predicate: lpp:currencyCode
        type: varchar
      dio_days:
        predicate: lpp:dioDays
        type: decimal
      dpo_days:
        predicate: lpp:dpoDays
        type: decimal
      dso_days:
        predicate: lpp:dsoDays
        type: decimal
      period_date:
        predicate: lpp:asOfDate
        type: date
    connections:
    - predicate: lpp:forEntity
      via_columns:
      - company_ref
      target_entity_type: company
      iri_template: https://lpp.example/id/company/{COMPANY_REF}
