    source:
      type: sql_query
      tables:
      - lpp.ap_invoice
      sql: "WITH maxd AS (SELECT MAX(issue_date) AS d FROM lpp.ap_invoice)\r\n        SELECT i.uuid FROM lpp.ap_invoice i,\
        \ maxd\r\n        WHERE i.issue_date >= maxd.d - INTERVAL '30 days'"
  ApInvoiceInLast90:
    source:
