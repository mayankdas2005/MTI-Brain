metadata:
  version: '1.0'
  source_files:
    ontology: lpp-ontology.ttl
    r2rml: lpp-r2rml.ttl
  description: Semantic model extracted directly from LPP ontology (lpp-ontology.ttl) and R2RML mappings (lpp-r2rml.ttl) using
    rdflib. Ontology section lists all OWL classes, object properties, and datatype properties. Business subdomains section
    maps each R2RML TriplesMap to its source table/SQL, columns (predicate + type), and connections (FK links to other entities).
ontology:
