      tables:
      - lpp.ap_invoice
      sql: "SELECT\r\n            vendor_ref                                              AS VENDOR_CODE,\r\n            TO_CHAR(DATE_TRUNC('month',\
        \ issue_date), 'YYYY-MM')     AS YEAR_MONTH,\r\n            SUM(invoice_amount)                                  \
        \   AS TOTAL_BILLED,\r\n            SUM(COALESCE(paid_amount, 0))                           AS TOTAL_PAID,\r\n   \
        \         1.0 * SUM(CASE WHEN paid_date IS NOT NULL\r\n                            AND paid_date <= due_date THEN\
        \ 1 ELSE 0 END)\r\n                  / NULLIF(COUNT(*), 0)                             AS ON_TIME_RATE\r\n       \
        \ FROM lpp.ap_invoice\r\n        WHERE vendor_ref IS NOT NULL AND issue_date IS NOT NULL\r\n        GROUP BY 1, 2"
    ontology_class: lpp:VendorPaymentRollup
    columns:
      on_time_rate:
        predicate: lpp:onTimeRate
        type: decimal
      total_billed:
        predicate: lpp:totalBilled
        type: decimal
      total_paid:
        predicate: lpp:totalPaid
        type: decimal
