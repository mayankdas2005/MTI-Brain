    source:
      type: sql_query
      tables:
      - lpp.card_settlement_batch
      sql: "SELECT\r\n            acquirer_ref                                AS ACQ_CODE,\r\n            network_code   \
        \                             AS NET_CODE,\r\n            CAST(bank_deposit_ts AS DATE)               AS ROLLUP_DATE,\r\
        \n            SUM(gross_sales_amount)                     AS GROSS_SALES,\r\n            SUM(net_settlement_amount)\
        \                  AS NET_SETTLEMENT,\r\n            SUM(interchange_amount)                     AS INTERCHANGE,\r\
        \n            SUM(network_assessment_amount)              AS NETWORK_ASSESS,\r\n            SUM(processor_margin_amount)\
        \                AS PROCESSOR_MARGIN,\r\n            COUNT(*)                                    AS BATCH_COUNT\r\n\
        \        FROM lpp.card_settlement_batch\r\n        WHERE bank_deposit_ts IS NOT NULL\r\n        GROUP BY 1, 2, 3"
    ontology_class: lpp:CardPaymentRollup
    columns:
      batch_count:
        predicate: lpp:batchCount
        type: integer
      gross_sales:
        predicate: lpp:grossSalesAmount
        type: decimal
      interchange:
        predicate: lpp:interchangeAmount
