tables:
- name: ach_return
  schema: lpp
  row_count: 417
  size_mb: 360
  dist_style: KEY(company_ref)
  primary_keys:
  - uuid
  columns:
  - name: uuid
    data_type: character varying(64)
    ordinal_position: 1
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Unique system-generated identifier for each ACH return record.
  - name: original_transfer_ref
    data_type: character varying(64)
    ordinal_position: 2
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Reference identifier of the original ACH transfer that was returned,
      linking the return to its source payment.
  - name: company_ref
    data_type: character varying(64)
    ordinal_position: 3
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Code identifying the legal entity or subsidiary within the group
      that owns the returned ACH transaction, such as GR_US_INC for the US incorporated
      entity or GR_TREASURY for the treasury entity.
  - name: business_unit_code
    data_type: character varying(32)
    ordinal_position: 4
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Code identifying the business unit responsible for the returned ACH
      transaction, such as BU_TREAS for the treasury unit or BU_US_IN for the US incorporated
      business unit.
  - name: return_date
    data_type: date
    ordinal_position: 5
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The calendar date on which the ACH return was received or processed.
  - name: return_reason_code
    data_type: character varying(8)
    ordinal_position: 6
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Standardized NACHA return reason code indicating why the ACH transaction
      was returned, such as R01 for insufficient funds or R29 for corporate customer
      advises not authorized.
  - name: return_category
    data_type: character varying(32)
    ordinal_position: 7
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Business grouping of the return reason, classifying returns into
      broad categories such as insufficient funds, invalid account, unauthorized,
      or other.
  - name: direction
    data_type: character varying(8)
    ordinal_position: 8
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Indicates the flow direction of the returned ACH transaction; currently
      only debit returns are recorded.
  - name: amount
    data_type: numeric(28,6)
    ordinal_position: 9
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The monetary value of the returned ACH transaction in the transaction's
      currency.
  - name: currency_code
    data_type: character varying(16)
    ordinal_position: 10
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: ISO 4217 three-letter currency code denoting the currency of the
      returned ACH transaction, such as USD, EUR, or GBP.
  - name: bank_account_ref
    data_type: character varying(64)
    ordinal_position: 11
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Reference code identifying the specific bank account associated with
      the returned ACH transaction, such as GR_CA_PAYROLL_1 for the Canada payroll
      account or IHB_AUD_CONCENTRATION for the AUD concentration account.
  - name: resolved
    data_type: boolean
    ordinal_position: 12
    nullable: true
    default: 'false'
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Boolean flag indicating whether the ACH return has been resolved
      or actioned by the operations team.
  description: This table records ACH (Automated Clearing House) payment returns —
    transactions that were initiated but subsequently returned by the receiving bank.
    One row represents a single ACH return event, capturing the reason for return,
    the originating company and bank account, and whether the return has been resolved.
    Key identifiers include uuid (primary key), original_transfer_ref (linking back
    to the originating payment), company_ref, and bank_account_ref.
- name: acquirer
  schema: lpp
  row_count: 8
  size_mb: 22
  dist_style: ALL
  primary_keys:
  - uuid
  columns:
  - name: uuid
    data_type: character varying(64)
    ordinal_position: 1
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Unique system-generated identifier for each acquirer record.
  - name: code
    data_type: character varying(32)
    ordinal_position: 2
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Short internal code used to identify a payment acquirer, such as
      ADYEN, STRIPE, or FIS_WORLDPAY.
  - name: name
    data_type: character varying(256)
    ordinal_position: 3
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Full legal or trading name of the payment acquirer, such as Adyen
      NV or JPMorgan Chase Merchant Services.
  - name: bank_ref
    data_type: character varying(64)
    ordinal_position: 4
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Reference code identifying the sponsoring or partner bank associated
      with the acquirer, present only for bank-affiliated acquirers.
  - name: settlement_account_ref
    data_type: character varying(64)
    ordinal_position: 5
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Reference code identifying the internal operating account into which
      settlement funds from this acquirer are deposited.
  - name: region
    data_type: character varying(16)
    ordinal_position: 6
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Geographic region in which the acquirer primarily operates, such
      as AMER (Americas) or EMEA (Europe, Middle East & Africa).
  - name: is_strategic
    data_type: boolean
    ordinal_position: 7
    nullable: true
    default: 'false'
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Flag indicating whether this acquirer is classified as a strategic
      partner for the business.
  - name: onboarded_date
    data_type: date
    ordinal_position: 8
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The date on which the acquirer was formally onboarded and activated
      for use in payment processing.
  description: This table is a reference list of payment acquirers and processors
    that the business uses to accept card and electronic payments. One row represents
    a single acquirer entity, capturing its identity, regional scope, strategic classification,
    and the settlement account into which funds flow. Key identifiers include uuid
    (primary key) and code (e.g., ADYEN, STRIPE, CHASE_PAYTECH).
- name: acquirer_contract
  schema: lpp
  row_count: 12
  size_mb: 36
  dist_style: ALL
  primary_keys:
  - uuid
  columns:
  - name: uuid
    data_type: character varying(64)
    ordinal_position: 1
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Unique system-generated identifier for each acquirer contract record.
  - name: acquirer_ref
    data_type: character varying(32)
    ordinal_position: 2
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Code identifying the payment acquirer or processor party to the contract
      (e.g., ADYEN, STRIPE, FIS_WORLDPAY).
  - name: company_ref
    data_type: character varying(64)
    ordinal_position: 3
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Code identifying the legal entity of the company that holds the acquirer
      contract (e.g., GR_US_INC, GR_EU_BV).
  - name: effective_from
    data_type: date
    ordinal_position: 4
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Date on which the acquirer contract becomes or became effective.
  - name: effective_to
    data_type: date
    ordinal_position: 5
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Date on which the acquirer contract expires or is scheduled to end;
      null indicates an open-ended contract.
  - name: contract_status
    data_type: character varying(16)
    ordinal_position: 6
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Current lifecycle status of the acquirer contract (e.g., ACTIVE).
  - name: processor_margin_bps
    data_type: numeric(9,2)
    ordinal_position: 7
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The acquirer's processing margin charged to the merchant, expressed
      in basis points.
  - name: monthly_minimum_amount
    data_type: numeric(28,6)
    ordinal_position: 8
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Minimum monthly fee amount committed to the acquirer under the contract
      terms.
  - name: monthly_minimum_currency
    data_type: character varying(16)
    ordinal_position: 9
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: ISO currency code in which the monthly minimum fee amount is denominated
      (e.g., USD, EUR, GBP).
  - name: settlement_lag_business_days
    data_type: smallint(16)
    ordinal_position: 10
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Number of business days between transaction processing and when funds
      are received from the acquirer.
  - name: uptime_sla_pct
    data_type: numeric(6,3)
    ordinal_position: 11
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Contractually guaranteed minimum uptime percentage for the acquirer's
      payment processing service.
  - name: auth_response_sla_ms
    data_type: integer(32)
    ordinal_position: 12
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Maximum authorization response time in milliseconds guaranteed by
      the acquirer under the contract SLA.
  - name: settlement_sla_business_days
    data_type: smallint(16)
    ordinal_position: 13
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Maximum number of business days within which the acquirer is contractually
      obligated to settle funds.
  - name: renewal_notice_days
    data_type: smallint(16)
    ordinal_position: 14
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Number of days advance notice required before contract expiry to
      trigger or prevent renewal.
  - name: auto_renew
    data_type: boolean
    ordinal_position: 15
    nullable: true
    default: 'false'
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Flag indicating whether the acquirer contract automatically renews
      at the end of its term.
  description: This table stores the contractual agreements between the company's
    legal entities and their payment acquirers, including commercial terms such as
    processing margin, settlement lag, monthly minimums, and SLA commitments. One
    row represents a single contract between a specific company entity and an acquirer,
    valid for a defined effective date range. Key identifiers include uuid (primary
    key), acquirer_ref, and company_ref.
- name: acquirer_sla_metric
  schema: lpp
  row_count: 6240
  size_mb: 192
  dist_style: KEY(acquirer_ref)
  primary_keys:
  - measurement_date
  - measurement_date
  - acquirer_ref
  - acquirer_ref
  columns:
  - name: uuid
    data_type: character varying(64)
    ordinal_position: 1
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Universally unique identifier assigned to each SLA metric record
      for deduplication and reference purposes.
  - name: acquirer_ref
    data_type: character varying(32)
    ordinal_position: 2
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Standardized code identifying the payment acquirer or processor (e.g.,
      Stripe, Adyen, Fiserv) whose SLA performance is being measured.
  - name: measurement_date
    data_type: date
    ordinal_position: 3
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The calendar date on which the SLA metrics for the acquirer were
      recorded or evaluated.
  - name: auth_rate_pct
    data_type: numeric(6,3)
    ordinal_position: 4
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The percentage of payment authorization attempts that were successfully
      approved by the acquirer on the measurement date.
  - name: avg_response_time_ms
    data_type: integer(32)
    ordinal_position: 5
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The average time in milliseconds taken by the acquirer to respond
      to transaction authorization requests on the measurement date.
  - name: settlement_on_time_pct
    data_type: numeric(6,3)
    ordinal_position: 6
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The percentage of settlements completed by the acquirer within the
      contractually agreed timeframe on the measurement date.
  - name: uptime_pct
    data_type: numeric(6,3)
    ordinal_position: 7
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The percentage of time the acquirer's payment processing systems
      were operational and available on the measurement date.
  - name: sla_breach_count
    data_type: smallint(16)
    ordinal_position: 8
    nullable: true
    default: '0'
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The number of SLA contractual violations recorded for the acquirer
      on the measurement date.
  - name: incident_count
    data_type: smallint(16)
    ordinal_position: 9
    nullable: true
    default: '0'
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The number of operational incidents or service disruptions recorded
      for the acquirer on the measurement date.
  description: This table captures daily operational performance metrics for each
    payment acquirer, measured against their contractual SLA obligations. One row
    represents the performance of a single acquirer on a single calendar date, including
    authorization rates, response times, settlement punctuality, uptime, and any SLA
    breaches or incidents. Key identifiers are acquirer_ref and measurement_date (composite
    primary key).
