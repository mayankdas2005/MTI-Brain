      the invoice currency.
  - name: open_amount
    data_type: numeric(28,6)
    ordinal_position: 10
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The remaining unpaid balance on the invoice in the invoice currency.
  - name: currency_code
    data_type: character varying(16)
    ordinal_position: 11
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The ISO 4217 currency code in which the invoice amounts are denominated,
      such as USD, EUR, or GBP.
  - name: status
    data_type: character varying(16)
    ordinal_position: 12
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The current payment status of the invoice, indicating whether it
      is fully paid, open, partially paid, or under dispute.
  - name: payment_terms
    data_type: character varying(16)
    ordinal_position: 13
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: The agreed payment terms specifying when the invoice is due, such
      as NET_30 for payment within 30 days or EOM_5 for payment 5 days after end of
      month.
  description: This table records accounts payable invoices received from vendors
    across all legal entities in the group, tracking the full payment lifecycle from
    issuance through to settlement. One row represents a single vendor invoice, with
    amounts split across total billed, paid, and open balances along with payment
    status and terms. Key identifiers include uuid (primary key), invoice_number,
    vendor_ref, and company_ref.
