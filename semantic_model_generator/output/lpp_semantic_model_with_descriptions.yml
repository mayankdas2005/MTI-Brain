  description: This table is the master record of all bank accounts held by group
    legal entities, capturing their configuration, ownership, purpose, cash management
    settings, and payment capabilities. One row corresponds to one bank account belonging
    to a specific legal entity, identified by a unique account code and linked to
    a bank branch. Key identifiers include the uuid primary key, code, company_ref,
    branch_ref, and currency_ref, with account_purpose (e.g., OPERATING, COLLECTION,
    PAYROLL) indicating the account's functional role.
- name: bank_account_group
  schema: lpp
  dist_style: AUTO
  primary_keys:
  - uuid
  columns:
  - name: uuid
    data_type: character varying(64)
    ordinal_position: 1
    nullable: true
    default: null
    is_primary_key: true
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Universally unique identifier serving as the primary key for each
      bank account group record.
  - name: code
    data_type: character varying(64)
    ordinal_position: 2
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Short alphanumeric code used to identify and reference a bank account
      group within business processes.
  - name: description
    data_type: character varying(256)
    ordinal_position: 3
    nullable: true
    default: null
    is_primary_key: false
    is_foreign_key: false
    is_distkey: false
    sortkey_position: 0
    encoding: none
    description: Human-readable label or narrative that describes the purpose or nature
      of the bank account group.
  description: Represents a named grouping of bank accounts used to organize accounts
    for reporting, pooling, or operational purposes. One row represents a single bank
    account group definition with a unique identifier and descriptive label. Key identifiers
    are uuid (primary key) and code (business reference code).
