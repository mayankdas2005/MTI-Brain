worker_processes auto;

# Log to stderr/stdout — Docker captures these natively; no file rotation needed.
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not emit nginx version in error pages or Server headers.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 65;

    # 5 MB is ample for JSON API payloads; there are no file-upload endpoints.
    client_max_body_size 5M;

    gzip on;
    gzip_vary   on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Docker internal DNS resolver ─────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # WebSocket upgrade map — sets Connection: upgrade only for actual upgrade
    # requests; falls back to keep-alive for normal HTTP traffic.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP-only (SSL terminated by the shared nginx-proxy) ──────────────────
    server {
        listen 80;
        server_name _;

        # Security response headers (HSTS is set by the shared proxy).
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "DENY"                            always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # Strip technology-disclosure headers from upstream responses.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # ── Next.js immutable JS/CSS chunks ───────────────────────────────
        location ^~ /mti-brain/_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-Frame-Options        "DENY"                            always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }

        # ── Public static assets (images, fonts) ─────────────────────────
        location ~* ^/mti-brain/.*\.(png|jpg|jpeg|gif|ico|svg|webp|woff2|woff|ttf|eot)$ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-Frame-Options        "DENY"                            always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Cache-Control          "public, max-age=86400"           always;
        }

        # ── Login: strict rate limiting ───────────────────────────────────
        location = /mti-brain/api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;

            rewrite ^/mti-brain(/api/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering    off;
        }

        # ── SSE / streaming chat endpoints ────────────────────────────────
        location ~ ^/mti-brain/api/v1/chat/[^/]+/(ask|retry|edit)$ {
            limit_req zone=api burst=10 nodelay;

            rewrite ^/mti-brain(/api/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering           off;
            proxy_cache               off;
            proxy_read_timeout        600s;
            proxy_send_timeout        600s;
            chunked_transfer_encoding on;
        }

        # ── General API ───────────────────────────────────────────────────
        # Strip /mti-brain prefix — backend expects /api/...
        location /mti-brain/api/ {
            limit_req zone=api burst=20 nodelay;

            rewrite ^/mti-brain(/api/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── Frontend (Next.js with basePath: /mti-brain) ──────────────────
        location /mti-brain {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
