worker_processes auto;

# Log to stderr/stdout — Docker captures these natively; no file rotation needed.
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

# Do not emit nginx version in error pages or Server headers.
server_tokens off;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 65;

    # 5 MB is ample for JSON API payloads; there are no file-upload endpoints.
    # The original 50 MB invited request-body resource exhaustion attacks.
    client_max_body_size 5M;

    gzip on;
    gzip_vary   on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Docker internal DNS resolver ─────────────────────────────────────────
    # Required for OCSP stapling and upstream name resolution inside Docker.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 10 MB shared zone holds ~160 k binary IPs. Login: 5 requests/minute.
    # General API: 120 requests/minute (matches backend ask_per_minute = 30 * 4
    # to account for burst without front-running the backend limiter).
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Mozilla Intermediate profile — ECDHE-only AEAD ciphers.
        # DHE variants are intentionally excluded: they require a separately
        # generated dhparam file and add no meaningful security over ECDHE here.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        # Off: TLSv1.3 ignores server order anyway; ECDHE-only list has no
        # weak fallback, so client order is acceptable.
        ssl_prefer_server_ciphers off;

        # Session resumption — reduces handshake overhead for returning clients.
        # Tickets are off: each worker generates its own key at startup, so a
        # ticket issued by worker-A cannot be resumed by worker-B. Disable until
        # a shared rotating ticket key is deployed (e.g. via a secrets volume).
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling — requires publicly trusted certificate and resolver above.
        # Comment out if using self-signed or internal-CA certificates.
        ssl_stapling        on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;

        # ── Security response headers ─────────────────────────────────────────
        # These complement the app-level headers and ensure they are present
        # even if a new service is added behind this proxy without its own middleware.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # Strip technology-disclosure headers from upstream responses.
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # ── Login: strict rate limiting ───────────────────────────────────────
        # 5 req/min with a burst of 3 to absorb rapid-fire from a legitimate
        # form submission retry, but still throttle credential-stuffing.
        location = /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering    off;
        }

        # ── SSE / streaming chat endpoints ────────────────────────────────────
        # Long read timeout is intentional: ask/retry/edit are Server-Sent Event
        # streams that can legitimately run for several minutes. The backend
        # Gunicorn timeout is 480 s; 600 s gives a safety margin above that.
        location ~ ^/api/v1/chat/[^/]+/(ask|retry|edit)$ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering           off;
            proxy_cache               off;
            proxy_read_timeout        600s;
            proxy_send_timeout        600s;
            chunked_transfer_encoding on;
        }

        # ── General API ───────────────────────────────────────────────────────
        # 30 s is sufficient for all non-streaming endpoints and guards against
        # slow-client / slowloris attacks that the original 600 s invited.
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
