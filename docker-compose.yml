services:
  # ─── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mti-brain-backend:latest
    container_name: mti-brain-backend
    restart: unless-stopped
    env_file: ./backend/.env
    networks:
      - app_net
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health', timeout=25); sys.exit(0 if r.status < 500 else 1)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mti-brain-frontend:latest
    container_name: mti-brain-frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  # ─── Reverse Proxy ────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: mti-brain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  app_net:
    name: mti-brain-app
    driver: bridge
  db_net:
    external: true
