services:
  # ─── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mti-brain-backend:latest
    container_name: mti-brain-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./keys/jwt_private.pem:/app/keys/jwt_private.pem:ro
      - ./keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
    networks:
      - app_net
      - db_net

    # ── Hardening ──────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only root fs — only /app/data (named volume) and /tmp (tmpfs) are
    # writable. Prevents an attacker who gains code execution from modifying
    # application binaries or installing tools.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    # ── Log rotation ───────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3) or sys.exit(1)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"
          pids: 128
        reservations:
          memory: 256M
          cpus: "0.5"

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mti-brain-frontend:latest
    container_name: mti-brain-frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

    # ── Hardening ──────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Next.js standalone writes nothing to disk at runtime when
      # images.unoptimized=true; /tmp covers any transient OS needs.
      - /tmp:size=64m,noexec,nosuid,nodev
      # Cache dir for any ISR / fetch-cache writes Next.js may attempt.
      - /app/.next/cache:size=128m,noexec,nosuid,nodev

    # ── Log rotation ───────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 64
        reservations:
          memory: 128M
          cpus: "0.25"

  # ─── Reverse Proxy ────────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: mti-brain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Wait for both services to pass their own healthchecks before nginx starts.
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app_net
      - mti_brain_net

    # ── Hardening ──────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Capabilities required for nginx's startup sequence:
    #   CHOWN            — chown temp dirs (client_temp etc.) to the worker user
    #   SETUID / SETGID  — master process drops from root to the nginx worker user
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # Read-only root fs — nginx only needs to write its PID file and internal
    # proxy/cache scratch space; both are served from tmpfs.
    read_only: true
    tmpfs:
      - /var/run:size=4m,noexec,nosuid,nodev
      - /var/cache/nginx:size=64m,noexec,nosuid,nodev
      - /tmp:size=32m,noexec,nosuid,nodev

    # ── Log rotation ───────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

    healthcheck:
      # Checks the master process is still alive via its PID file.
      # Does not require curl/wget in the nginx:alpine image.
      test: ["CMD-SHELL", "kill -0 \"$(cat /var/run/nginx.pid)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
          pids: 32

# ─── Named volumes ─────────────────────────────────────────────────────────────

volumes:
  # Persists /app/data across container restarts without touching the read-only
  # root filesystem. Contains any backend-uploaded scheduling files.
  backend_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────────────────

networks:
  # Internal network shared by nginx, frontend, and backend.
  app_net:
    name: mti-brain-app
    driver: bridge
  # External network for database connectivity, managed separately.
  db_net:
    external: true
  # Shared network with the nginx-proxy for domain-based routing.
  mti_brain_net:
    external: true
