<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTI Brain · Graph Explorer</title>
  <link rel="icon" type="image/png"
    href="https://th.bing.com/th/id/ODF.V-KQW8U0lyNZl0BhtyaPOA?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2" />
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/alliance-no1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <style>
    /* ── Theme tokens ── */
    :root {
      --ge-bg: #ffffff;
      --ge-fg: #0f1b2d;
      --ge-fg-heading: #111827;
      --ge-fg-body: #374151;
      --ge-fg-muted: #9ca3af;
      --ge-border: #e5e7eb;
      --ge-border-subtle: #f3f4f6;
      --ge-surface: #f9fafb;
      --ge-surface-2: #f3f4f6;
      --ge-primary-soft: #7c3aed;
      --ge-input-border: #d1d5db;
      --ge-copy-hover: #e5e7eb;
      --ge-copy-hover-fg: #374151;
      --ge-panel-shadow: rgba(0, 0, 0, 0.08);
      --ge-ctx-shadow: rgba(0, 0, 0, 0.13);
    }

    html.dark {
      --ge-bg: #1c1f23;
      --ge-fg: #e4e8ee;
      --ge-fg-heading: #e4e8ee;
      --ge-fg-body: #c9d4e0;
      --ge-fg-muted: #8a9bb0;
      --ge-border: #333c47;
      --ge-border-subtle: #2d3540;
      --ge-surface: #272c33;
      --ge-surface-2: #2c323b;
      --ge-primary-soft: #a78bfa;
      --ge-input-border: #445060;
      --ge-copy-hover: #333c47;
      --ge-copy-hover-fg: #e4e8ee;
      --ge-panel-shadow: rgba(0, 0, 0, 0.35);
      --ge-ctx-shadow: rgba(0, 0, 0, 0.5);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Alliance No.1', sans-serif;
      background: var(--ge-bg);
      color: var(--ge-fg);
    }

    #mynetwork {
      width: 100%;
      height: 100%;
      background: var(--ge-bg);
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--ge-bg);
      border-bottom: 1px solid var(--ge-border);
      flex-shrink: 0;
      box-shadow: 0 1px 3px var(--ge-panel-shadow);
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--ge-input-border);
      background: var(--ge-bg);
      font-size: 12px;
      font-weight: 600;
      color: var(--ge-fg-body);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .toolbar-btn:hover {
      background: var(--ge-surface);
      border-color: var(--ge-fg-muted);
    }

    .toolbar-btn:active {
      background: var(--ge-surface-2);
    }

    .toolbar-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toolbar-btn.active {
      background: var(--ge-surface-2);
      border-color: var(--ge-primary-soft);
      color: var(--ge-primary-soft);
    }

    #search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--ge-surface);
      border: 1px solid var(--ge-input-border);
      border-radius: 6px;
      padding: 4px 10px;
    }

    #search-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--ge-fg-body);
      width: 160px;
    }

    #search-input::placeholder {
      color: var(--ge-fg-muted);
    }

    #search-clear {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ge-fg-muted);
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }

    /* ── Panel collapse ── */
    #panel-inner {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 480px;
      background: var(--ge-bg);
      border-left: 1px solid var(--ge-border);
      box-shadow: -4px 0 16px var(--ge-panel-shadow);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      z-index: 10;
      transition: transform 0.26s ease, opacity 0.2s ease;
    }

    #panel-inner.collapsed {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Floating pill button anchored to the left edge of the panel */
    #panel-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 22px;
      height: 48px;
      padding: 0;
      background: #ede9fe;
      border: 1px solid #c4b5fd;
      border-right: none;
      border-radius: 6px 0 0 6px;
      box-shadow: -3px 0 10px rgba(139, 92, 246, 0.18);
      cursor: pointer;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: right 0.26s ease, color 0.12s, background 0.12s;
    }

    #panel-toggle:hover {
      background: #ddd6fe;
      color: #6d28d9;
    }

    /* ── Node label badges ── */
    .label-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin: 3px 3px;
      color: rgba(0, 0, 0, 0.75);
      user-select: none;
      white-space: nowrap;
      line-height: 1.4;
    }

    .label-badge:hover {
      filter: brightness(0.9);
    }

    /* ── Rel type hexagon badges ── */
    .rel-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 22px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 3px;
      background: #c8c8c8;
      color: #222;
      user-select: none;
      white-space: nowrap;
      line-height: 1.4;
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
    }

    .rel-badge:hover {
      filter: brightness(0.88);
    }

    /* ── Properties table ── */
    .prop-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .prop-table thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--ge-fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--ge-border);
    }

    .prop-table thead th:last-child {
      width: 28px;
    }

    .prop-table tbody tr {
      border-bottom: 1px solid var(--ge-border-subtle);
    }

    .prop-table tbody tr:last-child {
      border-bottom: none;
    }

    .prop-table tbody tr:hover {
      background: var(--ge-surface);
    }

    .prop-table td {
      padding: 10px 8px;
      vertical-align: top;
      font-size: 13px;
    }

    .prop-key {
      font-weight: 700;
      color: var(--ge-fg-heading);
      width: 160px;
      min-width: 160px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .prop-value {
      color: var(--ge-fg-body);
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
      min-width: 0;
    }

    .show-all-btn {
      display: inline;
      margin-left: 4px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ge-primary-soft);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .show-all-btn:hover {
      text-decoration: underline;
    }

    .prop-copy-td {
      width: 28px;
      text-align: right;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: none;
      border: none;
      color: var(--ge-fg-muted);
      transition: opacity 0.1s, background 0.1s;
      flex-shrink: 0;
    }

    .prop-table tbody tr:hover .copy-btn {
      opacity: 0.6;
    }

    .copy-btn:hover {
      opacity: 1 !important;
      background: var(--ge-copy-hover);
      color: var(--ge-copy-hover-fg);
    }

    /* ── Detail panel badges ── */
    .detail-node-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.75);
      margin-bottom: 14px;
    }

    .detail-rel-badge {
      display: inline-block;
      padding: 5px 22px;
      font-size: 13px;
      font-weight: 700;
      color: #222;
      background: #c8c8c8;
      margin-bottom: 14px;
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
    }

    /* ── Panel header ── */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ge-border);
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ge-fg-heading);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none;
      background: none;
      color: var(--ge-fg-muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--ge-surface-2);
      color: var(--ge-fg-body);
    }

    .ov-section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .ov-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ge-fg-body);
    }

    .ov-section-count {
      color: var(--ge-fg-muted);
      font-weight: 400;
    }

    /* ── Layout button spinner ── */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinning {
      animation: spin 0.7s linear infinite;
    }


    /* ── Right-click context menu ── */
    #ctx-menu {
      display: none;
      position: fixed;
      z-index: 2000;
      background: var(--ge-bg);
      border: 1px solid var(--ge-border);
      border-radius: 8px;
      box-shadow: 0 4px 24px var(--ge-ctx-shadow);
      min-width: 230px;
      overflow: hidden;
      padding: 4px 0;
    }

    .ctx-item {
      padding: 9px 16px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      color: var(--ge-fg-body);
      user-select: none;
    }

    .ctx-item:hover:not(.ctx-disabled) {
      background: var(--ge-surface-2);
    }

    .ctx-item.ctx-disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .ctx-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--ge-fg-muted);
      margin-top: 1px;
    }

    .ctx-label {
      font-weight: 600;
      line-height: 1.3;
    }

    .ctx-sub {
      font-size: 11px;
      color: var(--ge-fg-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    .ctx-sep {
      border: none;
      border-top: 1px solid var(--ge-border-subtle);
      margin: 3px 0;
    }

    /* ── Rich hover tooltip card ── */
    #hover-card {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: var(--ge-bg);
      border: 1px solid var(--ge-border);
      border-radius: 10px;
      box-shadow: 0 8px 24px var(--ge-panel-shadow), 0 2px 8px rgba(0,0,0,0.06);
      padding: 12px 16px;
      max-width: 280px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      font-family: 'Alliance No.1', sans-serif;
    }
    #hover-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #hover-card .hc-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ge-fg-heading);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    #hover-card .hc-type {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    #hover-card .hc-desc {
      font-size: 13px;
      color: var(--ge-fg-body);
      line-height: 1.45;
      margin-top: 4px;
    }
    #hover-card .hc-role {
      font-size: 11px;
      font-weight: 600;
      color: var(--ge-primary-soft);
      margin-top: 6px;
    }



    /* ── Tour controls ── */
    #tour-bar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 70; background: var(--ge-surface, var(--ge-bg)); border: 1px solid var(--ge-border);
      border-radius: 10px; padding: 6px 14px; display: none; align-items: center; gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12); font-size: 13px; color: var(--ge-fg);
    }
    #tour-bar button {
      background: none; border: 1px solid var(--ge-border); border-radius: 6px;
      padding: 3px 10px; cursor: pointer; color: var(--ge-fg); font-size: 12px; font-weight: 600;
    }
    #tour-bar button:hover { background: var(--ge-surface-2, #f3f4f6); }

    /* ── Breadcrumb trail ── */
    #breadcrumb-trail {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      padding: 0 0 8px 0; margin: 0 0 8px 0;
      border-bottom: 1px solid var(--ge-border-subtle, var(--ge-border));
      min-height: 0;
    }
    #breadcrumb-trail:empty { display: none; padding: 0; margin: 0; border: none; }
    .bc-item {
      font-size: 11px; color: var(--ge-fg-muted); cursor: pointer;
      padding: 1px 6px; border-radius: 4px; white-space: nowrap;
      max-width: 90px; overflow: hidden; text-overflow: ellipsis;
      transition: background 0.12s;
    }
    .bc-item:hover { background: var(--ge-surface-2, #f3f4f6); color: var(--ge-fg); }
    .bc-item.bc-active { font-weight: 700; color: var(--ge-fg); }
    .bc-sep { font-size: 10px; color: var(--ge-border); }
  </style>
</head>

<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <!-- Search -->
    <div id="search-box">
      <svg width="13" height="13" fill="none" stroke="#9ca3af" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input id="search-input" type="text" placeholder="Search nodes…" autocomplete="off" />
      <button id="search-clear" title="Clear search">✕</button>
    </div>

    <!-- Fit -->
    <button class="toolbar-btn" id="fit-btn" title="Fit graph to viewport">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
      </svg>
      Zoom to fit
    </button>

    <!-- Auto Layout -->
    <button class="toolbar-btn" id="layout-btn" title="Run Fruchterman-Reingold auto layout">
      <svg id="layout-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"
        viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="2" />
        <circle cx="19" cy="5" r="2" />
        <circle cx="19" cy="19" r="2" />
        <path d="M7 12h10M17 6.5 7.5 11M17 17.5l-9.5-5" />
      </svg>
      Auto Layout
    </button>

    <!-- Theme toggle -->
    <button class="toolbar-btn" id="theme-btn" title="Toggle light / dark theme">
      <svg id="theme-icon-sun" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"
        viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
      </svg>
      <svg id="theme-icon-moon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"
        viewBox="0 0 24 24" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <span id="theme-label">Dark</span>
    </button>

    <!-- Edges toggle -->
    <button class="toolbar-btn" id="edges-btn" title="Show / hide all edges">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />
      </svg>
      <span id="edges-label">Hide relationships</span>
    </button>

    <!-- Semantic model toggle -->
    <button class="toolbar-btn" id="layer-btn" onclick="toggleRetrievedNodes()" title="Show/hide additional graph layers">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
      </svg>
      <span id="layer-label">Show all used nodes</span>
    </button>

    <!-- Guided Tour -->
    <button class="toolbar-btn" id="tour-btn" title="Walk through the SQL path step by step" style="display:none;">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      Tour SQL path
    </button>

    <div style="flex:1;"></div>
    <span style="font-size:12px;font-weight:700;color:var(--ge-fg);letter-spacing:0.04em;">MTI Brain · Graph
      Explorer</span>
  </div>

  <!-- ── Main area ── -->
  <div style="display:flex;flex:1;overflow:hidden;position:relative;">

    <!-- Graph canvas -->
    <div id="mynetwork" style="position:absolute;inset:0;"></div>

    <!-- Rich hover tooltip card -->
    <div id="hover-card">
      <div class="hc-name"></div>
      <div class="hc-type"></div>
      <div class="hc-desc"></div>
      <div class="hc-role"></div>
    </div>

    <!-- Tour step bar -->
    <div id="tour-bar">
      <button id="tour-prev" title="Previous node">◂ Prev</button>
      <span id="tour-step">1 / 10</span>
      <button id="tour-next" title="Next node">Next ▸</button>
      <button id="tour-stop" title="End tour">✕</button>
    </div>

    <!-- Floating panel toggle button -->
    <button id="panel-toggle" title="Toggle details panel">
      <svg id="toggle-chevron" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"
        viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <!-- Details panel (default collapsed) -->
    <div id="panel-inner" class="collapsed">

      <!-- Overview -->
      <div id="overviewContent">
        <div class="panel-header" style="border-bottom:none;margin-bottom:16px;">
          <span class="panel-title">Results overview</span>
        </div>
        <div id="overviewStats"></div>
      </div>

      <!-- Node / Relationship detail -->
      <div id="detailContent" class="hidden">
        <div class="panel-header">
          <span class="panel-title" id="detailTitle"></span>
          <button class="icon-btn" id="copyAllBtn" title="Copy all properties">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
            </svg>
          </button>
        </div>
        <div id="breadcrumb-trail"></div>
        <div id="detailBody"></div>
      </div>

    </div>
  </div>

  <!-- ── Right-click context menu ── -->
  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-expand">
      <svg class="ctx-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
      </svg>
      <div>
        <div class="ctx-label">Expand node</div>
        <div class="ctx-sub">Show all hidden neighbors</div>
      </div>
    </div>
    <hr class="ctx-sep" />
    <div class="ctx-item ctx-disabled" id="ctx-collapse">
      <svg class="ctx-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M8 3v3a2 2 0 01-2 2H3M21 8h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3M16 21v-3a2 2 0 012-2h3" />
      </svg>
      <div>
        <div class="ctx-label">Collapse node</div>
        <div class="ctx-sub" id="ctx-collapse-sub">No expanded neighbors</div>
      </div>
    </div>
    <hr class="ctx-sep" />
    <div class="ctx-item" id="ctx-show-rels">
      <svg class="ctx-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />
      </svg>
      <div>
        <div class="ctx-label">Show all relationships</div>
        <div class="ctx-sub" id="ctx-rels-sub">All connections for this node</div>
      </div>
    </div>
  </div>

  <script>
    // ── Neo4j color palette ──────────────────────────────────────────
    const NEO4J_COLORS = [
      '#FFE081', '#C990C0', '#F79767', '#57C7E3', '#F16667',
      '#D9C8AE', '#8DCC93', '#ECB5C9', '#4C8EDA', '#FFC454',
      '#DA7194', '#569480'
    ];
    const labelColorMap = {};
    let _colorIdx = 0;
    function getLabelColor(label) {
      if (!(label in labelColorMap)) {
        labelColorMap[label] = NEO4J_COLORS[_colorIdx % NEO4J_COLORS.length];
        _colorIdx++;
      }
      return labelColorMap[label];
    }
    function darkenHex(hex, amt = 45) {
      const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amt);
      const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amt);
      const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amt);
      return `rgb(${r},${g},${b})`;
    }

    // -- Graph context data (injected by graph_context_builder.py)
    const cypherResult = /* GRAPH_DATA_PLACEHOLDER */ []

    ;

    // Injected by graph_context_builder.py — final executed SQL and feedback overlay
    const sqlPathString = /* SQL_PATH_PLACEHOLDER */ "";
    const feedbackOverlay = /* FEEDBACK_OVERLAY_PLACEHOLDER */ {};

    // ── Convert to vis.js ────────────────────────────────────────────
    function truncLabel(s, max = 11) {
      if (!s) return '';
      return s.length > max ? s.slice(0, max - 1) + '\u2026' : s;
    }

    // Store original colors for search reset
    const origColors = {};

    function convertResultsToVis(records) {
      const nodeMap = new Map();
      const nodes = [], edges = [];

      function addNode(nd) {
        if (!nd || nodeMap.has(nd.identity)) return;
        nodeMap.set(nd.identity, nd);
        const primaryLabel = (nd.labels && nd.labels[0]) || 'Node';
        const bg = getLabelColor(primaryLabel);
        const border = darkenHex(bg, 30);
        const colorObj = {
          background: bg, border,
          highlight: { background: bg, border: '#57C7E3' },
          hover: { background: bg, border: darkenHex(bg, 15) }
        };
        origColors[nd.identity] = colorObj;
        const rawLabel = nd.properties.name || nd.properties.title || primaryLabel;
        const nodeObj = {
          id: nd.identity,
          label: rawLabel,
          title: '',             // disable browser tooltip — rich hover card instead
          labels: nd.labels,
          properties: nd.properties,
          neo4jId: nd.identity,
          shape: 'circle',        // label INSIDE the circle
          size: 30,
          borderWidth: 3,
          borderWidthSelected: 4,
          color: colorObj,
          font: { color: 'rgba(0,0,0,0.82)', size: 16, face: 'Inter,system-ui,sans-serif', bold: false, multi: false },
          widthConstraint: { maximum: 160 }
        };
        // Use server-pre-computed positions when available — no browser physics needed
        if (nd._x !== undefined && nd._y !== undefined) {
          nodeObj.x = nd._x;
          nodeObj.y = nd._y;
        }

        // ── Visual tier: SQL path / used / retrieved-only ──────────────
        const isInSqlPath     = nd.properties && nd.properties._in_sql_path === true;
        const isRetrievedOnly = nd.properties && nd.properties._retrieved_only === true;
        nodeObj._inSqlPath     = isInSqlPath;
        nodeObj._retrievedOnly = isRetrievedOnly;

        if (isInSqlPath) {
          nodeObj.color = {
            background: colorObj.background,
            border: '#f59e0b',
            highlight: { background: colorObj.background, border: '#d97706' },
            hover: { background: colorObj.background, border: '#f59e0b' },
          };
          nodeObj.size = 40;
          nodeObj.borderWidth = 7;
          nodeObj.widthConstraint = { maximum: 200 };
          nodeObj.font = { color: 'rgba(0,0,0,0.82)', size: 18, face: 'Inter,system-ui,sans-serif', bold: true, multi: false };
          nodeObj.shadow = { enabled: true, color: 'rgba(245,158,11,0.35)', size: 12, x: 0, y: 0 };
          origColors[nd.identity] = nodeObj.color;
        }
        if (isRetrievedOnly) {
          nodeObj.opacity = 0.3;
          nodeObj.hidden  = true;
        }

        // ── Visual hierarchy by label type ─────────────────────────────
        if (primaryLabel === 'Column') {
          nodeObj.size = 22;
          nodeObj.font = { ...nodeObj.font, size: 14 };
          nodeObj.widthConstraint = { maximum: 120 };
        } else if (primaryLabel === 'Domain' || primaryLabel === 'Community') {
          nodeObj.size = 28;
          nodeObj.font = { ...nodeObj.font, size: 14, vadjust: 0 };
          nodeObj.widthConstraint = { maximum: 140 };
        } else if (primaryLabel === 'Intent' || primaryLabel === 'BusinessTerm') {
          nodeObj.size = 25;
          nodeObj.font = { ...nodeObj.font, size: 13 };
          nodeObj.widthConstraint = { maximum: 130 };
        }

        // ── Feedback overlay ────────────────────────────────────────────
        if (feedbackOverlay && primaryLabel === 'Table') {
          const fqn     = (nd.properties.fqn || '').toLowerCase();
          const negList = (feedbackOverlay.negative || []).map(s => s.toLowerCase());
          const posList = (feedbackOverlay.positive || []).map(s => s.toLowerCase());
          if (negList.includes(fqn)) {
            nodeObj._feedbackNegative = true;
          } else if (posList.includes(fqn)) {
            nodeObj._feedbackPositive = true;
          }
        }

        nodes.push(nodeObj);
      }

      const edgeSet = new Set();
      records.forEach(record => {
        addNode(record.n); addNode(record.m);
        if (record.r) {
          // Dedup by (from, to, type) — backend may assign different IDs to same logical edge
          const edgeKey = `${record.r.start}-${record.r.end}-${record.r.type}`;
          if (edgeSet.has(edgeKey)) return;
          edgeSet.add(edgeKey);
          const relType = record.r.type;
          // Edge thickness by relationship importance
          let edgeWidth = 1.5;
          let edgeColor = '#b0b8c4';
          if (relType === 'JOINS_TO') { edgeWidth = 3; edgeColor = '#6366f1'; }
          else if (relType === 'HAS_COLUMN') { edgeWidth = 1; edgeColor = '#d1d5db'; }
          else if (relType === 'BELONGS_TO' || relType === 'CONTAINS_TABLE') { edgeWidth = 1.2; edgeColor = '#a5b4fc'; }
          edges.push({
            id: record.r.identity,
            from: record.r.start,
            to: record.r.end,
            label: '',            // hidden by default — shown on hover via hoverEdge
            _label: record.r.type, // store real label for hover display
            type: record.r.type,
            properties: record.r.properties,
            neo4jId: record.r.identity,
            width: edgeWidth,
            arrows: { to: { enabled: true, scaleFactor: 0.7 } },
            color: { color: edgeColor, highlight: '#57C7E3', hover: '#7a8898' },
            smooth: { enabled: true, type: 'dynamic', roundness: 0.5 }
          });
        }
      });
      return { nodes, edges };
    }

    const rawData = convertResultsToVis(cypherResult);

    // ── Lazy loading: seed with top-N nodes, expand on double-click ────
    // All nodes start visible with no edges — expand/collapse manages edge visibility
    const allNodes = rawData.nodes;
    const allEdges = rawData.edges;

    // ── Visibility layer toggle (3 stages) ──────────────────────────
    // Stage 0: SQL-path tables & columns only (default)
    // Stage 1: All tables & columns (adds non-SQL-path Table/Column nodes)
    // Stage 2: Full graph (adds semantic concepts: Domain, Intent, etc. + retrieved-only)
    const nodeById = new Map(allNodes.map(n => [n.id, n]));
    const visibleNodeIds = new Set(allNodes.map(n => n.id));

    const sqlPathNodeIds = new Set(allNodes.filter(n => n._inSqlPath).map(n => n.id));
    const hasSqlPath = sqlPathNodeIds.size > 0;

    // Non-Table/Column labels → "concept" tier (shown only in stage 2)
    const _conceptLabels = new Set(['QueryPattern', 'Intent', 'BusinessTerm', 'Domain', 'Community', 'AntiPattern', 'JoinPath', 'QueryTemplate']);

    // Classify each node into a visibility tier
    let _showingUsed = !hasSqlPath;
    if (hasSqlPath) {
      allNodes.forEach(n => {
        const label = (n.labels || [])[0] || '';
        if (n._retrievedOnly) return; // already has its own tier
        if (_conceptLabels.has(label)) {
          n._conceptOnly = true; // stage 2
        } else if (!n._inSqlPath) {
          n._usedOnly = true;    // stage 1 (extra Table/Column nodes)
        }
      });
    } else {
      // No SQL path → hide concepts by default, show all tables
      allNodes.forEach(n => {
        const label = (n.labels || [])[0] || '';
        if (_conceptLabels.has(label) && !n._retrievedOnly) {
          n._conceptOnly = true;
        }
      });
    }

    let _layerStage = 0; // 0 = In SQL, 1 = In SQL + Used, 2 = full graph
    function toggleRetrievedNodes() {
      const lbl = document.getElementById('layer-label');
      if (_layerStage === 0 && hasSqlPath) {
        // Stage 0 → 1: reveal Used nodes (extra tables + concepts, not retrieved-only)
        _layerStage = 1;
        _showingUsed = true;
        nodesDS.update(allNodes.filter(n => n._usedOnly || n._conceptOnly).map(n => ({ id: n.id, hidden: false })));
        // Reveal edges between non-retrieved nodes
        const edgeUpdates = allEdges
          .filter(e => !visibleEdgeIds.has(e.id) && !(e.properties && e.properties._retrieved_only))
          .filter(e => {
            const src = nodeById.get(e.from), tgt = nodeById.get(e.to);
            return src && tgt && !src._retrievedOnly && !tgt._retrievedOnly;
          })
          .map(e => { visibleEdgeIds.add(e.id); return { id: e.id, hidden: false }; });
        edgesDS.update(edgeUpdates);
        lbl.textContent = 'Show full graph';
      } else if (_layerStage <= 1) {
        // Stage 1 → 2: reveal retrieved-only nodes
        _layerStage = 2;
        nodesDS.update(allNodes.filter(n => n._retrievedOnly).map(n => ({ id: n.id, hidden: false })));
        const edgeUpdates = allEdges
          .filter(e => !visibleEdgeIds.has(e.id))
          .map(e => { visibleEdgeIds.add(e.id); return { id: e.id, hidden: false }; });
        edgesDS.update(edgeUpdates);
        lbl.textContent = 'Show In SQL only';
      } else {
        // Stage 2 → 0: back to SQL-path only
        _layerStage = 0;
        _showingUsed = false;
        // Hide used + concept + retrieved nodes
        nodesDS.update(allNodes.filter(n => n._usedOnly || n._conceptOnly || n._retrievedOnly).map(n => ({ id: n.id, hidden: true })));
        // Hide edges connected to hidden nodes
        const hiddenIds = new Set(nodesDS.get({ filter: n => n.hidden }).map(n => n.id));
        const edgeUpdates = allEdges
          .filter(e => hiddenIds.has(e.from) || hiddenIds.has(e.to))
          .map(e => { visibleEdgeIds.delete(e.id); return { id: e.id, hidden: true }; });
        edgesDS.update(edgeUpdates);
        lbl.textContent = 'Show all used nodes';
      }
    }

    const visibleEdgeIds = new Set(allEdges.map(e => e.id));

    // \u2500\u2500 Adjacency index (built once at startup, O(1) lookups) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
    const edgesByNode = new Map();
    allEdges.forEach(e => {
      if (!edgesByNode.has(e.from)) edgesByNode.set(e.from, []);
      if (!edgesByNode.has(e.to)) edgesByNode.set(e.to, []);
      edgesByNode.get(e.from).push(e.id);
      edgesByNode.get(e.to).push(e.id);
    });

    // True only when the node has BOTH a visible edge AND a hidden edge (more to explore).
    function hasHiddenEdges(nodeId) {
      const ids = edgesByNode.get(nodeId) || [];
      let vis = false, hid = false;
      for (const eid of ids) {
        if (visibleEdgeIds.has(eid)) vis = true; else hid = true;
        if (vis && hid) return true;
      }
      return false;
    }

    // Dashed ring = node is a hub with unexplored connections (no glow \u2014 subtle)
    const EXPAND_BORDER = '#8b5cf6';
    function withExpansionStyle(node) {
      if (!hasHiddenEdges(node.id)) return node;
      return {
        ...node,
        borderWidth: 3,
        shapeProperties: { borderDashes: [6, 3] },
        color: {
          ...node.color,
          border: EXPAND_BORDER,
          highlight: { background: node.color.background, border: EXPAND_BORDER },
          hover: { background: node.color.background, border: '#7c3aed' }
        },
        shadow: { enabled: false },
        title: node.title + ' \u00b7 double-click to expand'
      };
    }

    // Refresh dashed-ring indicators for all currently visible nodes
    function refreshExpansionStyles() {
      nodesDS.update(nodesDS.get().map(n => {
        const orig = nodeById.get(n.id);
        if (!orig) return { id: n.id };
        const hasHidden = hasHiddenEdges(n.id);
        return {
          id: n.id,
          borderWidth: hasHidden ? 3 : 2,
          shapeProperties: hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          color: hasHidden
            ? {
              ...orig.color, border: EXPAND_BORDER,
              highlight: { background: orig.color.background, border: EXPAND_BORDER },
              hover: { background: orig.color.background, border: '#7c3aed' }
            }
            : orig.color,
          shadow: { enabled: false },
          title: orig.title + (hasHidden ? ' \u00b7 double-click to expand' : '')
        };
      }));
    }

    // Show all edges for nodeId that are not yet visible
    function expandNode(nodeId) {
      const toShow = (edgesByNode.get(nodeId) || []).filter(eid => !visibleEdgeIds.has(eid));
      if (!toShow.length) return;
      toShow.forEach(eid => visibleEdgeIds.add(eid));
      edgesDS.update(toShow.map(eid => ({ id: eid, hidden: false })));
      // Reveal connected nodes that were hidden; place at pre-computed positions
      toShow.forEach(eid => {
        const edge = edgesDS.get(eid);
        if (!edge) return;
        [edge.from, edge.to].forEach(nid => {
          const n = nodesDS.get(nid);
          if (n && n.hidden) {
            const home = _homePositions && _homePositions.get(nid);
            nodesDS.update({ id: nid, hidden: false, ...(home ? { x: home.x, y: home.y } : {}) });
          }
        });
      });
      refreshExpansionStyles();
    }

    // Hide all currently visible edges for nodeId
    function collapseNode(nodeId) {
      const toHide = (edgesByNode.get(nodeId) || []).filter(eid => visibleEdgeIds.has(eid));
      if (!toHide.length) return;
      toHide.forEach(eid => visibleEdgeIds.delete(eid));
      edgesDS.update(toHide.map(eid => ({ id: eid, hidden: true })));
      refreshExpansionStyles();
    }

    // Show all edges (visible + hidden) connected to nodeId in the details panel
    function showAllRelationships(nodeId) {
      const node = nodeById.get(nodeId);
      if (!node) return;
      const rels = [];
      allEdges.forEach(e => {
        if (e.from === nodeId)
          rels.push({ dir: 'out', type: e.type, otherId: e.to, visible: visibleEdgeIds.has(e.id) });
        else if (e.to === nodeId)
          rels.push({ dir: 'in', type: e.type, otherId: e.from, visible: visibleEdgeIds.has(e.id) });
      });
      const primaryLabel = (node.labels && node.labels[0]) || 'Node';
      const color = getLabelColor(primaryLabel);
      let html = `<span class="detail-node-badge" style="background:${color};">${escHtml(primaryLabel)}</span>
        <div style="font-size:14px;font-weight:700;color:var(--ge-fg-heading);margin-bottom:10px;">${escHtml(node.label || '')}</div>
        <hr style="border:none;border-top:1px solid var(--ge-border);margin-bottom:12px;"/>
        <div style="font-size:11px;font-weight:700;color:var(--ge-fg-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">All Relationships (${rels.length})</div>`;
      if (!rels.length) {
        html += `<div style="color:var(--ge-fg-muted);font-size:13px;padding:8px 0;">No relationships found.</div>`;
      } else {
        rels.forEach(({ dir, type, otherId, visible }) => {
          const other = nodeById.get(otherId);
          const otherName = other ? (other.label || String(otherId)) : String(otherId);
          const arrowOut = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
          const arrowIn = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M11 6L5 12l6 6"/></svg>`;
          const hiddenBadge = visible ? '' : `<span style="font-size:10px;background:var(--ge-border-subtle);color:var(--ge-fg-muted);border-radius:3px;padding:1px 5px;margin-left:4px;">hidden</span>`;
          html += `<div style="padding:8px 0;border-bottom:1px solid var(--ge-border-subtle);display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ge-fg-muted);">
            ${dir === 'out' ? arrowOut : arrowIn}
            <span style="display:inline-flex;align-items:center;padding:2px 12px;background:var(--ge-surface-2);font-size:10px;font-weight:700;color:var(--ge-fg-body);
              clip-path:polygon(8px 0%,calc(100% - 8px) 0%,100% 50%,calc(100% - 8px) 100%,8px 100%,0% 50%);">${escHtml(type)}</span>
            <span style="font-size:12px;color:var(--ge-fg-body);">${escHtml(otherName)}${hiddenBadge}</span>
          </div>`;
        });
      }
      detailTitle.textContent = 'All Relationships';
      detailBody.innerHTML = html;
      overviewContent.classList.add('hidden');
      detailContent.classList.remove('hidden');
      setPanelOpen(true);
    }

    // Detect whether server pre-computed positions for all nodes
    const _hasPrecomputedLayout = allNodes.length > 0 && allNodes.every(n => n.x !== undefined);

    // Initial state: SQL-path nodes visible; used-only + concept nodes hidden until toggled
    const nodesDS = new vis.DataSet(allNodes.map(n => {
      const styled = withExpansionStyle(n);
      // Ensure nodes are draggable (vis.js can pin nodes that have x/y without explicit fixed:false)
      const base = { ...styled, fixed: false };
      if (n._usedOnly || n._conceptOnly) {
        return { ...base, hidden: true };
      }
      return base;
    }));
    // Edges: visible only if both endpoints are currently shown
    const edgesDS = new vis.DataSet(allEdges.map(e => {
      const src = nodeById.get(e.from), tgt = nodeById.get(e.to);
      const srcHidden = src && (src._usedOnly || src._conceptOnly || src._retrievedOnly);
      const tgtHidden = tgt && (tgt._usedOnly || tgt._conceptOnly || tgt._retrievedOnly);
      const show = visibleEdgeIds.has(e.id) && !srcHidden && !tgtHidden;
      if (!show) visibleEdgeIds.delete(e.id);
      return { ...e, hidden: !show };
    }));

    // ── vis.js options ───────────────────────────────────────────────
    const visOptions = {
      physics: {
        // Always start with physics OFF — we trigger it manually below via _runPhysics().
        // This prevents vis.js's automatic background stabilization from swallowing the
        // animation before the user sees it.
        enabled: false,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -55,
          centralGravity: 0.01,
          springLength: 90,
          springConstant: 0.08,
          damping: 0.42,
          avoidOverlap: 0.8
        },
        stabilization: { enabled: false }
      },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true, selectConnectedEdges: false, hoverConnectedEdges: false, zoomSpeed: 0.8 },
      edges: {
        smooth: { enabled: true, type: 'dynamic', roundness: 0.5 },
        // Edge labels hidden by default — appear on hover/select for declutter
        font: { align: 'top', size: 11, color: '#6b7280', strokeWidth: 3, strokeColor: '#ffffff' },
        arrows: { to: { enabled: true, scaleFactor: 0.7 } },
        color: { color: '#b0b8c4', highlight: '#57C7E3', hover: '#7a8898' }
      },
      nodes: {
        shape: 'circle',
        size: 30,
        borderWidth: 3,
        borderWidthSelected: 4,
        font: { size: 16, face: 'Inter,system-ui', color: 'rgba(0,0,0,0.82)', bold: { face: 'Inter,system-ui' } }
      },
      minZoom: 0.4,
      maxZoom: 3.0
    };

    const container = document.getElementById('mynetwork');
    const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, visOptions);

    // Store the server-computed home positions for instant reset
    const _homePositions = _hasPrecomputedLayout
      ? new Map(allNodes.map(n => [n.id, { x: n.x, y: n.y }]))
      : null;

    // ── Physics helper ───────────────────────────────────────────────────────
    // Fires a short physics burst (ms), then disables physics completely.
    // No centralGravity — nodes only respond to spring/repulsion forces from
    // their actual edges, so they don't cluster toward the center.
    let _physicsTimer = null;
    function _runPhysics(ms) {
      if (_physicsTimer) { clearTimeout(_physicsTimer); _physicsTimer = null; }
      network.setOptions({
        physics: {
          enabled: true,
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -120,
            centralGravity: 0,
            springLength: 150,
            springConstant: 0.04,
            damping: 0.6,
            avoidOverlap: 1.0
          },
          stabilization: { enabled: false }
        }
      });
      _physicsTimer = setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        _physicsTimer = null;
      }, ms || 1200);
    }

    // Auto Layout:
    //  • Pre-computed positions → snap home + short physics settle
    //  • No positions (old cached HTML) → random scatter + full physics
    function runAutoLayout() {
      const btn = document.getElementById('layout-btn');
      const icon = document.getElementById('layout-icon');
      btn.disabled = true;
      icon.classList.add('spinning');

      if (_homePositions) {
        nodesDS.update(Array.from(_homePositions.entries()).map(([id, pos]) => ({ id, x: pos.x, y: pos.y, fixed: false })));
        network.fit({ animation: { duration: 300, easingFunction: 'easeOutQuad' } });
        // Run physics to un-cluster (pre-computed positions are a starting point)
        _runPhysics(1500);
        setTimeout(() => { btn.disabled = false; icon.classList.remove('spinning'); }, 1500);
      } else {
        const allIds = nodesDS.getIds();
        const spread = Math.max(600, allIds.length * 60);
        nodesDS.update(allIds.map(id => ({
          id,
          x: (Math.random() - 0.5) * spread,
          y: (Math.random() - 0.5) * spread,
          fixed: false
        })));
        _runPhysics(1500);
        setTimeout(() => {
          network.fit({ animation: { duration: 500, easingFunction: 'easeOutQuad' } });
          btn.disabled = false;
          icon.classList.remove('spinning');
        }, 1500);
      }
    }

    // Initial load
    network.fit({ animation: false });
    // Clamp: ensure initial view never zooms out past readable threshold
    if (network.getScale() < 0.5) {
      network.moveTo({ scale: 0.5 });
    }
    if (_hasPrecomputedLayout) {
      // Nodes are already at server-computed positions — no physics needed on load.
      // Physics fires only on dragEnd / expand / collapse (wired below).
    } else {
      runAutoLayout();
    }

    // ── Drag-end physics — spring reaction when user releases a node ──────────
    network.on('dragEnd', function (params) {
      if (params.nodes.length > 0) {
        _runPhysics(1200);
      }
    });

    // ── Panel refs ───────────────────────────────────────────────────
    const overviewContent = document.getElementById('overviewContent');
    const detailContent = document.getElementById('detailContent');
    const detailTitle = document.getElementById('detailTitle');
    const detailBody = document.getElementById('detailBody');
    const overviewStats = document.getElementById('overviewStats');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const panelInner = document.getElementById('panel-inner');
    const toggleChevron = document.getElementById('toggle-chevron');

    // ── Panel toggle (default: collapsed) ───────────────────────────
    let panelOpen = false;   // start collapsed
    let _ovSortAlpha = false; // false = sort by count desc, true = sort A-Z

    const panelToggleBtn = document.getElementById('panel-toggle');
    function setPanelOpen(open) {
      panelOpen = open;
      if (open) {
        panelInner.classList.remove('collapsed');
        panelToggleBtn.style.right = '480px';
        toggleChevron.setAttribute('points', '9 18 15 12 9 6'); // ‹ close
      } else {
        panelInner.classList.add('collapsed');
        panelToggleBtn.style.right = '0px';
        toggleChevron.setAttribute('points', '15 18 9 12 15 6'); // › open
      }
    }
    panelToggleBtn.addEventListener('click', () => setPanelOpen(!panelOpen));

    // ── Helpers ──────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(String(text)).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        btn.style.opacity = '1';
        setTimeout(() => { btn.innerHTML = orig; btn.style.opacity = ''; }, 1400);
      });
    }

    // ── Properties table ─────────────────────────────────────────────
    function buildPropsTable(neo4jId, properties) {
      const rows = [{ key: '<id>', value: String(neo4jId) }];
      Object.keys(properties).sort().forEach(k => {
        const v = properties[k];
        rows.push({ key: k, value: Array.isArray(v) ? JSON.stringify(v) : String(v) });
      });
      let html = '<table class="prop-table"><thead><tr><th>Key</th><th>Value</th><th></th></tr></thead><tbody>';
      rows.forEach(({ key, value }) => {
        if (!window._saCtr) window._saCtr = 0;
        let valueHtml;
        if (value.length > 180) {
          const uid = 'sa' + (++window._saCtr);
          valueHtml = '<span id="' + uid + '-s">' + escHtml(value.slice(0, 180)) + '\u2026<button class="show-all-btn" data-sa="' + uid + '" data-role="short">Show all</button></span>'
            + '<span id="' + uid + '-f" style="display:none">' + escHtml(value) + '<button class="show-all-btn" data-sa="' + uid + '" data-role="full">Show less</button></span>';
        } else {
          valueHtml = escHtml(value);
        }
        html += `<tr>
          <td class="prop-key">${escHtml(key)}</td>
          <td class="prop-value">${valueHtml}</td>
          <td class="prop-copy-td">
            <button class="copy-btn" data-copykey="${escHtml(key)}" data-copyval="${escHtml(value)}" title="Copy">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
            </button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    // ── Centralized filtering state ───────────────────────────────────
    let currentSearchQuery = '';
    let currentSelectedCategory = '*';
    let currentSelectedRelType = '*';
    let currentClickedNodeId = null;

    // ── Overview ──────────────────────────────────────────────────────
    function buildOverview() {
      const labelCounts = {}, relTypeCounts = {};
      rawData.nodes.forEach(n => {
        (n.labels || ['Node']).forEach(l => { labelCounts[l] = (labelCounts[l] || 0) + 1; });
      });
      rawData.edges.forEach(e => {
        const t = e.type || 'UNKNOWN';
        relTypeCounts[t] = (relTypeCounts[t] || 0) + 1;
      });
      const totalNodes = rawData.nodes.length;
      const totalEdges = rawData.edges.length;

      // Helper to determine styling for a node label badge
      function getBadgeStyle(label, bgColor) {
        const isActive = (currentSelectedCategory === label);
        const isAnyActive = (currentSelectedCategory !== '*');
        let style = `background:${bgColor}; cursor:pointer; transition: all 0.15s ease;`;
        if (isActive) {
          style += `outline: 3px solid #7c3aed; outline-offset: 1px; opacity: 1; transform: scale(1.04); font-weight: 700;`;
        } else if (isAnyActive) {
          style += `opacity: 0.45;`;
        } else {
          style += `opacity: 1;`;
        }
        return style;
      }

      // Helper to determine styling for a relationship badge
      function getRelBadgeStyle(type, bgColor) {
        const isActive = (currentSelectedRelType === type);
        const isAnyActive = (currentSelectedRelType !== '*');
        let style = `background:${bgColor}; cursor:pointer; transition: all 0.15s ease;`;
        if (isActive) {
          style += `outline: 3px solid #7c3aed; outline-offset: 1px; opacity: 1; transform: scale(1.04); font-weight: 700;`;
        } else if (isAnyActive) {
          style += `opacity: 0.45;`;
        } else {
          style += `opacity: 1;`;
        }
        return style;
      }

      let html = `
        <div class="ov-section-row">
          <span class="ov-section-title">Nodes <span class="ov-section-count">(${totalNodes})</span></span>
          <button class="icon-btn" data-action="sort-overview" title="Toggle sort order"
            style="width:auto;padding:0 7px;gap:4px;display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--ge-fg-muted);border:1px solid var(--ge-border);border-radius:5px;height:22px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            ${_ovSortAlpha ? 'A \u2192 Z' : 'Count'}
          </button>
        </div>
        <div style="display:flex;flex-wrap:wrap;margin-bottom:18px;">
          <span class="label-badge" data-label="*" style="${getBadgeStyle('*', '#c8b9e0')}">* (${totalNodes})</span>`;
      const sortedLabels = Object.entries(labelCounts)
        .sort(_ovSortAlpha ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => b[1] - a[1]);
      sortedLabels.forEach(([label, count]) => {
        html += `<span class="label-badge" data-label="${escHtml(label)}" style="${getBadgeStyle(label, getLabelColor(label))}">${escHtml(label)} (${count})</span>`;
      });
      html += `</div>
        <div class="ov-section-row">
          <span class="ov-section-title">Relationships <span class="ov-section-count">(${totalEdges})</span></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;">
          <span class="rel-badge" data-reltype="*" style="${getRelBadgeStyle('*', '#b8b8b8')}">* (${totalEdges})</span>`;
      Object.entries(relTypeCounts).forEach(([type, count]) => {
        html += `<span class="rel-badge" data-reltype="${escHtml(type)}" style="${getRelBadgeStyle(type, '#c8c8c8')}">${escHtml(type)} (${count})</span>`;
      });
      html += '</div>';
      overviewStats.innerHTML = html;
    }

    function showOverview() {
      overviewContent.classList.remove('hidden');
      detailContent.classList.add('hidden');
    }

    let _currentDetailData = null;

    // ── Detail panel helpers ──────────────────────────────────────────

    function _statusBadge(props) {
      if (props._in_sql_path)    return `<span class="detail-node-badge" style="background:#f59e0b;color:#000;margin-left:4px;">In SQL</span>`;
      if (props._retrieved_only) return `<span class="detail-node-badge" style="background:#6b7280;color:#fff;margin-left:4px;">Fetched</span>`;
      return `<span class="detail-node-badge" style="background:#3b82f6;color:#fff;margin-left:4px;">Used</span>`;
    }

    function buildTableDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const meta = [];
      if (props.domain)     meta.push(`<span style="font-size:13px;background:var(--ge-bg-2);padding:2px 6px;border-radius:4px;">📁 ${escHtml(props.domain)}</span>`);
      if (props.row_count)  meta.push(`<span style="font-size:13px;color:var(--ge-fg-dim);">${Number(props.row_count).toLocaleString()} rows</span>`);
      if (node._feedbackNegative) meta.push(`<span style="font-size:13px;background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;">⚠ Negative feedback</span>`);
      if (node._feedbackPositive) meta.push(`<span style="font-size:13px;background:#14532d;color:#86efac;padding:2px 6px;border-radius:4px;">✓ Trusted</span>`);
      if (meta.length) h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${meta.join('')}</div>`;

      const measures = [], dimensions = [], filters = [], others = [];
      allEdges.filter(e => e.type === 'HAS_COLUMN' && e.from === node.id).forEach(e => {
        const col = nodeById.get(e.to);
        if (!col) return;
        const role = (col.properties || {}).role || '';
        const entry = { id: e.to, name: col.properties.name, role, agg: col.properties.aggregation };
        if (role === 'measure')                       measures.push(entry);
        else if (role === 'dimension')                dimensions.push(entry);
        else if (role === 'filter' || role === 'time_filter') filters.push(entry);
        else                                          others.push(entry);
      });

      function colGroup(label, items, color) {
        if (!items.length) return '';
        return `<div style="margin-bottom:8px;"><div style="font-size:13px;font-weight:600;text-transform:uppercase;color:${color};margin-bottom:4px;">${label}</div>` +
          items.map(c =>
            `<div style="font-size:14px;color:var(--ge-fg);padding:3px 2px;cursor:pointer;border-radius:3px;"
                  onclick="focusNodeById(${c.id})"
                  onmouseover="this.style.background='var(--ge-surface-2)'"
                  onmouseout="this.style.background=''"
                  title="Click to highlight in graph">
              ${escHtml(c.name)}${c.agg ? ` <span style="color:var(--ge-fg-dim);font-size:12px;">(${escHtml(c.agg)})</span>` : ''}
            </div>`
          ).join('') + '</div>';
      }
      const cols = colGroup('Measures', measures, '#f59e0b') + colGroup('Dimensions', dimensions, '#3b82f6') +
                   colGroup('Filters', filters, '#8b5cf6') + colGroup('Columns', others, '#6b7280');
      if (cols) h += `<div style="border-top:1px solid var(--ge-border);padding-top:8px;">${cols}</div>`;
      return h;
    }

    function buildColumnDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const roleColor = { measure:'#f59e0b', dimension:'#3b82f6', filter:'#8b5cf6', time_filter:'#10b981' };
      const bdg = [];
      if (props.data_type)   bdg.push(`<span style="font-size:13px;background:#1e3a5f;color:#60a5fa;padding:2px 6px;border-radius:4px;">${escHtml(props.data_type)}</span>`);
      if (props.role)        bdg.push(`<span style="font-size:13px;background:${roleColor[props.role]||'#6b7280'};color:#fff;padding:2px 6px;border-radius:4px;">${escHtml(props.role)}</span>`);
      if (props.aggregation) bdg.push(`<span style="font-size:13px;background:var(--ge-bg-2);padding:2px 6px;border-radius:4px;">${escHtml(props.aggregation)}</span>`);
      if (props.nullable === false || props.nullable === 'false') bdg.push(`<span style="font-size:13px;background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;">NOT NULL</span>`);
      if (bdg.length) h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${bdg.join('')}</div>`;
      const parentEdge = allEdges.find(e => e.type === 'HAS_COLUMN' && e.to === node.id);
      if (parentEdge) {
        const tbl = nodeById.get(parentEdge.from);
        if (tbl) h += `<div style="font-size:14px;color:var(--ge-fg-dim);">Table: <strong onclick="focusNodeById(${tbl.id})" style="cursor:pointer;text-decoration:underline dotted;" title="Click to highlight table in graph">${escHtml(tbl.properties.fqn || tbl.properties.name)}</strong></div>`;
      }
      return h;
    }

    function buildDomainDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const tables = allEdges.filter(e => e.type === 'BELONGS_TO' && e.to === node.id);
      if (tables.length) {
        h += `<div style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--ge-fg-dim);margin-bottom:5px;">${tables.length} Tables</div>`;
        tables.forEach(e => {
          const t = nodeById.get(e.from);
          if (t) h += `<div style="font-size:14px;color:var(--ge-fg);padding:2px 2px;cursor:pointer;border-radius:3px;"
                            onclick="focusNodeById(${t.id})"
                            onmouseover="this.style.background='var(--ge-surface-2)'"
                            onmouseout="this.style.background=''"
                            title="Click to highlight in graph">
            ${escHtml(t.properties.fqn || t.properties.name)}
          </div>`;
        });
      }
      return h;
    }

    function buildJoinDetail(edge, props) {
      let h = '';
      const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
      if (from && to) h += `<div style="font-size:14px;margin-bottom:8px;"><strong>${escHtml(from.properties.name||from.properties.fqn)}</strong><span style="color:var(--ge-fg-dim);"> → </span><strong>${escHtml(to.properties.name||to.properties.fqn)}</strong></div>`;
      if (props.join_clause) h += `<div style="font-size:13px;font-family:monospace;background:var(--ge-bg-2);padding:6px 8px;border-radius:4px;margin-bottom:8px;word-break:break-all;">${escHtml(props.join_clause)}</div>`;
      const conf = props.confidence || props.join_type || '';
      if (conf) { const cc = conf==='fk'?'#22c55e':conf==='inferred'?'#f59e0b':'#6b7280'; h += `<span style="font-size:13px;background:${cc};color:#fff;padding:2px 6px;border-radius:4px;">${escHtml(conf)}</span>`; }
      if (props.fan_out_risk) h += ` <span style="font-size:13px;background:#ef4444;color:#fff;padding:2px 6px;border-radius:4px;">⚠ Fan-out risk</span>`;
      return h || buildPropsTable(edge.neo4jId, props);
    }

    function buildAskQuestion(label, props) {
      const name = props.name || props.fqn || '';
      if (!name) return null;
      if (label === 'Table')  return `What data is available in the ${name} table and what business questions can I ask about it?`;
      if (label === 'Column') return `Tell me about the ${name} column — what does it measure and how is it used in analysis?`;
      if (label === 'Domain') return `What business questions can I answer using the ${name} domain?`;
      return null;
    }

    function copyAskQuestion(question) {
      function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4);';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(question).then(() => showToast('Copied \u2014 paste in chat')).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = question; ta.style.cssText = 'position:fixed;left:-9999px;';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Copied \u2014 paste in chat');
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = question; ta.style.cssText = 'position:fixed;left:-9999px;';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied \u2014 paste in chat');
      }
    }

    // Event delegation for Ask button (avoids inline onclick attribute escaping issues)
    document.getElementById('panel-inner').addEventListener('click', function(e) {
      const btn = e.target.closest('.ask-about-btn');
      if (btn) copyAskQuestion(btn.getAttribute('data-question'));
    });

    function showDetail(elementType, data) {
      _currentDetailData = { elementType, data };
      overviewContent.classList.add('hidden');
      detailContent.classList.remove('hidden');

      if (elementType === 'node') {
        const primaryLabel = (data.labels && data.labels[0]) || 'Node';
        const color = getLabelColor(primaryLabel);
        const props = data.properties || {};
        detailTitle.textContent = props.name || props.fqn || primaryLabel;

        let html = `<span class="detail-node-badge" style="background:${color};">${escHtml(primaryLabel)}</span>` + _statusBadge(props);
        html += `<hr style="border:none;border-top:1px solid var(--ge-border);margin:8px 0 12px;"/>`;

        if (primaryLabel === 'Table')       html += buildTableDetail(data, props);
        else if (primaryLabel === 'Column') html += buildColumnDetail(data, props);
        else if (primaryLabel === 'Domain') html += buildDomainDetail(data, props);
        else                                html += buildPropsTable(data.neo4jId, props);

        detailBody.innerHTML = html;
      } else {
        detailTitle.textContent = 'Relationship';
        const relType = data.type || data.label || 'RELATIONSHIP';
        const props = data.properties || {};
        let html = `<span class="detail-rel-badge">${escHtml(relType)}</span>`;
        html += `<hr style="border:none;border-top:1px solid var(--ge-border);margin:8px 0 12px;"/>`;
        if (relType === 'JOINS_TO' || relType === 'HAS_JOIN_PATH') html += buildJoinDetail(data, props);
        else html += buildPropsTable(data.neo4jId, props);
        detailBody.innerHTML = html;
      }
    }

    function focusNodeById(id) {
      const node = nodesDS.get(id);
      if (!node) return;
      // Reveal node if hidden (e.g. non-semantic-model column)
      if (node.hidden) {
        nodesDS.update({ id: id, hidden: false });
        // Also reveal edges connecting to this node
        const edgeIds = edgesByNode.get(id) || [];
        edgeIds.forEach(eid => {
          visibleEdgeIds.add(eid);
          edgesDS.update({ id: eid, hidden: false });
        });
      }
      showDetail('node', node);
      currentClickedNodeId = id;
      currentSelectedCategory = '*';
      currentSelectedRelType  = '*';
      buildOverview();
      updateGraphVisuals();
      network.focus(id, { scale: 1.4, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    }

    // ── Copy-all ─────────────────────────────────────────────────────
    copyAllBtn.addEventListener('click', () => {
      if (!_currentDetailData) return;
      const { elementType, data } = _currentDetailData;
      const obj = { id: data.neo4jId, ...data.properties };
      if (elementType === 'edge') obj.type = data.type;
      navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => {
        const orig = copyAllBtn.innerHTML;
        copyAllBtn.innerHTML = '<svg width="14" height="14" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => { copyAllBtn.innerHTML = orig; }, 1400);
      });
    });

    // Row copy via delegation — copies as { "key": value } JSON
    document.getElementById('panel-inner').addEventListener('click', e => {
      // Show all / Show less toggle
      const saBtn = e.target.closest('.show-all-btn');
      if (saBtn) {
        e.stopPropagation();
        const uid = saBtn.getAttribute('data-sa');
        const role = saBtn.getAttribute('data-role');
        const sEl = document.getElementById(uid + '-s');
        const fEl = document.getElementById(uid + '-f');
        if (role === 'short') { sEl.style.display = 'none'; fEl.style.display = 'inline'; }
        else { fEl.style.display = 'none'; sEl.style.display = 'inline'; }
        return;
      }
      const btn = e.target.closest('.copy-btn');
      if (btn) {
        e.stopPropagation();
        const k = btn.getAttribute('data-copykey');
        const v = btn.getAttribute('data-copyval');
        let parsed; try { parsed = JSON.parse(v); } catch { parsed = v; }
        copyText(JSON.stringify({ [k]: parsed }, null, 2), btn);
      }
    });

    // ── Network click handlers ────────────────────────────────────────
    network.on('click', params => {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = nodesDS.get(nodeId);
        if (node) {
          showDetail('node', node);
          _breadcrumbPush(nodeId);
        }
        currentClickedNodeId = nodeId;
        currentSelectedCategory = '*';
        currentSelectedRelType = '*';
        buildOverview();
        updateGraphVisuals();
        // Smooth zoom to clicked node + auto-open panel
        if (!panelOpen) setPanelOpen(true);
        network.focus(nodeId, { scale: 1.2, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
      } else if (params.edges.length > 0) {
        const edgeId = params.edges[0];
        const edge = edgesDS.get(edgeId);
        if (edge) showDetail('edge', edge);
        currentClickedNodeId = null;
        updateGraphVisuals();
      } else {
        showOverview();
        currentClickedNodeId = null;
        updateGraphVisuals();
      }
    });
    network.on('doubleClick', params => {
      if (params.nodes.length > 0) {
        // Expand hidden neighbors of the double-clicked node
        expandNode(params.nodes[0]);
      } else if (params.edges.length > 0) {
        const edge = edgesDS.get(params.edges[0]);
        if (edge) showDetail('edge', edge);
      }
    });

    // ── Rich hover tooltip ────────────────────────────────────────────
    const hoverCard = document.getElementById('hover-card');
    let _hoverTimer = null;

    function _showHoverCard(nodeId, domEvent) {
      const node = nodesDS.get(nodeId);
      if (!node) return;
      const props = node.properties || {};
      const label = (node.labels || [])[0] || 'Node';
      const name = props.name || props.title || props.term || props.fqn || node.label || '';
      const desc = props.description || props.question_text || props.error_type || '';
      const truncDesc = desc.length > 120 ? desc.slice(0, 117) + '…' : desc;

      // Determine role text
      let role = '';
      if (node._inSqlPath) role = '● In SQL path';
      else if (node._retrievedOnly) role = '○ Fetched (not used)';
      else role = '◉ Used in query';

      // Fill card
      hoverCard.querySelector('.hc-name').textContent = name;
      const typeBadge = hoverCard.querySelector('.hc-type');
      typeBadge.textContent = label;
      typeBadge.style.background = getLabelColor(label);
      typeBadge.style.color = 'rgba(0,0,0,0.75)';
      hoverCard.querySelector('.hc-desc').textContent = truncDesc;
      hoverCard.querySelector('.hc-role').textContent = role;

      // Position near cursor
      const x = (domEvent && domEvent.center) ? domEvent.center.x : (domEvent?.clientX || 0);
      const y = (domEvent && domEvent.center) ? domEvent.center.y : (domEvent?.clientY || 0);
      const cardW = 280, cardH = 140;
      const left = (x + cardW + 20 > window.innerWidth) ? x - cardW - 10 : x + 16;
      const top = (y + cardH + 20 > window.innerHeight) ? y - cardH - 10 : y + 16;
      hoverCard.style.left = left + 'px';
      hoverCard.style.top = top + 'px';
      hoverCard.classList.add('visible');
    }

    function _hideHoverCard() {
      hoverCard.classList.remove('visible');
    }

    network.on('hoverNode', function (params) {
      if (_hoverTimer) { clearTimeout(_hoverTimer); _hoverTimer = null; }
      _hoverTimer = setTimeout(() => _showHoverCard(params.node, params.event), 200);
    });
    network.on('blurNode', function () {
      if (_hoverTimer) { clearTimeout(_hoverTimer); _hoverTimer = null; }
      _hideHoverCard();
    });
    // Hide on drag/zoom so card doesn't stick
    network.on('dragStart', _hideHoverCard);
    network.on('zoom', _hideHoverCard);

    // ── Edge label on hover ───────────────────────────────────────────
    let _hoveredEdgeId = null;
    network.on('hoverEdge', function (params) {
      const edge = edgesDS.get(params.edge);
      if (edge && edge._label) {
        _hoveredEdgeId = params.edge;
        edgesDS.update({ id: params.edge, label: edge._label });
      }
    });
    network.on('blurEdge', function (params) {
      if (_hoveredEdgeId) {
        edgesDS.update({ id: _hoveredEdgeId, label: '' });
        _hoveredEdgeId = null;
      }
    });

    // ── Fuse.js fuzzy search index ───────────────────────────────────
    // Normalize underscores → spaces so "cash_flow" matches "cash flow"
    const fuseItems = allNodes.map(n => ({
      id: n.id,
      label: n.label || '',
      labelNorm: (n.label || '').replace(/_/g, ' '),      // cash_flow → "cash flow"
      labelStripped: (n.label || '').replace(/[_\s]/g, '')    // cash_flow → "cashflow"
    }));
    const fuse = new Fuse(fuseItems, {
      keys: ['label', 'labelNorm', 'labelStripped'],
      threshold: 0.45,
      ignoreLocation: true,
      minMatchCharLength: 1,
      includeScore: true
    });

    // ── Search & Visual Filter Updates ─────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');

    searchInput.addEventListener('input', e => {
      currentSearchQuery = e.target.value.trim();
      searchClear.style.display = currentSearchQuery ? 'inline' : 'none';
      currentSelectedCategory = '*';
      currentSelectedRelType = '*';
      currentClickedNodeId = null;
      buildOverview();
      updateGraphVisuals();
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      currentSearchQuery = '';
      buildOverview();
      updateGraphVisuals();
    });

    function updateGraphVisuals() {
      let matchedNodeIds = null;
      let matchedEdgeIds = null;

      const hasCategoryFilter = (currentSelectedCategory !== '*');
      const hasRelFilter = (currentSelectedRelType !== '*');
      const hasClickedNode = (currentClickedNodeId !== null);
      const hasSearch = (!!currentSearchQuery);

      if (hasClickedNode) {
        // Highlight clicked node + its neighbors
        matchedNodeIds = new Set();
        matchedNodeIds.add(currentClickedNodeId);
        
        const neighbors = network.getConnectedNodes(currentClickedNodeId);
        neighbors.forEach(id => matchedNodeIds.add(id));

        // Highlight visible edges connecting this node to neighbors
        matchedEdgeIds = new Set();
        allEdges.forEach(e => {
          if ((e.from === currentClickedNodeId && matchedNodeIds.has(e.to)) ||
              (e.to === currentClickedNodeId && matchedNodeIds.has(e.from))) {
            if (visibleEdgeIds.has(e.id)) {
              matchedEdgeIds.add(e.id);
            }
          }
        });
      } else if (hasCategoryFilter || hasRelFilter) {
        // Cumulative highlighting for sidebar filters
        matchedNodeIds = new Set();
        matchedEdgeIds = new Set();

        if (hasCategoryFilter) {
          allNodes.forEach(n => {
            const labels = n.labels || ['Node'];
            if (labels.includes(currentSelectedCategory)) {
              matchedNodeIds.add(n.id);
            }
          });
          // Include edges connecting nodes of the selected category
          allEdges.forEach(e => {
            if (matchedNodeIds.has(e.from) && matchedNodeIds.has(e.to)) {
              if (visibleEdgeIds.has(e.id)) {
                matchedEdgeIds.add(e.id);
              }
            }
          });
        }

        if (hasRelFilter) {
          allEdges.forEach(e => {
            if (e.type === currentSelectedRelType) {
              matchedEdgeIds.add(e.id);
              matchedNodeIds.add(e.from);
              matchedNodeIds.add(e.to);
            }
          });
        }
      } else if (hasSearch) {
        // Highlight fuzzy search match nodes
        const qNorm = currentSearchQuery.replace(/_/g, ' ');
        const results = fuse.search(qNorm);
        matchedNodeIds = new Set(results.map(r => r.item.id));

        // Highlight edges where both endpoints match
        matchedEdgeIds = new Set();
        allEdges.forEach(e => {
          if (matchedNodeIds.has(e.from) && matchedNodeIds.has(e.to)) {
            if (visibleEdgeIds.has(e.id)) {
              matchedEdgeIds.add(e.id);
            }
          }
        });
      }

      // ── Apply Node updates ──────────────────────────
      const dark = document.documentElement.classList.contains('dark');
      const dimmedBg = dark ? '#3a4250' : '#c8cdd5';
      const dimmedBorder = dark ? '#4a5568' : '#9ca3af';
      const dimmedText = dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';

      const nodeUpdates = nodesDS.get().map(n => {
        const hasHidden = hasHiddenEdges(n.id);
        const baseColor = origColors[n.id];
        const expandColor = hasHidden ? {
          ...baseColor, border: EXPAND_BORDER,
          highlight: { background: baseColor.background, border: EXPAND_BORDER },
          hover:     { background: baseColor.background, border: '#7c3aed' }
        } : baseColor;

        if (matchedNodeIds === null) {
          // No active filter, reset to normal
          return {
            id: n.id, opacity: 1, color: expandColor,
            borderWidth: hasHidden ? 3 : 2,
            shapeProperties: hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
            font: { color: dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)' },
            shadow: { enabled: false }
          };
        }

        const isMatch = matchedNodeIds.has(n.id);
        return {
          id: n.id,
          color: isMatch ? expandColor : {
            background: dimmedBg,
            border: dimmedBorder,
            highlight: { background: dimmedBg, border: dimmedBorder },
            hover: { background: dimmedBg, border: dimmedBorder }
          },
          borderWidth: isMatch && hasHidden ? 3 : 2,
          shapeProperties: isMatch && hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          shadow: { enabled: false },
          font: { color: isMatch ? (dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)') : dimmedText },
          opacity: isMatch ? 1 : 0.55
        };
      });
      nodesDS.update(nodeUpdates);

      // ── Apply Edge updates ──────────────────────────
      const normalEdgeColor = dark ? '#445060' : '#b0b8c4';
      const dimmedEdgeColor = dark ? '#3a4250' : '#c0c7d0';

      const edgeUpdates = edgesDS.get().map(e => {
        let isHidden = !edgesVisible || !visibleEdgeIds.has(e.id);
        const isMatch = (matchedEdgeIds !== null && matchedEdgeIds.has(e.id));
        
        // Force visible if it matches the active relationship filter type
        if (isMatch && hasRelFilter && e.type === currentSelectedRelType) {
          isHidden = false;
        }

        if (matchedEdgeIds === null) {
          return {
            id: e.id,
            hidden: isHidden,
            color: { color: normalEdgeColor }
          };
        }

        return {
          id: e.id,
          hidden: isHidden,
          color: {
            color: isMatch ? normalEdgeColor : dimmedEdgeColor
          }
        };
      });
      edgesDS.update(edgeUpdates);
    }

    // ── Fit ──────────────────────────────────────────────────────────
    document.getElementById('fit-btn').addEventListener('click', () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeOutQuad' } });
    });

    // ── Auto Layout (scatter → physics stabilization) ─────────────────
    document.getElementById('layout-btn').addEventListener('click', () => {
      runAutoLayout();
    });

    // ── Init ─────────────────────────────────────────────────────────
    // Sort button delegation (survives innerHTML re-renders)
    overviewStats.addEventListener('click', e => {
      if (e.target.closest('[data-action="sort-overview"]')) {
        _ovSortAlpha = !_ovSortAlpha;
        buildOverview();
        return;
      }

      // Handle Node Category Badge clicks
      const labelBadge = e.target.closest('.label-badge');
      if (labelBadge) {
        const label = labelBadge.getAttribute('data-label');
        if (label) {
          if (currentSelectedCategory === label) {
            currentSelectedCategory = '*';
          } else {
            currentSelectedCategory = label;
          }
          currentClickedNodeId = null;
          searchInput.value = '';
          searchClear.style.display = 'none';
          currentSearchQuery = '';
          buildOverview();
          updateGraphVisuals();
          return;
        }
      }

      // Handle Relationship Type Badge clicks
      const relBadge = e.target.closest('.rel-badge');
      if (relBadge) {
        const type = relBadge.getAttribute('data-reltype');
        if (type) {
          if (currentSelectedRelType === type) {
            currentSelectedRelType = '*';
          } else {
            currentSelectedRelType = type;
          }
          currentClickedNodeId = null;
          searchInput.value = '';
          searchClear.style.display = 'none';
          currentSearchQuery = '';
          buildOverview();
          updateGraphVisuals();
          return;
        }
      }
    });
    buildOverview();
