    // ── Convert to vis.js ────────────────────────────────────────────
    function truncLabel(s, max = 11) {
      if (!s) return '';
      return s.length > max ? s.slice(0, max - 1) + '\u2026' : s;
    }

    // Store original colors for search reset
    const origColors = {};

    function convertResultsToVis(records) {
      const nodeMap = new Map();
      const nodes = [], edges = [];

      function addNode(nd) {
        if (!nd || nodeMap.has(nd.identity)) return;
        nodeMap.set(nd.identity, nd);
        const primaryLabel = (nd.labels && nd.labels[0]) || 'Node';
        const bg     = getLabelColor(primaryLabel);
        const border = darkenHex(bg, 30);
        const colorObj = {
          background: bg, border,
          highlight: { background: bg, border: '#57C7E3' },
          hover:     { background: bg, border: darkenHex(bg, 15) }
        };
        origColors[nd.identity] = colorObj;
        const rawLabel = nd.properties.name || nd.properties.title || primaryLabel;
        nodes.push({
          id:         nd.identity,
          label:      rawLabel,
          title:      rawLabel,        // tooltip shows full name
          labels:     nd.labels,
          properties: nd.properties,
          neo4jId:    nd.identity,
          shape:      'circle',        // label INSIDE the circle
          borderWidth: 2,
          borderWidthSelected: 3,
          color:      colorObj,
          font:       { color: 'rgba(0,0,0,0.82)', size: 12, face: 'Inter,system-ui,sans-serif', bold: false, multi: false },
          widthConstraint: { maximum: 100 }
        });
      }

      records.forEach(record => {
        addNode(record.n); addNode(record.m);
        if (record.r) {
          edges.push({
            id:         record.r.identity,
            from:       record.r.start,
            to:         record.r.end,
            label:      record.r.type,
            type:       record.r.type,
            properties: record.r.properties,
            neo4jId:    record.r.identity,
            arrows:     { to: { enabled: true, scaleFactor: 0.7 } },
            color:      { color: '#b0b8c4', highlight: '#57C7E3', hover: '#7a8898' },
            smooth:     { enabled: true, type: 'dynamic', roundness: 0.5 }
          });
        }
      });
      return { nodes, edges };
    }

    const rawData = convertResultsToVis(cypherResult);

    // ── Lazy loading: seed with top-N nodes, expand on double-click ────
    // All nodes start visible with no edges — expand/collapse manages edge visibility
    const allNodes = rawData.nodes;
    const allEdges = rawData.edges;
    const nodeById  = new Map(allNodes.map(n => [n.id, n]));

    // ── Fuzzy search (Fuse.js) ───────────────────────────────────────
    // Normalise: lowercase + strip separators so cash_flow ↔ cashflow ↔ "cash flow" all match
    function normalizeStr(s) {
      return (s || '').toLowerCase().replace(/[\s_\-]+/g, '');
    }
    const _fuseRaw  = new Fuse(allNodes, { keys: ['label'], threshold: 0.35, includeScore: true });
    const _fuseNorm = new Fuse(
      allNodes.map(n => ({ id: n.id, norm: normalizeStr(n.label || '') })),
      { keys: ['norm'], threshold: 0.3, includeScore: true }
    );
    function fuzzyMatch(q) {
      const r1 = _fuseRaw.search(q).map(r => r.item.id);
      const nq  = normalizeStr(q);
      const r2 = _fuseNorm.search(nq).map(r => r.item.id);
      return new Set([...r1, ...r2]);
    }

    const visibleNodeIds = new Set(allNodes.map(n => n.id));
    const visibleEdgeIds = new Set(allEdges.map(e => e.id));

    // True only when the node has BOTH a visible edge (been touched) AND a hidden edge (more to explore).
    // On initial load (no edges visible) every node is clean \u2014 rings appear contextually as you explore.
    function hasHiddenEdges(nodeId) {
      const nodeEdges = allEdges.filter(e => e.from === nodeId || e.to === nodeId);
      const hasVisible = nodeEdges.some(e => visibleEdgeIds.has(e.id));
      const hasHidden  = nodeEdges.some(e => !visibleEdgeIds.has(e.id));
      return hasVisible && hasHidden;
    }

    // Dashed ring = node is a hub with unexplored connections (no glow \u2014 subtle)
    const EXPAND_BORDER = '#8b5cf6';
    function withExpansionStyle(node) {
      if (!hasHiddenEdges(node.id)) return node;
      return {
        ...node,
        borderWidth: 3,
        shapeProperties: { borderDashes: [6, 3] },
        color: {
          ...node.color,
          border: EXPAND_BORDER,
          highlight: { background: node.color.background, border: EXPAND_BORDER },
          hover:     { background: node.color.background, border: '#7c3aed' }
        },
        shadow: { enabled: false },
        title: node.title + ' \u00b7 double-click to expand'
      };
    }

    // Status bar removed
    function updateStatus() {}

    // Refresh dashed-ring indicators for all currently visible nodes
    function refreshExpansionStyles() {
      nodesDS.update(nodesDS.get().map(n => {
        const orig = nodeById.get(n.id);
        if (!orig) return { id: n.id };
        const hasHidden = hasHiddenEdges(n.id);
        return {
          id: n.id,
          borderWidth: hasHidden ? 3 : 2,
          shapeProperties: hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          color: hasHidden
            ? { ...orig.color, border: EXPAND_BORDER,
                highlight: { background: orig.color.background, border: EXPAND_BORDER },
                hover:     { background: orig.color.background, border: '#7c3aed' } }
            : orig.color,
          shadow: { enabled: false },
          title: orig.title + (hasHidden ? ' \u00b7 double-click to expand' : '')
        };
      }));
    }

    // Show all edges for nodeId that are not yet on canvas
    function expandNode(nodeId) {
      const newEdges = [];
      allEdges.forEach(e => {
        if ((e.from === nodeId || e.to === nodeId) && !visibleEdgeIds.has(e.id)) {
          visibleEdgeIds.add(e.id);
          newEdges.push(e);
        }
      });
      if (newEdges.length) edgesDS.add(newEdges);
      refreshExpansionStyles();
      updateStatus();
    }

    // Hide all currently visible edges for nodeId
    function collapseNode(nodeId) {
      const toRemove = [];
      visibleEdgeIds.forEach(eid => {
        const e = edgesDS.get(eid);
        if (e && (e.from === nodeId || e.to === nodeId)) toRemove.push(eid);
      });
      if (!toRemove.length) return;
      toRemove.forEach(eid => visibleEdgeIds.delete(eid));
      edgesDS.remove(toRemove);
      refreshExpansionStyles();
      updateStatus();
    }

    // Show all edges (visible + hidden) connected to nodeId in the details panel
    function showAllRelationships(nodeId) {
      const node = nodeById.get(nodeId);
      if (!node) return;
      const rels = [];
      allEdges.forEach(e => {
        if (e.from === nodeId)
          rels.push({ dir: 'out', type: e.type, otherId: e.to,   visible: visibleEdgeIds.has(e.id) });
        else if (e.to === nodeId)
          rels.push({ dir: 'in',  type: e.type, otherId: e.from, visible: visibleEdgeIds.has(e.id) });
      });
      const primaryLabel = (node.labels && node.labels[0]) || 'Node';
      const color = getLabelColor(primaryLabel);
      let html = `<span class="detail-node-badge" style="background:${color};">${escHtml(primaryLabel)}</span>
        <div style="font-size:14px;font-weight:700;color:var(--ge-fg-heading);margin-bottom:10px;">${escHtml(node.label || '')}</div>
        <hr style="border:none;border-top:1px solid var(--ge-border);margin-bottom:12px;"/>
        <div style="font-size:11px;font-weight:700;color:var(--ge-fg-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">All Relationships (${rels.length})</div>`;
      if (!rels.length) {
        html += `<div style="color:var(--ge-fg-muted);font-size:13px;padding:8px 0;">No relationships found.</div>`;
      } else {
        rels.forEach(({ dir, type, otherId, visible }) => {
          const other = nodeById.get(otherId);
          const otherName = other ? (other.label || String(otherId)) : String(otherId);
          const arrowOut = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
          const arrowIn  = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M11 6L5 12l6 6"/></svg>`;
          const hiddenBadge = visible ? '' : `<span style="font-size:10px;background:var(--ge-border-subtle);color:var(--ge-fg-muted);border-radius:3px;padding:1px 5px;margin-left:4px;">hidden</span>`;
          html += `<div style="padding:8px 0;border-bottom:1px solid var(--ge-border-subtle);display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ge-fg-muted);">
            ${dir === 'out' ? arrowOut : arrowIn}
            <span style="display:inline-flex;align-items:center;padding:2px 12px;background:var(--ge-surface-2);font-size:10px;font-weight:700;color:var(--ge-fg-body);
              clip-path:polygon(8px 0%,calc(100% - 8px) 0%,100% 50%,calc(100% - 8px) 100%,8px 100%,0% 50%);">${escHtml(type)}</span>
            <span style="font-size:12px;color:var(--ge-fg-body);">${escHtml(otherName)}${hiddenBadge}</span>
          </div>`;
        });
      }
      detailTitle.textContent = 'All Relationships';
      detailBody.innerHTML = html;
      overviewContent.classList.add('hidden');
      detailContent.classList.remove('hidden');
      setPanelOpen(true);
    }

    // Initial state: all nodes and all edges visible
    const nodesDS = new vis.DataSet(allNodes.map(withExpansionStyle));
    const edgesDS = new vis.DataSet(allEdges);

    // ── vis.js options ───────────────────────────────────────────────
    const visOptions = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -55,
          centralGravity: 0.01,
          springLength: 130,
          springConstant: 0.08,
          damping: 0.42,
          avoidOverlap: 0.8
        },
        stabilization: { iterations: 300, updateInterval: 25 }
      },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true, selectConnectedEdges: false, hoverConnectedEdges: false },
      edges: {
        smooth:  { enabled: true, type: 'dynamic', roundness: 0.5 },
        // align:'top' = label rotates PARALLEL to the edge; color/stroke driven by getVisThemeOptions()
        font:    { align: 'top', size: 10, color: '#6b7280', strokeWidth: 4, strokeColor: '#ffffff' },
        arrows:  { to: { enabled: true, scaleFactor: 0.7 } },
        color:   { color: '#b0b8c4', highlight: '#57C7E3', hover: '#7a8898' }
      },
      nodes: {
        shape:       'circle',
        borderWidth: 2,
        borderWidthSelected: 3,
        font:        { size: 12, face: 'Inter,system-ui', color: 'rgba(0,0,0,0.82)' }
      }
    };

    const container = document.getElementById('mynetwork');
    const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, visOptions);

    // Runs on page load (automatic) and when the Auto Layout button is clicked.
    function runAutoLayout() {
      const btn  = document.getElementById('layout-btn');
      const icon = document.getElementById('layout-icon');
      btn.disabled = true;
      icon.classList.add('spinning');

      const allIds = nodesDS.getIds();
      const spread = Math.max(600, allIds.length * 60);
      nodesDS.update(allIds.map(id => ({
        id,
        x: (Math.random() - 0.5) * spread,
        y: (Math.random() - 0.5) * spread,
        fixed: false
      })));

      network.setOptions({
        physics: {
          enabled: true,
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -80,
            centralGravity: 0.008,
            springLength: 140,
            springConstant: 0.08,
            damping: 0.45,
            avoidOverlap: 1
          },
          stabilization: { enabled: true, updateInterval: 30 }
        }
      });

      network.once('stabilizationIterationsDone', () => {
        network.stopSimulation();
        network.fit({ animation: { duration: 500, easingFunction: 'easeOutQuad' } });
        btn.disabled = false;
        icon.classList.remove('spinning');
      });

      network.stabilize(500);
    }

    // Auto-run layout on initial load
    runAutoLayout();

    // ── Panel refs ───────────────────────────────────────────────────
    const overviewContent = document.getElementById('overviewContent');
    const detailContent   = document.getElementById('detailContent');
    const detailTitle     = document.getElementById('detailTitle');
    const detailBody      = document.getElementById('detailBody');
    const overviewStats   = document.getElementById('overviewStats');
    const copyAllBtn      = document.getElementById('copyAllBtn');
    const panelInner      = document.getElementById('panel-inner');
    const toggleChevron   = document.getElementById('toggle-chevron');

    // ── Panel toggle (default: collapsed) ───────────────────────────
    let panelOpen = false;   // start collapsed
    let _ovSortAlpha = false; // false = sort by count desc, true = sort A-Z

    const panelToggleBtn = document.getElementById('panel-toggle');
    function setPanelOpen(open) {
      panelOpen = open;
      if (open) {
        panelInner.classList.remove('collapsed');
        panelToggleBtn.style.right = '480px';
        toggleChevron.setAttribute('points', '9 18 15 12 9 6'); // ‹ close
      } else {
        panelInner.classList.add('collapsed');
        panelToggleBtn.style.right = '0px';
        toggleChevron.setAttribute('points', '15 18 9 12 15 6'); // › open
      }
    }
    panelToggleBtn.addEventListener('click', () => setPanelOpen(!panelOpen));

    // ── Helpers ──────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(String(text)).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        btn.style.opacity = '1';
        setTimeout(() => { btn.innerHTML = orig; btn.style.opacity = ''; }, 1400);
      });
    }

    // ── Properties table ─────────────────────────────────────────────
    function buildPropsTable(neo4jId, properties) {
      const rows = [{ key:'<id>', value: String(neo4jId) }];
      Object.keys(properties).sort().forEach(k => {
        const v = properties[k];
        rows.push({ key: k, value: Array.isArray(v) ? JSON.stringify(v) : String(v) });
      });
      let html = '<table class="prop-table"><thead><tr><th>Key</th><th>Value</th><th></th></tr></thead><tbody>';
      rows.forEach(({ key, value }) => {
        if (!window._saCtr) window._saCtr = 0;
        let valueHtml;
        if (value.length > 180) {
          const uid = 'sa' + (++window._saCtr);
          valueHtml = '<span id="' + uid + '-s">' + escHtml(value.slice(0,180)) + '\u2026<button class="show-all-btn" data-sa="' + uid + '" data-role="short">Show all</button></span>'
                    + '<span id="' + uid + '-f" style="display:none">' + escHtml(value) + '<button class="show-all-btn" data-sa="' + uid + '" data-role="full">Show less</button></span>';
        } else {
          valueHtml = escHtml(value);
        }
        html += `<tr>
          <td class="prop-key">${escHtml(key)}</td>
          <td class="prop-value">${valueHtml}</td>
          <td class="prop-copy-td">
            <button class="copy-btn" data-copykey="${escHtml(key)}" data-copyval="${escHtml(value)}" title="Copy">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
            </button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    // ── Overview ──────────────────────────────────────────────────────
    function buildOverview() {
      const labelCounts = {}, relTypeCounts = {};
      rawData.nodes.forEach(n => {
        (n.labels || ['Node']).forEach(l => { labelCounts[l] = (labelCounts[l]||0) + 1; });
      });
      rawData.edges.forEach(e => {
        const t = e.type || 'UNKNOWN';
        relTypeCounts[t] = (relTypeCounts[t]||0) + 1;
      });
      const totalNodes = rawData.nodes.length;
      const totalEdges = rawData.edges.length;

      let html = `
        <div class="ov-section-row">
          <span class="ov-section-title">Nodes <span class="ov-section-count">(${totalNodes})</span></span>
          <button class="icon-btn" data-action="sort-overview" title="Toggle sort order"
            style="width:auto;padding:0 7px;gap:4px;display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--ge-fg-muted);border:1px solid var(--ge-border);border-radius:5px;height:22px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            ${_ovSortAlpha ? 'A \u2192 Z' : 'Count'}
          </button>
        </div>
        <div style="display:flex;flex-wrap:wrap;margin-bottom:18px;">
          <span class="label-badge" style="background:#c8b9e0;">* (${totalNodes})</span>`;
      const sortedLabels = Object.entries(labelCounts)
        .sort(_ovSortAlpha ? (a,b) => a[0].localeCompare(b[0]) : (a,b) => b[1]-a[1]);
      sortedLabels.forEach(([label, count]) => {
        html += `<span class="label-badge" style="background:${getLabelColor(label)};">${escHtml(label)} (${count})</span>`;
      });
      html += `</div>
        <div class="ov-section-row">
          <span class="ov-section-title">Relationships <span class="ov-section-count">(${totalEdges})</span></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;">
          <span class="rel-badge" style="background:#b8b8b8;">* (${totalEdges})</span>`;
      Object.entries(relTypeCounts).forEach(([type, count]) => {
        html += `<span class="rel-badge">${escHtml(type)} (${count})</span>`;
      });
      html += '</div>';
      overviewStats.innerHTML = html;
    }

    function showOverview() {
      overviewContent.classList.remove('hidden');
      detailContent.classList.add('hidden');
    }

    let _currentDetailData = null;

    function showDetail(elementType, data) {
      _currentDetailData = { elementType, data };
      overviewContent.classList.add('hidden');
      detailContent.classList.remove('hidden');

      if (elementType === 'node') {
        detailTitle.textContent = 'Node details';
        const primaryLabel = (data.labels && data.labels[0]) || 'Node';
        const color = getLabelColor(primaryLabel);
        detailBody.innerHTML =
          `<span class="detail-node-badge" style="background:${color};">${escHtml(primaryLabel)}</span>` +
          `<hr style="border:none;border-top:1px solid var(--ge-border);margin-bottom:12px;"/>` +
          buildPropsTable(data.neo4jId, data.properties || {});
      } else {
        detailTitle.textContent = 'Relationship details';
        const relType = data.type || data.label || 'RELATIONSHIP';
        detailBody.innerHTML =
          `<span class="detail-rel-badge">${escHtml(relType)}</span>` +
          `<hr style="border:none;border-top:1px solid var(--ge-border);margin-bottom:12px;"/>` +
          buildPropsTable(data.neo4jId, data.properties || {});
      }
    }

    // ── Copy-all ─────────────────────────────────────────────────────
    copyAllBtn.addEventListener('click', () => {
      if (!_currentDetailData) return;
      const { elementType, data } = _currentDetailData;
      const obj = { id: data.neo4jId, ...data.properties };
      if (elementType === 'edge') obj.type = data.type;
      navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => {
        const orig = copyAllBtn.innerHTML;
        copyAllBtn.innerHTML = '<svg width="14" height="14" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => { copyAllBtn.innerHTML = orig; }, 1400);
      });
    });

    // Row copy via delegation — copies as { "key": value } JSON
    document.getElementById('panel-inner').addEventListener('click', e => {
      // Show all / Show less toggle
      const saBtn = e.target.closest('.show-all-btn');
      if (saBtn) {
        e.stopPropagation();
        const uid = saBtn.getAttribute('data-sa');
        const role = saBtn.getAttribute('data-role');
        const sEl = document.getElementById(uid + '-s');
        const fEl = document.getElementById(uid + '-f');
        if (role === 'short') { sEl.style.display = 'none'; fEl.style.display = 'inline'; }
        else { fEl.style.display = 'none'; sEl.style.display = 'inline'; }
        return;
      }
      const btn = e.target.closest('.copy-btn');
      if (btn) {
        e.stopPropagation();
        const k = btn.getAttribute('data-copykey');
        const v = btn.getAttribute('data-copyval');
        let parsed; try { parsed = JSON.parse(v); } catch { parsed = v; }
        copyText(JSON.stringify({ [k]: parsed }, null, 2), btn);
      }
    });

    // ── Network click handlers ────────────────────────────────────────
    network.on('click', params => {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = nodesDS.get(nodeId);
        if (node) showDetail('node', node);
      } else if (params.edges.length > 0) {
        const edgeId = params.edges[0];
        const edge = edgesDS.get(edgeId);
        if (edge) showDetail('edge', edge);
      } else {
        showOverview();
      }
    });
    network.on('doubleClick', params => {
      if (params.nodes.length > 0) {
        // Expand hidden neighbors of the double-clicked node
        expandNode(params.nodes[0]);
      } else if (params.edges.length > 0) {
        const edge = edgesDS.get(params.edges[0]);
        if (edge) showDetail('edge', edge);
      }
    });

    // ── Search ───────────────────────────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');

    searchInput.addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      searchClear.style.display = q ? 'inline' : 'none';
      applySearch(q);
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      applySearch('');
    });

    function applySearch(q) {
      const matchIds = q ? fuzzyMatch(q) : null;
      const updates = nodesDS.get().map(n => {
        const hasHidden = hasHiddenEdges(n.id);
        const baseColor = origColors[n.id];
        const expandColor = hasHidden ? {
          ...baseColor, border: EXPAND_BORDER,
          highlight: { background: baseColor.background, border: EXPAND_BORDER },
          hover:     { background: baseColor.background, border: '#7c3aed' }
        } : baseColor;
        if (!q) return {
          id: n.id, opacity: 1, color: expandColor,
          borderWidth: hasHidden ? 3 : 2,
          shapeProperties: hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          shadow: { enabled: false }
        };
        const match = matchIds.has(n.id);
        return {
          id: n.id,
          color: match ? expandColor : { background: '#e5e7eb', border: '#d1d5db', highlight: { background: '#e5e7eb', border: '#9ca3af' }, hover: { background: '#e5e7eb', border: '#9ca3af' } },
          borderWidth: match && hasHidden ? 3 : 2,
          shapeProperties: match && hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          shadow: { enabled: false },
          opacity: match ? 1 : 0.28
        };
      });
      nodesDS.update(updates);
    }

    // ── Fit ──────────────────────────────────────────────────────────
    document.getElementById('fit-btn').addEventListener('click', () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeOutQuad' } });
    });

    // ── Auto Layout (scatter → physics stabilization) ─────────────────
    document.getElementById('layout-btn').addEventListener('click', () => {
      runAutoLayout();
    });

    // ── Init ─────────────────────────────────────────────────────────
    // Sort button delegation (survives innerHTML re-renders)
    overviewStats.addEventListener('click', e => {
      if (e.target.closest('[data-action="sort-overview"]')) {
        _ovSortAlpha = !_ovSortAlpha;
        buildOverview();
      }
    });
    updateStatus();
    buildOverview();
    showOverview();
    // Default: panel collapsed, button at far right, chevron points right (= "open")
    toggleChevron.setAttribute('points', '15 18 9 12 15 6');
    document.getElementById('panel-toggle').style.right = '0px';

    // ── Right-click context menu ─────────────────────────────────────────
    let ctxNodeId = null;
    const ctxMenu = document.getElementById('ctx-menu');

    function showCtxMenu(nodeId, x, y) {
      ctxNodeId = nodeId;
      const canExpand      = hasHiddenEdges(nodeId);
      const visEdgesCnt    = allEdges.filter(e => (e.from === nodeId || e.to === nodeId) && visibleEdgeIds.has(e.id)).length;
      const canCollapse    = visEdgesCnt > 0;
      const totalRels      = allEdges.filter(e => e.from === nodeId || e.to === nodeId).length;

      document.getElementById('ctx-expand').classList.toggle('ctx-disabled', !canExpand);
      document.getElementById('ctx-collapse').classList.toggle('ctx-disabled', !canCollapse);
      document.getElementById('ctx-collapse-sub').textContent = canCollapse
        ? `Hide ${visEdgesCnt} visible connection(s)`
        : 'No visible connections to hide';
      document.getElementById('ctx-rels-sub').textContent = `${totalRels} total relationship(s)`;

      ctxMenu.style.display = 'block';
      const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
      const vw = window.innerWidth,   vh = window.innerHeight;
      ctxMenu.style.left = (x + mw > vw ? x - mw : x) + 'px';
      ctxMenu.style.top  = (y + mh > vh ? y - mh : y) + 'px';
    }

    function hideCtxMenu() { ctxMenu.style.display = 'none'; ctxNodeId = null; }

    network.on('oncontext', params => {
      params.event.preventDefault();
      const nodeId = network.getNodeAt(params.pointer.DOM);
      if (nodeId === undefined) { hideCtxMenu(); return; }
      showCtxMenu(nodeId, params.event.clientX, params.event.clientY);
    });

    document.getElementById('ctx-expand').addEventListener('click', () => {
      if (ctxNodeId !== null) { expandNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-collapse').addEventListener('click', () => {
      if (ctxNodeId !== null) { collapseNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-show-rels').addEventListener('click', () => {
      if (ctxNodeId !== null) { showAllRelationships(ctxNodeId); hideCtxMenu(); }
    });

    document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // ── Theme toggle ─────────────────────────────────────────────────
    const themeBtn      = document.getElementById('theme-btn');
    const themeIconSun  = document.getElementById('theme-icon-sun');
    const themeIconMoon = document.getElementById('theme-icon-moon');
    const themeLabel    = document.getElementById('theme-label');

    function getVisThemeOptions() {
      const dark = document.documentElement.classList.contains('dark');
      return {
        nodes: { font: { color: dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)' } },
        edges: {
          color: {
            color:     dark ? '#445060' : '#b0b8c4',
            highlight: dark ? '#4ea6e0' : '#57C7E3',
            hover:     dark ? '#556070' : '#7a8898'
          },
          font: {
            color:       dark ? '#c9d4e0' : '#6b7280',
            strokeWidth: dark ? 0        : 4,
            strokeColor: dark ? 'transparent' : '#ffffff'
          }
        }
      };
    }

    function applyTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        themeIconSun.style.display  = 'none';
        themeIconMoon.style.display = '';
        themeLabel.textContent      = 'Light';
      } else {
        document.documentElement.classList.remove('dark');
        themeIconSun.style.display  = '';
        themeIconMoon.style.display = 'none';
        themeLabel.textContent      = 'Dark';
      }
      network.setOptions(getVisThemeOptions());
      try { localStorage.setItem('ge-theme', dark ? 'dark' : 'light'); } catch {}
    }

    themeBtn.addEventListener('click', () => {
      applyTheme(!document.documentElement.classList.contains('dark'));
    });

    // Restore saved theme preference
    try {
      if (localStorage.getItem('ge-theme') === 'dark') applyTheme(true);
    } catch {}

    // ── Edges toggle ─────────────────────────────────────────────────
    const edgesBtn   = document.getElementById('edges-btn');
    const edgesLabel = document.getElementById('edges-label');
    let edgesVisible = true;

    edgesBtn.addEventListener('click', () => {
      edgesVisible = !edgesVisible;
      if (edgesVisible) {
        // Restore all edges that aren't already on canvas
        const currentIds = new Set(edgesDS.getIds());
        const toAdd = allEdges.filter(e => !currentIds.has(e.id));
        if (toAdd.length) edgesDS.add(toAdd);
        allEdges.forEach(e => visibleEdgeIds.add(e.id));
        edgesLabel.textContent = 'Hide relationships';
        edgesBtn.classList.remove('active');
        runAutoLayout();
      } else {
        edgesDS.remove(edgesDS.getIds());
        visibleEdgeIds.clear();
        edgesLabel.textContent = 'Show relationships';
        edgesBtn.classList.add('active');
      }
      refreshExpansionStyles();
      updateStatus();
    });
  </script>
</body>
</html>
