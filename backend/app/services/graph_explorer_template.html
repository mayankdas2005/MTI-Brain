    showOverview();
    // Default: panel collapsed, button at far right, chevron points right (= "open")
    toggleChevron.setAttribute('points', '15 18 9 12 15 6');
    document.getElementById('panel-toggle').style.right = '0px';

    // ── Right-click context menu ─────────────────────────────────────────
    let ctxNodeId = null;
    const ctxMenu = document.getElementById('ctx-menu');

    function showCtxMenu(nodeId, x, y) {
      ctxNodeId = nodeId;
      const canExpand = hasHiddenEdges(nodeId);
      const visEdgesCnt = allEdges.filter(e => (e.from === nodeId || e.to === nodeId) && visibleEdgeIds.has(e.id)).length;
      const canCollapse = visEdgesCnt > 0;
      const totalRels = allEdges.filter(e => e.from === nodeId || e.to === nodeId).length;

      document.getElementById('ctx-expand').classList.toggle('ctx-disabled', !canExpand);
      document.getElementById('ctx-collapse').classList.toggle('ctx-disabled', !canCollapse);
      document.getElementById('ctx-collapse-sub').textContent = canCollapse
        ? `Hide ${visEdgesCnt} visible connection(s)`
        : 'No visible connections to hide';
      document.getElementById('ctx-rels-sub').textContent = `${totalRels} total relationship(s)`;

      ctxMenu.style.display = 'block';
      const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      ctxMenu.style.left = (x + mw > vw ? x - mw : x) + 'px';
      ctxMenu.style.top = (y + mh > vh ? y - mh : y) + 'px';
    }

    function hideCtxMenu() { ctxMenu.style.display = 'none'; ctxNodeId = null; }

    network.on('oncontext', params => {
      params.event.preventDefault();
      const nodeId = network.getNodeAt(params.pointer.DOM);
      if (nodeId === undefined) { hideCtxMenu(); return; }
      showCtxMenu(nodeId, params.event.clientX, params.event.clientY);
    });

    document.getElementById('ctx-expand').addEventListener('click', () => {
      if (ctxNodeId !== null) { expandNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-collapse').addEventListener('click', () => {
      if (ctxNodeId !== null) { collapseNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-show-rels').addEventListener('click', () => {
      if (ctxNodeId !== null) { showAllRelationships(ctxNodeId); hideCtxMenu(); }
    });

    document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // ── Theme toggle ─────────────────────────────────────────────────
    const themeBtn = document.getElementById('theme-btn');
    const themeIconSun = document.getElementById('theme-icon-sun');
    const themeIconMoon = document.getElementById('theme-icon-moon');
    const themeLabel = document.getElementById('theme-label');

    function getVisThemeOptions() {
      const dark = document.documentElement.classList.contains('dark');
      return {
        nodes: { font: { color: dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)' } },
        edges: {
          color: {
            color: dark ? '#445060' : '#b0b8c4',
            highlight: dark ? '#4ea6e0' : '#57C7E3',
            hover: dark ? '#556070' : '#7a8898'
          },
          font: {
            color: dark ? '#c9d4e0' : '#6b7280',
            strokeWidth: dark ? 0 : 4,
            strokeColor: dark ? 'transparent' : '#ffffff'
          }
        }
      };
    }

    function applyTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        themeIconSun.style.display = 'none';
        themeIconMoon.style.display = '';
        themeLabel.textContent = 'Light';
      } else {
        document.documentElement.classList.remove('dark');
        themeIconSun.style.display = '';
        themeIconMoon.style.display = 'none';
        themeLabel.textContent = 'Dark';
      }
      network.setOptions(getVisThemeOptions());
      updateGraphVisuals();
      try { localStorage.setItem('ge-theme', dark ? 'dark' : 'light'); } catch { }
    }

    themeBtn.addEventListener('click', () => {
      applyTheme(!document.documentElement.classList.contains('dark'));
    });

    // Restore saved theme preference
    try {
      if (localStorage.getItem('ge-theme') === 'dark') applyTheme(true);
    } catch { }

    // ── Edges toggle ─────────────────────────────────────────────────
    const edgesBtn = document.getElementById('edges-btn');
    const edgesLabel = document.getElementById('edges-label');
    let edgesVisible = true;

    edgesBtn.addEventListener('click', () => {
      edgesVisible = !edgesVisible;
      // Use `hidden` property — single batch update, no DataSet rebuild, no re-layout
      edgesDS.update(allEdges.map(e => ({ id: e.id, hidden: !edgesVisible })));
      if (edgesVisible) {
        allEdges.forEach(e => visibleEdgeIds.add(e.id));
        edgesLabel.textContent = 'Hide relationships';
        edgesBtn.classList.remove('active');
      } else {
        visibleEdgeIds.clear();
        edgesLabel.textContent = 'Show relationships';
        edgesBtn.classList.add('active');
      }
      refreshExpansionStyles();
    });

    // ── Breadcrumb trail ──────────────────────────────────────────────
    const _breadcrumbs = []; // array of node IDs
    const breadcrumbEl = document.getElementById('breadcrumb-trail');

    function _breadcrumbPush(nodeId) {
      // Don't duplicate the last entry
      if (_breadcrumbs.length > 0 && _breadcrumbs[_breadcrumbs.length - 1] === nodeId) return;
      _breadcrumbs.push(nodeId);
      if (_breadcrumbs.length > 8) _breadcrumbs.shift(); // keep trail short
      _renderBreadcrumbs();
    }

    function _renderBreadcrumbs() {
      if (_breadcrumbs.length <= 1) { breadcrumbEl.innerHTML = ''; return; }
      breadcrumbEl.innerHTML = _breadcrumbs.map((nid, i) => {
        const n = nodesDS.get(nid) || nodeById.get(nid);
        const name = n ? (n.properties?.name || n.properties?.fqn || n.label || String(nid)) : String(nid);
        const shortName = name.length > 12 ? name.slice(0, 11) + '…' : name;
        const active = i === _breadcrumbs.length - 1 ? ' bc-active' : '';
        const sep = i < _breadcrumbs.length - 1 ? '<span class="bc-sep">›</span>' : '';
        return `<span class="bc-item${active}" data-bcid="${nid}" title="${name.replace(/"/g, '&quot;')}">${shortName}</span>${sep}`;
      }).join('');
    }

    breadcrumbEl.addEventListener('click', e => {
      const item = e.target.closest('.bc-item');
      if (!item) return;
      const nid = item.getAttribute('data-bcid');
      // Navigate to that node
      const idx = _breadcrumbs.indexOf(nid);
      if (idx >= 0) _breadcrumbs.length = idx + 1; // trim forward history
      focusNodeById(nid);
      _renderBreadcrumbs();
    });

    // ── Guided Tour (SQL-path walk-through) ───────────────────────────
    const _tourNodes = allNodes.filter(n => n._inSqlPath && (n.labels || [])[0] === 'Table').map(n => n.id);
    let _tourIdx = -1;
    let _tourAutoTimer = null;
    const tourBtn = document.getElementById('tour-btn');
    const tourBar = document.getElementById('tour-bar');
    const tourStep = document.getElementById('tour-step');

    // Show tour button only if there are SQL-path Table nodes
    if (_tourNodes.length > 1) tourBtn.style.display = '';

    function _tourGo(idx) {
      if (idx < 0 || idx >= _tourNodes.length) return;
      _tourIdx = idx;
      const nid = _tourNodes[idx];
      tourStep.textContent = `${idx + 1} / ${_tourNodes.length}`;
      focusNodeById(nid);
      _breadcrumbPush(nid);
    }

    function startTour() {
      tourBar.style.display = 'flex';
      tourBtn.classList.add('active');
      _tourGo(0);
    }

    function stopTour() {
      tourBar.style.display = 'none';
      tourBtn.classList.remove('active');
      _tourIdx = -1;
      if (_tourAutoTimer) { clearInterval(_tourAutoTimer); _tourAutoTimer = null; }
    }

    tourBtn.addEventListener('click', () => {
      if (_tourIdx >= 0) stopTour(); else startTour();
    });
    document.getElementById('tour-prev').addEventListener('click', () => {
      if (_tourIdx > 0) _tourGo(_tourIdx - 1);
    });
    document.getElementById('tour-next').addEventListener('click', () => {
      if (_tourIdx < _tourNodes.length - 1) _tourGo(_tourIdx + 1);
      else stopTour(); // end of tour
    });
    document.getElementById('tour-stop').addEventListener('click', stopTour);

    // ── Keyboard navigation ───────────────────────────────────────────
    let _kbIndex = -1; // index into visible nodes array
    let _kbNodeIds = []; // cache of visible node IDs

    function _refreshKbNodeIds() {
      _kbNodeIds = nodesDS.get({ filter: n => !n.hidden }).map(n => n.id);
    }

    document.addEventListener('keydown', e => {
      // Block DevTools shortcuts
      if (e.key === 'F12') { e.preventDefault(); return; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); return; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return; }

      // Don't intercept when typing in search
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'Tab') {
        e.preventDefault();
        _refreshKbNodeIds();
        if (_kbNodeIds.length === 0) return;
        _kbIndex = e.shiftKey
          ? (_kbIndex <= 0 ? _kbNodeIds.length - 1 : _kbIndex - 1)
          : (_kbIndex >= _kbNodeIds.length - 1 ? 0 : _kbIndex + 1);
        const nid = _kbNodeIds[_kbIndex];
        network.selectNodes([nid]);
        network.focus(nid, { scale: network.getScale(), animation: { duration: 250, easingFunction: 'easeOutQuad' } });
        const node = nodesDS.get(nid);
        if (node) { showDetail('node', node); _breadcrumbPush(nid); }
        if (!panelOpen) setPanelOpen(true);
        currentClickedNodeId = nid;
        buildOverview();
        updateGraphVisuals();
        return;
      }

      if (e.key === 'Enter' && currentClickedNodeId) {
        e.preventDefault();
        network.focus(currentClickedNodeId, { scale: 1.4, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
        return;
      }

      if (e.key === 'Escape') {
        network.unselectAll();
        currentClickedNodeId = null;
        _kbIndex = -1;
        showOverview();
        updateGraphVisuals();
        if (_tourIdx >= 0) stopTour();
        return;
      }

      // Arrow keys: navigate to connected neighbor
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && currentClickedNodeId) {
        e.preventDefault();
        const neighbors = network.getConnectedNodes(currentClickedNodeId);
        if (neighbors.length === 0) return;
        // Pick neighbor based on spatial direction
        const curPos = network.getPositions([currentClickedNodeId])[currentClickedNodeId];
        if (!curPos) return;
        let best = null, bestScore = -Infinity;
        neighbors.forEach(nid => {
          const n = nodesDS.get(nid);
          if (n && n.hidden) return;
          const p = network.getPositions([nid])[nid];
          if (!p) return;
          const dx = p.x - curPos.x, dy = p.y - curPos.y;
          let score = 0;
          if (e.key === 'ArrowRight') score = dx - Math.abs(dy) * 0.5;
          else if (e.key === 'ArrowLeft') score = -dx - Math.abs(dy) * 0.5;
          else if (e.key === 'ArrowDown') score = dy - Math.abs(dx) * 0.5;
          else if (e.key === 'ArrowUp') score = -dy - Math.abs(dx) * 0.5;
          if (score > bestScore) { bestScore = score; best = nid; }
        });
        if (best) {
          network.selectNodes([best]);
          network.focus(best, { scale: network.getScale(), animation: { duration: 250, easingFunction: 'easeOutQuad' } });
          const node = nodesDS.get(best);
          if (node) { showDetail('node', node); _breadcrumbPush(best); }
          currentClickedNodeId = best;
          buildOverview();
          updateGraphVisuals();
          _refreshKbNodeIds();
          _kbIndex = _kbNodeIds.indexOf(best);
        }
        return;
      }
    });
  </script>
</body>
