    /* ── Theme tokens ── */

      --ge-fg-body: #374151;
      --ge-fg-muted: #9ca3af;
      --ge-border: #e5e7eb;
      --ge-border-subtle: #f3f4f6;
      --ge-surface: #f9fafb;
      --ge-surface-2: #f3f4f6;
      --ge-primary-soft: #7c3aed;
      --ge-input-border: #d1d5db;
      --ge-copy-hover: #e5e7eb;
      --ge-copy-hover-fg: #374151;
      --ge-panel-shadow: rgba(0, 0, 0, 0.08);
      --ge-ctx-shadow: rgba(0, 0, 0, 0.13);
    }

    html.dark {
      --ge-bg: #1c1f23;
      --ge-fg: #e4e8ee;
      --ge-fg-heading: #e4e8ee;
      --ge-fg-body: #c9d4e0;
      --ge-fg-muted: #8a9bb0;
      --ge-border: #333c47;
      --ge-border-subtle: #2d3540;
      --ge-surface: #272c33;
      --ge-surface-2: #2c323b;
      --ge-primary-soft: #a78bfa;
      --ge-input-border: #445060;
      --ge-copy-hover: #333c47;
      --ge-copy-hover-fg: #e4e8ee;
      --ge-panel-shadow: rgba(0, 0, 0, 0.35);
      --ge-ctx-shadow: rgba(0, 0, 0, 0.5);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Alliance No.1', sans-serif;
      background: var(--ge-bg);
      color: var(--ge-fg);
    }

    #mynetwork {
      width: 100%;
      height: 100%;
      background: var(--ge-bg);
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--ge-bg);
      border-bottom: 1px solid var(--ge-border);
      flex-shrink: 0;
      box-shadow: 0 1px 3px var(--ge-panel-shadow);
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--ge-input-border);
      background: var(--ge-bg);
      font-size: 12px;
      font-weight: 600;
      color: var(--ge-fg-body);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .toolbar-btn:hover {
      background: var(--ge-surface);
      border-color: var(--ge-fg-muted);
    }

    .toolbar-btn:active {
      background: var(--ge-surface-2);
    }

    .toolbar-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toolbar-btn.active {
      background: var(--ge-surface-2);
      border-color: var(--ge-primary-soft);
      color: var(--ge-primary-soft);
    }

    #search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--ge-surface);
      border: 1px solid var(--ge-input-border);
      border-radius: 6px;
      padding: 4px 10px;
    }

    #search-input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 12px;
      color: var(--ge-fg-body);
      width: 160px;
    }

    #search-input::placeholder {
      color: var(--ge-fg-muted);
    }

    #search-clear {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ge-fg-muted);
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }

    /* ── Panel collapse ── */
    #panel-inner {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 480px;
      background: var(--ge-bg);
      border-left: 1px solid var(--ge-border);
      box-shadow: -4px 0 16px var(--ge-panel-shadow);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      z-index: 10;
      transition: transform 0.26s ease, opacity 0.2s ease;
    }

    #panel-inner.collapsed {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Floating pill button anchored to the left edge of the panel */
    #panel-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 22px;
      height: 48px;
      padding: 0;
      background: #ede9fe;
      border: 1px solid #c4b5fd;
      border-right: none;
      border-radius: 6px 0 0 6px;
      box-shadow: -3px 0 10px rgba(139, 92, 246, 0.18);
      cursor: pointer;
      color: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: right 0.26s ease, color 0.12s, background 0.12s;
    }

    #panel-toggle:hover {
      background: #ddd6fe;
      color: #6d28d9;
    }

    /* ── Node label badges ── */
    .label-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin: 3px 3px;
      color: rgba(0, 0, 0, 0.75);
      user-select: none;
      white-space: nowrap;
      line-height: 1.4;
    }

    .label-badge:hover {
      filter: brightness(0.9);
    }

    /* ── Rel type hexagon badges ── */
    .rel-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 22px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 3px;
      background: #c8c8c8;
      color: #222;
      user-select: none;
      white-space: nowrap;
      line-height: 1.4;
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
    }

    .rel-badge:hover {
      filter: brightness(0.88);
    }

    /* ── Properties table ── */
    .prop-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .prop-table thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--ge-fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--ge-border);
    }

    .prop-table thead th:last-child {
      width: 28px;
    }

    .prop-table tbody tr {
      border-bottom: 1px solid var(--ge-border-subtle);
    }

    .prop-table tbody tr:last-child {
      border-bottom: none;
    }

    .prop-table tbody tr:hover {
      background: var(--ge-surface);
    }

    .prop-table td {
      padding: 10px 8px;
      vertical-align: top;
      font-size: 13px;
    }

    .prop-key {
      font-weight: 700;
      color: var(--ge-fg-heading);
      width: 160px;
      min-width: 160px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .prop-value {
      color: var(--ge-fg-body);
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
      min-width: 0;
    }

    .show-all-btn {
      display: inline;
      margin-left: 4px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ge-primary-soft);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .show-all-btn:hover {
      text-decoration: underline;
    }

    .prop-copy-td {
      width: 28px;
      text-align: right;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: none;
      border: none;
      color: var(--ge-fg-muted);
      transition: opacity 0.1s, background 0.1s;
      flex-shrink: 0;
    }

    .prop-table tbody tr:hover .copy-btn {
      opacity: 0.6;
    }

    .copy-btn:hover {
      opacity: 1 !important;
      background: var(--ge-copy-hover);
      color: var(--ge-copy-hover-fg);
    }

    /* ── Detail panel badges ── */
    .detail-node-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.75);
      margin-bottom: 14px;
    }

    .detail-rel-badge {
      display: inline-block;
      padding: 5px 22px;
      font-size: 13px;
      font-weight: 700;
      color: #222;
      background: #c8c8c8;
      margin-bottom: 14px;
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
    }

    /* ── Panel header ── */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ge-border);
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ge-fg-heading);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: none;
      background: none;
      color: var(--ge-fg-muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--ge-surface-2);
      color: var(--ge-fg-body);
    }

    .ov-section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .ov-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ge-fg-body);
    }

    .ov-section-count {
      color: var(--ge-fg-muted);
      font-weight: 400;
    }

    /* ── Layout button spinner ── */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinning {
      animation: spin 0.7s linear infinite;
    }


    /* ── Right-click context menu ── */
    #ctx-menu {
      display: none;
      position: fixed;
      z-index: 2000;
      background: var(--ge-bg);
      border: 1px solid var(--ge-border);
      border-radius: 8px;
      box-shadow: 0 4px 24px var(--ge-ctx-shadow);
      min-width: 230px;
      overflow: hidden;
      padding: 4px 0;
    }

    .ctx-item {
      padding: 9px 16px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      color: var(--ge-fg-body);
      user-select: none;
    }

    .ctx-item:hover:not(.ctx-disabled) {
      background: var(--ge-surface-2);
    }

    .ctx-item.ctx-disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .ctx-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--ge-fg-muted);
      margin-top: 1px;
    }

    .ctx-label {
      font-weight: 600;
      line-height: 1.3;
    }

    .ctx-sub {
      font-size: 11px;
      color: var(--ge-fg-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    .ctx-sep {
      border: none;
      border-top: 1px solid var(--ge-border-subtle);
      margin: 3px 0;
    }
  </style>
</head>

    const sqlPathString = "WITH fx_anchor AS (\n  SELECT\n    LEAST(\n      CURRENT_DATE,\n      (\n        SELECT\n          CAST(MAX(f0.rate_date) AS DATE)\n        FROM lpp.fx_rate AS f0\n        WHERE\n          f0.quote_currency = 'USD'\n      )\n    ) AS ref\n), fx_latest AS (\n  SELECT\n    f.base_currency,\n    AVG(f.rate) AS rate\n  FROM lpp.fx_rate AS f\n  CROSS JOIN fx_anchor\n  WHERE\n    f.quote_currency = 'USD'\n    AND f.rate_date = (\n      SELECT\n        MAX(f2.rate_date)\n      FROM lpp.fx_rate AS f2\n      WHERE\n        f2.base_currency = f.base_currency\n        AND f2.quote_currency = 'USD'\n        AND f2.rate_date <= fx_anchor.ref\n        AND f2.rate_date >= DATEADD(DAY, -14, fx_anchor.ref)\n    )\n  GROUP BY\n    f.base_currency\n), base_data AS (\n  SELECT\n    api.currency_code,\n    api.open_amount\n  FROM lpp.ap_invoice AS api\n  WHERE\n    api.payment_terms = 'NET_30'\n    AND api.status = 'OPEN'\n    AND NOT api.currency_code IS NULL\n), converted AS (\n  SELECT\n    bd.open_amount * fx.rate AS open_amount_usd\n  FROM base_data AS bd\n  JOIN fx_latest AS fx\n    ON fx.base_currency = bd.currency_code\n), final_aggregation AS (\n  SELECT\n    SUM(c.open_amount_usd) AS total_open_balance_usd,\n    SUM(c.open_amount_usd) AS cash_freed_up_usd,\n    SUM(c.open_amount_usd) * 60.0 / 365.0 AS working_capital_benefit_usd,\n    60 AS dpo_improvement_days\n  FROM converted AS c\n)\nSELECT\n  fa.total_open_balance_usd,\n  fa.working_capital_benefit_usd,\n  fa.cash_freed_up_usd,\n  fa.dpo_improvement_days\nFROM final_aggregation AS fa\nLIMIT 100";

      icon.classList.add('spinning');

      if (_homePositions) {
        nodesDS.update(Array.from(_homePositions.entries()).map(([id, pos]) => ({ id, x: pos.x, y: pos.y, fixed: false })));
        network.fit({ animation: { duration: 300, easingFunction: 'easeOutQuad' } });
        _runPhysics(1000);
        setTimeout(() => { btn.disabled = false; icon.classList.remove('spinning'); }, 1000);
      } else {
        const allIds = nodesDS.getIds();
        const spread = Math.max(600, allIds.length * 60);
        nodesDS.update(allIds.map(id => ({
          id,
          x: (Math.random() - 0.5) * spread,
          y: (Math.random() - 0.5) * spread,
          fixed: false
        })));
        _runPhysics(3000);
        setTimeout(() => {
          network.fit({ animation: { duration: 500, easingFunction: 'easeOutQuad' } });
          btn.disabled = false;
          icon.classList.remove('spinning');
        }, 3000);
      }
    }

    // Initial load
    network.fit({ animation: false });
    if (_hasPrecomputedLayout) {
      // Nodes are already at server-computed positions — no physics needed on load.
      // Physics fires only on dragEnd / expand / collapse (wired below).
    } else {
      runAutoLayout();
    }

    // ── Drag-end physics — spring reaction when user releases a node ──────────
    network.on('dragEnd', function (params) {
      if (params.nodes.length > 0) {
        _runPhysics(3500);
      }
    });

    // ── Panel refs ───────────────────────────────────────────────────
    const overviewContent = document.getElementById('overviewContent');
    const detailContent = document.getElementById('detailContent');
    const detailTitle = document.getElementById('detailTitle');
    const detailBody = document.getElementById('detailBody');
    const overviewStats = document.getElementById('overviewStats');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const panelInner = document.getElementById('panel-inner');
    const toggleChevron = document.getElementById('toggle-chevron');

    // ── Panel toggle (default: collapsed) ───────────────────────────
    let panelOpen = false;   // start collapsed
    let _ovSortAlpha = false; // false = sort by count desc, true = sort A-Z

    const panelToggleBtn = document.getElementById('panel-toggle');
    function setPanelOpen(open) {
      panelOpen = open;
      if (open) {
        panelInner.classList.remove('collapsed');
        panelToggleBtn.style.right = '480px';
        toggleChevron.setAttribute('points', '9 18 15 12 9 6'); // ‹ close
      } else {
        panelInner.classList.add('collapsed');
        panelToggleBtn.style.right = '0px';
        toggleChevron.setAttribute('points', '15 18 9 12 15 6'); // › open
      }
    }
    panelToggleBtn.addEventListener('click', () => setPanelOpen(!panelOpen));

    // ── Helpers ──────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(String(text)).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        btn.style.opacity = '1';
        setTimeout(() => { btn.innerHTML = orig; btn.style.opacity = ''; }, 1400);
      });
    }

    // ── Properties table ─────────────────────────────────────────────
    function buildPropsTable(neo4jId, properties) {
      const rows = [{ key: '<id>', value: String(neo4jId) }];
      Object.keys(properties).sort().forEach(k => {
        const v = properties[k];
        rows.push({ key: k, value: Array.isArray(v) ? JSON.stringify(v) : String(v) });
      });
      let html = '<table class="prop-table"><thead><tr><th>Key</th><th>Value</th><th></th></tr></thead><tbody>';
      rows.forEach(({ key, value }) => {
        if (!window._saCtr) window._saCtr = 0;
        let valueHtml;
        if (value.length > 180) {
          const uid = 'sa' + (++window._saCtr);
          valueHtml = '<span id="' + uid + '-s">' + escHtml(value.slice(0, 180)) + '\u2026<button class="show-all-btn" data-sa="' + uid + '" data-role="short">Show all</button></span>'
            + '<span id="' + uid + '-f" style="display:none">' + escHtml(value) + '<button class="show-all-btn" data-sa="' + uid + '" data-role="full">Show less</button></span>';
        } else {
          valueHtml = escHtml(value);
        }
        html += `<tr>
          <td class="prop-key">${escHtml(key)}</td>
          <td class="prop-value">${valueHtml}</td>
          <td class="prop-copy-td">
            <button class="copy-btn" data-copykey="${escHtml(key)}" data-copyval="${escHtml(value)}" title="Copy">
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
              </svg>
            </button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    // ── Centralized filtering state ───────────────────────────────────
    let currentSearchQuery = '';
    let currentSelectedCategory = '*';
    let currentSelectedRelType = '*';
    let currentClickedNodeId = null;

    // ── Overview ──────────────────────────────────────────────────────
    function buildOverview() {
      const labelCounts = {}, relTypeCounts = {};
      rawData.nodes.forEach(n => {
        (n.labels || ['Node']).forEach(l => { labelCounts[l] = (labelCounts[l] || 0) + 1; });
      });
      rawData.edges.forEach(e => {
        const t = e.type || 'UNKNOWN';
        relTypeCounts[t] = (relTypeCounts[t] || 0) + 1;
      });
      const totalNodes = rawData.nodes.length;
      const totalEdges = rawData.edges.length;

      // Helper to determine styling for a node label badge
      function getBadgeStyle(label, bgColor) {
        const isActive = (currentSelectedCategory === label);
        const isAnyActive = (currentSelectedCategory !== '*');
        let style = `background:${bgColor}; cursor:pointer; transition: all 0.15s ease;`;
        if (isActive) {
          style += `outline: 3px solid #7c3aed; outline-offset: 1px; opacity: 1; transform: scale(1.04); font-weight: 700;`;
        } else if (isAnyActive) {
          style += `opacity: 0.45;`;
        } else {
          style += `opacity: 1;`;
        }
        return style;
      }

      // Helper to determine styling for a relationship badge
      function getRelBadgeStyle(type, bgColor) {
        const isActive = (currentSelectedRelType === type);
        const isAnyActive = (currentSelectedRelType !== '*');
        let style = `background:${bgColor}; cursor:pointer; transition: all 0.15s ease;`;
        if (isActive) {
          style += `outline: 3px solid #7c3aed; outline-offset: 1px; opacity: 1; transform: scale(1.04); font-weight: 700;`;
        } else if (isAnyActive) {
          style += `opacity: 0.45;`;
        } else {
          style += `opacity: 1;`;
        }
        return style;
      }

      let html = `
        <div class="ov-section-row">
          <span class="ov-section-title">Nodes <span class="ov-section-count">(${totalNodes})</span></span>
          <button class="icon-btn" data-action="sort-overview" title="Toggle sort order"
            style="width:auto;padding:0 7px;gap:4px;display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--ge-fg-muted);border:1px solid var(--ge-border);border-radius:5px;height:22px;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
            ${_ovSortAlpha ? 'A \u2192 Z' : 'Count'}
          </button>
        </div>
        <div style="display:flex;flex-wrap:wrap;margin-bottom:18px;">
          <span class="label-badge" data-label="*" style="${getBadgeStyle('*', '#c8b9e0')}">* (${totalNodes})</span>`;
      const sortedLabels = Object.entries(labelCounts)
        .sort(_ovSortAlpha ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => b[1] - a[1]);
      sortedLabels.forEach(([label, count]) => {
        html += `<span class="label-badge" data-label="${escHtml(label)}" style="${getBadgeStyle(label, getLabelColor(label))}">${escHtml(label)} (${count})</span>`;
      });
      html += `</div>
        <div class="ov-section-row">
          <span class="ov-section-title">Relationships <span class="ov-section-count">(${totalEdges})</span></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;">
          <span class="rel-badge" data-reltype="*" style="${getRelBadgeStyle('*', '#b8b8b8')}">* (${totalEdges})</span>`;
      Object.entries(relTypeCounts).forEach(([type, count]) => {
        html += `<span class="rel-badge" data-reltype="${escHtml(type)}" style="${getRelBadgeStyle(type, '#c8c8c8')}">${escHtml(type)} (${count})</span>`;
      });
      html += '</div>';
      overviewStats.innerHTML = html;
    }

    function showOverview() {
      overviewContent.classList.remove('hidden');
      detailContent.classList.add('hidden');
    }

    let _currentDetailData = null;

    // ── Detail panel helpers ──────────────────────────────────────────

    function _statusBadge(props) {
      if (props._in_sql_path)    return `<span class="detail-node-badge" style="background:#f59e0b;color:#000;margin-left:4px;">In SQL</span>`;
      if (props._retrieved_only) return `<span class="detail-node-badge" style="background:#6b7280;color:#fff;margin-left:4px;">Fetched</span>`;
      return `<span class="detail-node-badge" style="background:#3b82f6;color:#fff;margin-left:4px;">Used</span>`;
    }

    function buildTableDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const meta = [];
      if (props.domain)     meta.push(`<span style="font-size:13px;background:var(--ge-bg-2);padding:2px 6px;border-radius:4px;">📁 ${escHtml(props.domain)}</span>`);
      if (props.row_count)  meta.push(`<span style="font-size:13px;color:var(--ge-fg-dim);">${Number(props.row_count).toLocaleString()} rows</span>`);
      if (node._feedbackNegative) meta.push(`<span style="font-size:13px;background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;">⚠ Negative feedback</span>`);
      if (node._feedbackPositive) meta.push(`<span style="font-size:13px;background:#14532d;color:#86efac;padding:2px 6px;border-radius:4px;">✓ Trusted</span>`);
      if (meta.length) h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${meta.join('')}</div>`;

      const measures = [], dimensions = [], filters = [], others = [];
      allEdges.filter(e => e.type === 'HAS_COLUMN' && e.from === node.id).forEach(e => {
        const col = nodeById.get(e.to);
        if (!col) return;
        const role = (col.properties || {}).role || '';
        const entry = { id: e.to, name: col.properties.name, role, agg: col.properties.aggregation };
        if (role === 'measure')                       measures.push(entry);
        else if (role === 'dimension')                dimensions.push(entry);
        else if (role === 'filter' || role === 'time_filter') filters.push(entry);
        else                                          others.push(entry);
      });

      function colGroup(label, items, color) {
        if (!items.length) return '';
        return `<div style="margin-bottom:8px;"><div style="font-size:13px;font-weight:600;text-transform:uppercase;color:${color};margin-bottom:4px;">${label}</div>` +
          items.map(c =>
            `<div style="font-size:14px;color:var(--ge-fg);padding:3px 2px;cursor:pointer;border-radius:3px;"
                  onclick="focusNodeById(${c.id})"
                  onmouseover="this.style.background='var(--ge-surface-2)'"
                  onmouseout="this.style.background=''"
                  title="Click to highlight in graph">
              ${escHtml(c.name)}${c.agg ? ` <span style="color:var(--ge-fg-dim);font-size:12px;">(${escHtml(c.agg)})</span>` : ''}
            </div>`
          ).join('') + '</div>';
      }
      const cols = colGroup('Measures', measures, '#f59e0b') + colGroup('Dimensions', dimensions, '#3b82f6') +
                   colGroup('Filters', filters, '#8b5cf6') + colGroup('Columns', others, '#6b7280');
      if (cols) h += `<div style="border-top:1px solid var(--ge-border);padding-top:8px;">${cols}</div>`;
      return h;
    }

    function buildColumnDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const roleColor = { measure:'#f59e0b', dimension:'#3b82f6', filter:'#8b5cf6', time_filter:'#10b981' };
      const bdg = [];
      if (props.data_type)   bdg.push(`<span style="font-size:13px;background:#1e3a5f;color:#60a5fa;padding:2px 6px;border-radius:4px;">${escHtml(props.data_type)}</span>`);
      if (props.role)        bdg.push(`<span style="font-size:13px;background:${roleColor[props.role]||'#6b7280'};color:#fff;padding:2px 6px;border-radius:4px;">${escHtml(props.role)}</span>`);
      if (props.aggregation) bdg.push(`<span style="font-size:13px;background:var(--ge-bg-2);padding:2px 6px;border-radius:4px;">${escHtml(props.aggregation)}</span>`);
      if (props.nullable === false || props.nullable === 'false') bdg.push(`<span style="font-size:13px;background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;">NOT NULL</span>`);
      if (bdg.length) h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${bdg.join('')}</div>`;
      const parentEdge = allEdges.find(e => e.type === 'HAS_COLUMN' && e.to === node.id);
      if (parentEdge) {
        const tbl = nodeById.get(parentEdge.from);
        if (tbl) h += `<div style="font-size:14px;color:var(--ge-fg-dim);">Table: <strong onclick="focusNodeById(${tbl.id})" style="cursor:pointer;text-decoration:underline dotted;" title="Click to highlight table in graph">${escHtml(tbl.properties.fqn || tbl.properties.name)}</strong></div>`;
      }
      return h;
    }

    function buildDomainDetail(node, props) {
      let h = '';
      if (props.description) h += `<p style="font-size:14px;color:var(--ge-fg);margin:0 0 10px;line-height:1.6;">${escHtml(props.description)}</p>`;
      const tables = allEdges.filter(e => e.type === 'BELONGS_TO' && e.to === node.id);
      if (tables.length) {
        h += `<div style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--ge-fg-dim);margin-bottom:5px;">${tables.length} Tables</div>`;
        tables.forEach(e => {
          const t = nodeById.get(e.from);
          if (t) h += `<div style="font-size:14px;color:var(--ge-fg);padding:2px 2px;cursor:pointer;border-radius:3px;"
                            onclick="focusNodeById(${t.id})"
                            onmouseover="this.style.background='var(--ge-surface-2)'"
                            onmouseout="this.style.background=''"
                            title="Click to highlight in graph">
            ${escHtml(t.properties.fqn || t.properties.name)}
          </div>`;
        });
      }
      return h;
    }

    function buildJoinDetail(edge, props) {
      let h = '';
      const from = nodeById.get(edge.from), to = nodeById.get(edge.to);
      if (from && to) h += `<div style="font-size:14px;margin-bottom:8px;"><strong>${escHtml(from.properties.name||from.properties.fqn)}</strong><span style="color:var(--ge-fg-dim);"> → </span><strong>${escHtml(to.properties.name||to.properties.fqn)}</strong></div>`;
      if (props.join_clause) h += `<div style="font-size:13px;font-family:monospace;background:var(--ge-bg-2);padding:6px 8px;border-radius:4px;margin-bottom:8px;word-break:break-all;">${escHtml(props.join_clause)}</div>`;
      const conf = props.confidence || props.join_type || '';
      if (conf) { const cc = conf==='fk'?'#22c55e':conf==='inferred'?'#f59e0b':'#6b7280'; h += `<span style="font-size:13px;background:${cc};color:#fff;padding:2px 6px;border-radius:4px;">${escHtml(conf)}</span>`; }
      if (props.fan_out_risk) h += ` <span style="font-size:13px;background:#ef4444;color:#fff;padding:2px 6px;border-radius:4px;">⚠ Fan-out risk</span>`;
      return h || buildPropsTable(edge.neo4jId, props);
    }

    function buildAskQuestion(label, props) {
      const name = props.name || props.fqn || '';
      if (!name) return null;
      if (label === 'Table')  return `What data is available in the ${name} table and what business questions can I ask about it?`;
      if (label === 'Column') return `Tell me about the ${name} column — what does it measure and how is it used in analysis?`;
      if (label === 'Domain') return `What business questions can I answer using the ${name} domain?`;
      return null;
    }

    function copyAskQuestion(question) {
      function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4);';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(question).then(() => showToast('Copied \u2014 paste in chat')).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = question; ta.style.cssText = 'position:fixed;left:-9999px;';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Copied \u2014 paste in chat');
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = question; ta.style.cssText = 'position:fixed;left:-9999px;';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied \u2014 paste in chat');
      }
    }

    // Event delegation for Ask button (avoids inline onclick attribute escaping issues)
    document.getElementById('panel-inner').addEventListener('click', function(e) {
      const btn = e.target.closest('.ask-about-btn');
      if (btn) copyAskQuestion(btn.getAttribute('data-question'));
    });

    function showDetail(elementType, data) {
      _currentDetailData = { elementType, data };
      overviewContent.classList.add('hidden');
      detailContent.classList.remove('hidden');

      if (elementType === 'node') {
        const primaryLabel = (data.labels && data.labels[0]) || 'Node';
        const color = getLabelColor(primaryLabel);
        const props = data.properties || {};
        detailTitle.textContent = props.name || props.fqn || primaryLabel;

        let html = `<span class="detail-node-badge" style="background:${color};">${escHtml(primaryLabel)}</span>` + _statusBadge(props);
        html += `<hr style="border:none;border-top:1px solid var(--ge-border);margin:8px 0 12px;"/>`;

        if (primaryLabel === 'Table')       html += buildTableDetail(data, props);
        else if (primaryLabel === 'Column') html += buildColumnDetail(data, props);
        else if (primaryLabel === 'Domain') html += buildDomainDetail(data, props);
        else                                html += buildPropsTable(data.neo4jId, props);

        detailBody.innerHTML = html;
      } else {
        detailTitle.textContent = 'Relationship';
        const relType = data.type || data.label || 'RELATIONSHIP';
        const props = data.properties || {};
        let html = `<span class="detail-rel-badge">${escHtml(relType)}</span>`;
        html += `<hr style="border:none;border-top:1px solid var(--ge-border);margin:8px 0 12px;"/>`;
        if (relType === 'JOINS_TO' || relType === 'HAS_JOIN_PATH') html += buildJoinDetail(data, props);
        else html += buildPropsTable(data.neo4jId, props);
        detailBody.innerHTML = html;
      }
    }

    function focusNodeById(id) {
      const node = nodesDS.get(id);
      if (!node) return;
      // Reveal node if hidden (e.g. non-semantic-model column)
      if (node.hidden) {
        nodesDS.update({ id: id, hidden: false });
        // Also reveal edges connecting to this node
        const edgeIds = edgesByNode.get(id) || [];
        edgeIds.forEach(eid => {
          visibleEdgeIds.add(eid);
          edgesDS.update({ id: eid, hidden: false });
        });
      }
      showDetail('node', node);
      currentClickedNodeId = id;
      currentSelectedCategory = '*';
      currentSelectedRelType  = '*';
      buildOverview();
      updateGraphVisuals();
      network.focus(id, { scale: 1.4, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    }

    // ── Copy-all ─────────────────────────────────────────────────────
    copyAllBtn.addEventListener('click', () => {
      if (!_currentDetailData) return;
      const { elementType, data } = _currentDetailData;
      const obj = { id: data.neo4jId, ...data.properties };
      if (elementType === 'edge') obj.type = data.type;
      navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => {
        const orig = copyAllBtn.innerHTML;
        copyAllBtn.innerHTML = '<svg width="14" height="14" fill="none" stroke="#10b981" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => { copyAllBtn.innerHTML = orig; }, 1400);
      });
    });

    // Row copy via delegation — copies as { "key": value } JSON
    document.getElementById('panel-inner').addEventListener('click', e => {
      // Show all / Show less toggle
      const saBtn = e.target.closest('.show-all-btn');
      if (saBtn) {
        e.stopPropagation();
        const uid = saBtn.getAttribute('data-sa');
        const role = saBtn.getAttribute('data-role');
        const sEl = document.getElementById(uid + '-s');
        const fEl = document.getElementById(uid + '-f');
        if (role === 'short') { sEl.style.display = 'none'; fEl.style.display = 'inline'; }
        else { fEl.style.display = 'none'; sEl.style.display = 'inline'; }
        return;
      }
      const btn = e.target.closest('.copy-btn');
      if (btn) {
        e.stopPropagation();
        const k = btn.getAttribute('data-copykey');
        const v = btn.getAttribute('data-copyval');
        let parsed; try { parsed = JSON.parse(v); } catch { parsed = v; }
        copyText(JSON.stringify({ [k]: parsed }, null, 2), btn);
      }
    });

    // ── Network click handlers ────────────────────────────────────────
    network.on('click', params => {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = nodesDS.get(nodeId);
        if (node) showDetail('node', node);
        currentClickedNodeId = nodeId;
        currentSelectedCategory = '*';
        currentSelectedRelType = '*';
        buildOverview();
        updateGraphVisuals();
      } else if (params.edges.length > 0) {
        const edgeId = params.edges[0];
        const edge = edgesDS.get(edgeId);
        if (edge) showDetail('edge', edge);
        currentClickedNodeId = null;
        updateGraphVisuals();
      } else {
        showOverview();
        currentClickedNodeId = null;
        updateGraphVisuals();
      }
    });
    network.on('doubleClick', params => {
      if (params.nodes.length > 0) {
        // Expand hidden neighbors of the double-clicked node
        expandNode(params.nodes[0]);
      } else if (params.edges.length > 0) {
        const edge = edgesDS.get(params.edges[0]);
        if (edge) showDetail('edge', edge);
      }
    });

    // ── Fuse.js fuzzy search index ───────────────────────────────────
    // Normalize underscores → spaces so "cash_flow" matches "cash flow"
    const fuseItems = allNodes.map(n => ({
      id: n.id,
      label: n.label || '',
      labelNorm: (n.label || '').replace(/_/g, ' '),      // cash_flow → "cash flow"
      labelStripped: (n.label || '').replace(/[_\s]/g, '')    // cash_flow → "cashflow"
    }));
    const fuse = new Fuse(fuseItems, {
      keys: ['label', 'labelNorm', 'labelStripped'],
      threshold: 0.45,
      ignoreLocation: true,
      minMatchCharLength: 1,
      includeScore: true
    });

    // ── Search & Visual Filter Updates ─────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');

    searchInput.addEventListener('input', e => {
      currentSearchQuery = e.target.value.trim();
      searchClear.style.display = currentSearchQuery ? 'inline' : 'none';
      currentSelectedCategory = '*';
      currentSelectedRelType = '*';
      currentClickedNodeId = null;
      buildOverview();
      updateGraphVisuals();
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      currentSearchQuery = '';
      buildOverview();
      updateGraphVisuals();
    });

    function updateGraphVisuals() {
      let matchedNodeIds = null;
      let matchedEdgeIds = null;

      const hasCategoryFilter = (currentSelectedCategory !== '*');
      const hasRelFilter = (currentSelectedRelType !== '*');
      const hasClickedNode = (currentClickedNodeId !== null);
      const hasSearch = (!!currentSearchQuery);

      if (hasClickedNode) {
        // Highlight clicked node + its neighbors
        matchedNodeIds = new Set();
        matchedNodeIds.add(currentClickedNodeId);
        
        const neighbors = network.getConnectedNodes(currentClickedNodeId);
        neighbors.forEach(id => matchedNodeIds.add(id));

        // Highlight visible edges connecting this node to neighbors
        matchedEdgeIds = new Set();
        allEdges.forEach(e => {
          if ((e.from === currentClickedNodeId && matchedNodeIds.has(e.to)) ||
              (e.to === currentClickedNodeId && matchedNodeIds.has(e.from))) {
            if (visibleEdgeIds.has(e.id)) {
              matchedEdgeIds.add(e.id);
            }
          }
        });
      } else if (hasCategoryFilter || hasRelFilter) {
        // Cumulative highlighting for sidebar filters
        matchedNodeIds = new Set();
        matchedEdgeIds = new Set();

        if (hasCategoryFilter) {
          allNodes.forEach(n => {
            const labels = n.labels || ['Node'];
            if (labels.includes(currentSelectedCategory)) {
              matchedNodeIds.add(n.id);
            }
          });
          // Include edges connecting nodes of the selected category
          allEdges.forEach(e => {
            if (matchedNodeIds.has(e.from) && matchedNodeIds.has(e.to)) {
              if (visibleEdgeIds.has(e.id)) {
                matchedEdgeIds.add(e.id);
              }
            }
          });
        }

        if (hasRelFilter) {
          allEdges.forEach(e => {
            if (e.type === currentSelectedRelType) {
              matchedEdgeIds.add(e.id);
              matchedNodeIds.add(e.from);
              matchedNodeIds.add(e.to);
            }
          });
        }
      } else if (hasSearch) {
        // Highlight fuzzy search match nodes
        const qNorm = currentSearchQuery.replace(/_/g, ' ');
        const results = fuse.search(qNorm);
        matchedNodeIds = new Set(results.map(r => r.item.id));

        // Highlight edges where both endpoints match
        matchedEdgeIds = new Set();
        allEdges.forEach(e => {
          if (matchedNodeIds.has(e.from) && matchedNodeIds.has(e.to)) {
            if (visibleEdgeIds.has(e.id)) {
              matchedEdgeIds.add(e.id);
            }
          }
        });
      }

      // ── Apply Node updates ──────────────────────────
      const dark = document.documentElement.classList.contains('dark');
      const dimmedBg = dark ? '#3a4250' : '#c8cdd5';
      const dimmedBorder = dark ? '#4a5568' : '#9ca3af';
      const dimmedText = dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';

      const nodeUpdates = nodesDS.get().map(n => {
        const hasHidden = hasHiddenEdges(n.id);
        const baseColor = origColors[n.id];
        const expandColor = hasHidden ? {
          ...baseColor, border: EXPAND_BORDER,
          highlight: { background: baseColor.background, border: EXPAND_BORDER },
          hover:     { background: baseColor.background, border: '#7c3aed' }
        } : baseColor;

        if (matchedNodeIds === null) {
          // No active filter, reset to normal
          return {
            id: n.id, opacity: 1, color: expandColor,
            borderWidth: hasHidden ? 3 : 2,
            shapeProperties: hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
            font: { color: dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)' },
            shadow: { enabled: false }
          };
        }

        const isMatch = matchedNodeIds.has(n.id);
        return {
          id: n.id,
          color: isMatch ? expandColor : {
            background: dimmedBg,
            border: dimmedBorder,
            highlight: { background: dimmedBg, border: dimmedBorder },
            hover: { background: dimmedBg, border: dimmedBorder }
          },
          borderWidth: isMatch && hasHidden ? 3 : 2,
          shapeProperties: isMatch && hasHidden ? { borderDashes: [6, 3] } : { borderDashes: false },
          shadow: { enabled: false },
          font: { color: isMatch ? (dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)') : dimmedText },
          opacity: isMatch ? 1 : 0.55
        };
      });
      nodesDS.update(nodeUpdates);

      // ── Apply Edge updates ──────────────────────────
      const normalEdgeColor = dark ? '#445060' : '#b0b8c4';
      const dimmedEdgeColor = dark ? '#3a4250' : '#c0c7d0';

      const edgeUpdates = edgesDS.get().map(e => {
        let isHidden = !edgesVisible || !visibleEdgeIds.has(e.id);
        const isMatch = (matchedEdgeIds !== null && matchedEdgeIds.has(e.id));
        
        // Force visible if it matches the active relationship filter type
        if (isMatch && hasRelFilter && e.type === currentSelectedRelType) {
          isHidden = false;
        }

        if (matchedEdgeIds === null) {
          return {
            id: e.id,
            hidden: isHidden,
            color: { color: normalEdgeColor }
          };
        }

        return {
          id: e.id,
          hidden: isHidden,
          color: {
            color: isMatch ? normalEdgeColor : dimmedEdgeColor
          }
        };
      });
      edgesDS.update(edgeUpdates);
    }

    // ── Fit ──────────────────────────────────────────────────────────
    document.getElementById('fit-btn').addEventListener('click', () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeOutQuad' } });
    });

    // ── Auto Layout (scatter → physics stabilization) ─────────────────
    document.getElementById('layout-btn').addEventListener('click', () => {
      runAutoLayout();
    });

    // ── Init ─────────────────────────────────────────────────────────
    // Sort button delegation (survives innerHTML re-renders)
    overviewStats.addEventListener('click', e => {
      if (e.target.closest('[data-action="sort-overview"]')) {
        _ovSortAlpha = !_ovSortAlpha;
        buildOverview();
        return;
      }

      // Handle Node Category Badge clicks
      const labelBadge = e.target.closest('.label-badge');
      if (labelBadge) {
        const label = labelBadge.getAttribute('data-label');
        if (label) {
          if (currentSelectedCategory === label) {
            currentSelectedCategory = '*';
          } else {
            currentSelectedCategory = label;
          }
          currentClickedNodeId = null;
          searchInput.value = '';
          searchClear.style.display = 'none';
          currentSearchQuery = '';
          buildOverview();
          updateGraphVisuals();
          return;
        }
      }

      // Handle Relationship Type Badge clicks
      const relBadge = e.target.closest('.rel-badge');
      if (relBadge) {
        const type = relBadge.getAttribute('data-reltype');
        if (type) {
          if (currentSelectedRelType === type) {
            currentSelectedRelType = '*';
          } else {
            currentSelectedRelType = type;
          }
          currentClickedNodeId = null;
          searchInput.value = '';
          searchClear.style.display = 'none';
          currentSearchQuery = '';
          buildOverview();
          updateGraphVisuals();
          return;
        }
      }
    });
    buildOverview();
    showOverview();
    // Default: panel collapsed, button at far right, chevron points right (= "open")
    toggleChevron.setAttribute('points', '15 18 9 12 15 6');
    document.getElementById('panel-toggle').style.right = '0px';

    // ── Right-click context menu ─────────────────────────────────────────
    let ctxNodeId = null;
    const ctxMenu = document.getElementById('ctx-menu');

    function showCtxMenu(nodeId, x, y) {
      ctxNodeId = nodeId;
      const canExpand = hasHiddenEdges(nodeId);
      const visEdgesCnt = allEdges.filter(e => (e.from === nodeId || e.to === nodeId) && visibleEdgeIds.has(e.id)).length;
      const canCollapse = visEdgesCnt > 0;
      const totalRels = allEdges.filter(e => e.from === nodeId || e.to === nodeId).length;

      document.getElementById('ctx-expand').classList.toggle('ctx-disabled', !canExpand);
      document.getElementById('ctx-collapse').classList.toggle('ctx-disabled', !canCollapse);
      document.getElementById('ctx-collapse-sub').textContent = canCollapse
        ? `Hide ${visEdgesCnt} visible connection(s)`
        : 'No visible connections to hide';
      document.getElementById('ctx-rels-sub').textContent = `${totalRels} total relationship(s)`;

      ctxMenu.style.display = 'block';
      const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      ctxMenu.style.left = (x + mw > vw ? x - mw : x) + 'px';
      ctxMenu.style.top = (y + mh > vh ? y - mh : y) + 'px';
    }

    function hideCtxMenu() { ctxMenu.style.display = 'none'; ctxNodeId = null; }

    network.on('oncontext', params => {
      params.event.preventDefault();
      const nodeId = network.getNodeAt(params.pointer.DOM);
      if (nodeId === undefined) { hideCtxMenu(); return; }
      showCtxMenu(nodeId, params.event.clientX, params.event.clientY);
    });

    document.getElementById('ctx-expand').addEventListener('click', () => {
      if (ctxNodeId !== null) { expandNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-collapse').addEventListener('click', () => {
      if (ctxNodeId !== null) { collapseNode(ctxNodeId); hideCtxMenu(); }
    });
    document.getElementById('ctx-show-rels').addEventListener('click', () => {
      if (ctxNodeId !== null) { showAllRelationships(ctxNodeId); hideCtxMenu(); }
    });

    document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // ── Theme toggle ─────────────────────────────────────────────────
    const themeBtn = document.getElementById('theme-btn');
    const themeIconSun = document.getElementById('theme-icon-sun');
    const themeIconMoon = document.getElementById('theme-icon-moon');
    const themeLabel = document.getElementById('theme-label');

    function getVisThemeOptions() {
      const dark = document.documentElement.classList.contains('dark');
      return {
        nodes: { font: { color: dark ? 'rgba(255,255,255,0.82)' : 'rgba(0,0,0,0.82)' } },
        edges: {
          color: {
            color: dark ? '#445060' : '#b0b8c4',
            highlight: dark ? '#4ea6e0' : '#57C7E3',
            hover: dark ? '#556070' : '#7a8898'
          },
          font: {
            color: dark ? '#c9d4e0' : '#6b7280',
            strokeWidth: dark ? 0 : 4,
            strokeColor: dark ? 'transparent' : '#ffffff'
          }
        }
      };
    }

    function applyTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        themeIconSun.style.display = 'none';
        themeIconMoon.style.display = '';
        themeLabel.textContent = 'Light';
      } else {
        document.documentElement.classList.remove('dark');
        themeIconSun.style.display = '';
        themeIconMoon.style.display = 'none';
        themeLabel.textContent = 'Dark';
      }
      network.setOptions(getVisThemeOptions());
      updateGraphVisuals();
      try { localStorage.setItem('ge-theme', dark ? 'dark' : 'light'); } catch { }
    }

    themeBtn.addEventListener('click', () => {
      applyTheme(!document.documentElement.classList.contains('dark'));
    });

    // Restore saved theme preference
    try {
      if (localStorage.getItem('ge-theme') === 'dark') applyTheme(true);
    } catch { }

    // ── Edges toggle ─────────────────────────────────────────────────
    const edgesBtn = document.getElementById('edges-btn');
    const edgesLabel = document.getElementById('edges-label');
    let edgesVisible = true;

    edgesBtn.addEventListener('click', () => {
      edgesVisible = !edgesVisible;
      // Use `hidden` property — single batch update, no DataSet rebuild, no re-layout
      edgesDS.update(allEdges.map(e => ({ id: e.id, hidden: !edgesVisible })));
      if (edgesVisible) {
        allEdges.forEach(e => visibleEdgeIds.add(e.id));
        edgesLabel.textContent = 'Hide relationships';
        edgesBtn.classList.remove('active');
      } else {
        visibleEdgeIds.clear();
        edgesLabel.textContent = 'Show relationships';
        edgesBtn.classList.add('active');
      }
      refreshExpansionStyles();
    });
  </script>
</body>
