<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTI Brain · Dashboard</title>
  <link rel="icon" type="image/png"
    href="https://th.bing.com/th/id/ODF.V-KQW8U0lyNZl0BhtyaPOA?w=32&h=32&qlt=90&pcl=fffffc&o=6&pid=1.2" />
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       MTI BRAIN  ·  EXECUTIVE INTELLIGENCE DASHBOARD
       Design System — Consulting-Grade Financial Dashboard
       ═══════════════════════════════════════════════════════════════════ */

    @import url('https://fonts.cdnfonts.com/css/alliance-no1');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    :root {
      /* ── Brand / Primary ── */
      --navy-900: #00172F;
      --navy-800: #001d38;
      --navy-700: #092C53;
      --navy-600: #0d3664;
      --navy-500: #184476;
      --navy-400: #184476;
      --navy-300: #1B76B8;
      --accent: #1B76B8;
      --accent-lt: #3d9ad4;

      /* ── Text ── */
      --ink: #00172F;
      --ink-2: #092C53;
      --ink-3: #184476;
      --muted: #939598;
      --faint: #b0b4b8;

      /* ── Surfaces ── */
      --bg: #f8fafb;
      --bg-2: #C6DBDF;
      --surface: #ffffff;
      --surface-2: #f2f7f8;
      --border: #C6DBDF;
      --border-2: #a8c0c5;

      /* ── Semantic ── */
      --g-dark: #14532d;
      --g: #15803d;
      --g-bg: #dcfce7;
      --g-border: #bbf7d0;
      --a-dark: #78350f;
      --a: #b45309;
      --a-bg: #fef3c7;
      --a-border: #fde68a;
      --r-dark: #7f1d1d;
      --r: #b91c1c;
      --r-bg: #fee2e2;
      --r-border: #fecaca;
      --b-dark: #092C53;
      --b: #184476;
      --b-bg: #e8f2f4;
      --b-border: #C6DBDF;
      --p-dark: #4c1d95;
      --p: #6d28d9;
      --p-bg: #ede9fe;
      --p-border: #ddd6fe;

      /* ── Elevation ── */
      --sh-xs: 0 1px 2px rgba(0, 0, 0, .05);
      --sh: 0 1px 3px rgba(0, 0, 0, .07), 0 2px 8px rgba(0, 0, 0, .04);
      --sh-md: 0 4px 16px rgba(0, 0, 0, .09), 0 2px 6px rgba(0, 0, 0, .05);
      --sh-lg: 0 8px 30px rgba(0, 0, 0, .12), 0 4px 10px rgba(0, 0, 0, .06);

      /* ── Radius (use --rad / --rad-sm / --rad-xs — never --r which is the red color) ── */
      --rad: 10px;
      --rad-sm: 6px;
      --rad-xs: 4px;
    }

    body {
      font-family: 'Alliance No.1', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f5f6;
      color: var(--ink-2);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ──────────────────────────────────────────────────────────────────
       LAYOUT
       ────────────────────────────────────────────────────────────────── */

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 0 64px;
      background: var(--surface);
      box-shadow: 0 0 40px rgba(0, 0, 0, .05);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      overflow: hidden;
      min-height: 100vh;
    }


    /* ──────────────────────────────────────────────────────────────────
       HEADER
       ────────────────────────────────────────────────────────────────── */

    .hdr {
      background:
        linear-gradient(160deg, var(--navy-900) 0%, var(--navy-700) 35%, var(--navy-500) 70%, #184476 100%);
      color: #fff;
      padding: 32px 44px 0;
      position: relative;
      overflow: hidden;
    }

    /* Tight grid texture */
    .hdr::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Top-right radial glow */
    .hdr::after {
      content: '';
      position: absolute;
      top: -80px;
      right: -40px;
      width: 520px;
      height: 520px;
      background: radial-gradient(ellipse at center, rgba(27, 118, 184, .22) 0%, transparent 65%);
      pointer-events: none;
    }

    /* All direct children sit above overlays */
    .hdr>* {
      position: relative;
      z-index: 1;
    }

    .hdr-eyebrow {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .75);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-eyebrow::before {
      content: '';
      display: inline-block;
      width: 24px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-lt));
      border-radius: 2px;
      flex-shrink: 0;
    }

    .hdr-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -.7px;
      color: #fff;
      margin-bottom: 8px;
      max-width: 820px;
    }

    .hdr-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, .75);
      margin-bottom: 30px;
      font-weight: 400;
    }

    .hdr-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-bottom: 0;
    }

    .hdr-meta-item {
      padding: 14px 36px 18px 0;
      margin-right: 36px;
      border-right: 1px solid rgba(255, 255, 255, .09);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .70);
    }

    .hdr-meta-item:last-child {
      border-right: none;
      margin-right: 0;
    }

    .hdr-meta-item strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.5px;
      line-height: 1.1;
      margin-top: 3px;
      text-transform: none;
    }

    .infobar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 44px;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
    }

    .infobar-item {
      font-size: 11px;
      color: var(--ink-2);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 20px 3px 0;
      margin-right: 20px;
      border-right: 1px solid var(--border);
    }

    .infobar-item:last-child {
      border-right: none;
      margin-right: 0;
    }

    .infobar-item span {
      color: var(--muted);
      font-weight: 400;
    }

    .idot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--b-dark);
      display: inline-block;
      box-shadow: 0 0 5px rgba(9, 44, 83, .45);
      flex-shrink: 0;
    }


    /* ──────────────────────────────────────────────────────────────────
       EXECUTIVE SUMMARY
       ────────────────────────────────────────────────────────────────── */

    .exec-summary {
      background: linear-gradient(135deg, var(--navy-800) 0%, var(--navy-600) 100%);
      color: rgba(255, 255, 255, .88);
      padding: 22px 44px;
      font-size: 13.5px;
      line-height: 1.75;
      font-weight: 400;
      border-bottom: 3px solid var(--accent);
    }

    .exec-summary strong {
      color: #fff;
      font-weight: 700;
    }

    /* ──────────────────────────────────────────────────────────────────
       KPI GRID
       ────────────────────────────────────────────────────────────────── */

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(192px, 1fr));
      gap: 16px;
      padding: 32px 44px 8px;
    }

    .kcard {
      background: var(--surface);
      border-radius: var(--rad);
      padding: 20px 22px 18px;
      box-shadow: var(--sh);
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy-400);
      position: relative;
      overflow: hidden;
      transition: box-shadow .18s, transform .18s;
    }

    .kcard:hover {
      box-shadow: var(--sh-md);
      transform: translateY(-2px);
    }


    .kcard.kb {
      border-left-color: var(--b-dark);
      background: #edf5f7;
    }


    .kcard-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 5px;
    }


    .kcap {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.3;
      flex: 1;
    }

    .knum {
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1.2px;
      color: var(--b-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 7px;
    }

    .ktrend {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ktrend .up {
      color: var(--g);
      font-weight: 600;
    }


    .kbadge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 20px;
      background: #ffffff;
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ──────────────────────────────────────────────────────────────────
       DIVIDER
       ────────────────────────────────────────────────────────────────── */

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 44px;
    }

    /* ──────────────────────────────────────────────────────────────────
       SECTIONS
       ────────────────────────────────────────────────────────────────── */

    .section {
      padding: 36px 44px 0;
    }

    .section h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
      margin-bottom: 20px;
    }

    .section h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, var(--navy-400), var(--accent));
      border-radius: 3px;
      flex-shrink: 0;
    }


    /* ──────────────────────────────────────────────────────────────────
       CALLOUT
       ────────────────────────────────────────────────────────────────── */

    .callout {
      border-radius: 0 var(--rad-sm) var(--rad-sm) 0;
      padding: 13px 18px;
      font-size: 12.5px;
      line-height: 1.6;
      margin-bottom: 14px;
      margin-top: 14px;
      border-left: 4px solid var(--navy-400);
      background: #edf5f7;
      color: var(--ink-2);
    }


    /* ──────────────────────────────────────────────────────────────────
       INSIGHT BOX  (per-section "Key Finding" callout — distinct from .callout)
       ────────────────────────────────────────────────────────────────── */

    .insight-box {
      border-left: 3px solid var(--navy-500);
      background: #ffffff;
      border-radius: 0 var(--rad-sm) var(--rad-sm) 0;
      padding: 12px 16px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--navy-800);
      margin-top: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }


    .insight-box strong {
      color: var(--navy-800);
      font-weight: 700;
    }

    /* ──────────────────────────────────────────────────────────────────
       DATA SOURCE CITATION  (below tables / charts)
       ────────────────────────────────────────────────────────────────── */

    .data-source {
      font-size: 10px;
      color: var(--faint);
      font-style: italic;
      margin-top: 7px;
      letter-spacing: .01em;
    }

    /* ──────────────────────────────────────────────────────────────────
       TABLES
       ────────────────────────────────────────────────────────────────── */

    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 560px;
      border-radius: var(--rad);
      box-shadow: var(--sh);
      border: 1px solid var(--border);
    }

    .table-wrap::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }

    .table-wrap::-webkit-scrollbar-track {
      background: var(--bg);
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background: var(--surface);
    }

    thead th {
      background: var(--navy-800);
      color: rgba(255, 255, 255, .80);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      padding: 12px 14px;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 2px solid rgba(255, 255, 255, .08);
      text-align: left;
    }

    tbody tr {
      border-bottom: 1px solid var(--surface-2);
      transition: background .1s;
    }

    tbody tr:hover {
      background: #eef6f7 !important;
    }

    tbody tr:nth-child(even) {
      background: #f8fbfb;
    }

    td {
      padding: 10px 14px;
      white-space: nowrap;
      vertical-align: middle;
      color: var(--ink-2);
    }

    td.r {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tfoot tr {
      background: var(--surface-2) !important;
      border-top: 2px solid var(--border-2);
    }

    tfoot td {
      font-weight: 700;
      color: var(--ink);
      padding: 11px 14px;
    }


    /* ──────────────────────────────────────────────────────────────────
       FLAGS
       ────────────────────────────────────────────────────────────────── */

    .flags-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flags-list li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background: var(--surface);
      border-radius: var(--rad-sm);
      box-shadow: var(--sh-xs);
      border: 1px solid var(--border);
      transition: transform .15s, box-shadow .15s;
    }

    .flags-list li:hover {
      transform: translateX(2px);
      box-shadow: var(--sh);
    }


    .fl-body {
      flex: 1;
      min-width: 0;
    }

    .fl-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
    }

    .fl-desc {
      font-size: 11.5px;
      color: var(--ink-3);
      margin-top: 3px;
      line-height: 1.5;
    }

    .fl-impact {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ──────────────────────────────────────────────────────────────────
       ACTIONS
       ────────────────────────────────────────────────────────────────── */

    .actions-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .actions-list li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      background: var(--surface);
      border-radius: var(--rad-sm);
      box-shadow: var(--sh-xs);
      border: 1px solid var(--border);
      transition: transform .15s, box-shadow .15s;
    }

    .actions-list li:hover {
      transform: translateX(2px);
      box-shadow: var(--sh);
    }

    .fl-num,
    .ac-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--navy-400);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ac-body {
      flex: 1;
      min-width: 0;
    }

    .ac-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
    }

    .ac-detail {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 4px;
      line-height: 1.6;
    }

    .ac-meta {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }


    .pill.owner {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .pill.brand {
      background: var(--navy-400);
      color: #fff;
    }

    /* ──────────────────────────────────────────────────────────────────
       BENCHMARKS
       ────────────────────────────────────────────────────────────────── */

    .bench-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .bench-item {
      background: #edf5f7;
      border-radius: var(--rad);
      padding: 18px 20px;
      box-shadow: var(--sh);
      border: 1px solid var(--border);
      border-left: 4px solid var(--b-dark);
      transition: box-shadow .18s, transform .18s;
    }

    .bench-item:hover {
      box-shadow: var(--sh-md);
      transform: translateY(-2px);
    }

    .bench-metric {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .bench-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--b-dark);
      letter-spacing: -.5px;
      line-height: 1;
    }


    .bench-target {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      margin-bottom: 8px;
    }

    /* ──────────────────────────────────────────────────────────────────
       TIMELINE CHIPS
       ────────────────────────────────────────────────────────────────── */

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 5px 13px;
      border-radius: 20px;
      background: #edf5f7;
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink-2);
      box-shadow: var(--sh-xs);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--b-dark);
      flex-shrink: 0;
    }

    /* ──────────────────────────────────────────────────────────────────
       UTILITIES
       ────────────────────────────────────────────────────────────────── */


    /* ──────────────────────────────────────────────────────────────────
       RESPONSIVE
       ────────────────────────────────────────────────────────────────── */

    @media (max-width: 768px) {
      .hdr {
        padding: 24px 20px 0;
      }

      .hdr-title {
        font-size: 24px;
      }

      .infobar {
        padding: 10px 20px;
      }

      .exec-summary {
        padding: 16px 20px;
      }

      .kpi-grid {
        padding: 20px 20px 8px;
      }

      .knum {
        font-size: 22px;
      }

      .section {
        padding: 24px 20px 0;
      }

      .g2,
      .g3 {
        grid-template-columns: 1fr;
      }

      .hdr-meta-item {
        border-right: none;
        padding: 10px 0;
        margin-right: 0;
      }
    }

    /* ──────────────────────────────────────────────────────────────────
       PRINT
       ────────────────────────────────────────────────────────────────── */

    @media print {
      body {
        background: #fff;
      }

      .wrap {
        max-width: 100%;
      }

      .hdr {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .exec-summary {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .kcard,
      .card,
      .flags-list li,
      .actions-list li {
        box-shadow: none;
        border: 1px solid var(--border);
      }

      .kcard:hover,
      .actions-list li:hover,
      .flags-list li:hover {
        transform: none;
      }
    }

    /* ──────────────────────────────────────────────────────────────────
       LOGO
       ────────────────────────────────────────────────────────────────── */

    .header-logo {
      background: var(--navy-900);
      padding: 12px 44px;
      margin: 0;
      width: 100%;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .header-logo::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    .header-logo img {
      height: 50px;
      width: 60px;
      position: relative;
      z-index: 1;
      object-fit: contain;
    }

    /* ──────────────────────────────────────────────────────────────────
       PAGE FOOTER
       ────────────────────────────────────────────────────────────────── */

    .pg-footer {
      margin-top: 56px;
      padding: 18px 44px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pg-footer-l {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    .pg-footer-brand {
      color: var(--ink-3);
      font-weight: 700;
    }

    .conf-badge {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--rad-xs);
      padding: 3px 9px;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .11em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ══════════════════════════════════════════════════════════════════
       MCKINSEY/BAIN VISUAL ENHANCEMENTS
       Dark-to-Light Gradient Flow · Grid Texture · Executive Polish
       ══════════════════════════════════════════════════════════════════ */

    /* ── Page-level gradient flow: dark navy → light blue ── */
    .wrap {
      background:
        linear-gradient(180deg,
          #eef4f5 0%,
          #f3f8f8 15%,
          #f6fafb 40%,
          #fcfdfe 70%,
          #ffffff 100%);
      position: relative;
    }

    /* Subtle grid texture on the page body (consulting-grade visual) */
    .wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(9, 44, 83, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(9, 44, 83, .018) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap > * {
      position: relative;
      z-index: 1;
    }

    /* ── Enhanced Header with stronger gradient ── */
    .hdr {
      background:
        linear-gradient(160deg,
          #00111F 0%,
          #03080f 8%,
          #040e1d 20%,
          #07172e 35%,
          #0a1f3d 50%,
          #0e2a52 65%,
          #184476 80%,
          #1B76B8 100%);
      padding: 40px 48px 0;
    }

    /* Finer grid in header */
    .hdr::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Stronger radial glow */
    .hdr::after {
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center,
        rgba(27, 118, 184, .18) 0%,
        rgba(27, 118, 184, .08) 40%,
        transparent 70%);
    }

    .hdr-title {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -.8px;
      max-width: 900px;
      margin-bottom: 10px;
    }

    .hdr-subtitle {
      font-size: 13.5px;
      color: rgba(255, 255, 255, .6);
      margin-bottom: 36px;
      font-weight: 400;
      letter-spacing: .02em;
    }

    /* ── Frosted glass meta strip ── */
    .hdr-meta {
      background: rgba(255, 255, 255, .04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, .08);
      margin: 0 -48px;
      padding: 0 48px;
      display: flex;
      flex-wrap: wrap;
    }

    .hdr-meta-item {
      padding: 18px 40px 22px 0;
      margin-right: 40px;
    }

    .hdr-meta-item strong {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -.6px;
      margin-top: 5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .2);
    }

    /* ── Transition strip: dark header → light body ── */
    .infobar {
      background: linear-gradient(180deg, #e4eef0 0%, #eef4f5 100%);
      border-bottom: 1px solid rgba(198, 219, 223, .8);
      padding: 12px 48px;
      position: relative;
    }

    .infobar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--navy-500), var(--accent), var(--accent-lt));
    }

    .idot {
      background: linear-gradient(135deg, var(--navy-400), var(--accent));
      box-shadow: 0 0 6px rgba(27, 118, 184, .35);
    }

    /* ── Executive Summary: richer gradient ── */
    .exec-summary {
      background: linear-gradient(135deg,
        var(--navy-800) 0%,
        var(--navy-700) 40%,
        var(--navy-600) 100%);
      padding: 26px 48px;
      font-size: 14px;
      line-height: 1.8;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, var(--accent), var(--accent-lt), var(--navy-400)) 1;
      position: relative;
    }

    .exec-summary::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .012) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── Enhanced Section styling ── */
    .section {
      padding: 40px 48px 0;
    }

    .section h2 {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--ink);
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
      position: relative;
    }

    .section h2::before {
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, var(--accent), var(--navy-400));
      border-radius: 4px;
    }

    /* Accent underline on section headers */
    .section h2::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }

    .divider {
      margin: 0 48px;
      border-top: 1px solid rgba(198, 219, 223, .6);
    }

    /* ── KPI Cards: premium treatment ── */
    .kpi-grid {
      padding: 36px 48px 12px;
      gap: 18px;
    }

    .kcard {
      border-radius: 12px;
      padding: 24px 26px 22px;
      border: 1px solid rgba(198, 219, 223, .5);
      border-left: 5px solid var(--navy-400);
      box-shadow:
        0 1px 3px rgba(9, 44, 83, .06),
        0 4px 16px rgba(9, 44, 83, .04);
      transition: all .2s ease;
    }

    .kcard:hover {
      box-shadow:
        0 4px 20px rgba(9, 44, 83, .1),
        0 8px 32px rgba(9, 44, 83, .06);
      transform: translateY(-3px);
      border-color: rgba(198, 219, 223, .8);
    }

    .kcard.kb {
      background: linear-gradient(145deg, #edf5f7 0%, #f4f8f9 50%, #f9fbfb 100%);
      border-left-color: var(--accent);
    }

    .knum {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: var(--navy-800);
      margin-bottom: 8px;
      line-height: 1;
    }

    .kcap {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .ktrend {
      font-size: 11.5px;
      color: var(--ink-3);
      line-height: 1.5;
    }

    .kbadge {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-600));
      color: rgba(255, 255, 255, .9);
      border: none;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
      padding: 3px 9px;
    }

    /* ── Tables: premium data presentation ── */
    .table-wrap {
      border-radius: 12px;
      box-shadow:
        0 1px 3px rgba(0, 0, 0, .06),
        0 4px 16px rgba(0, 0, 0, .04);
      border: 1px solid rgba(198, 219, 223, .8);
      overflow: hidden;
    }

    thead th {
      background: linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
      color: rgba(255, 255, 255, .85);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .14em;
      padding: 14px 16px;
      border-bottom: 2px solid var(--accent);
    }

    thead th:first-child {
      border-left: 3px solid var(--accent);
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
    }

    tbody tr:nth-child(even) {
      background: #f6fafb;
    }

    tbody tr:hover {
      background: #edf5f7 !important;
    }

    td {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--ink-2);
      font-weight: 500;
    }

    tfoot tr {
      background: linear-gradient(180deg, #edf5f7 0%, #e4eef0 100%) !important;
      border-top: 2px solid var(--navy-400);
    }

    tfoot td {
      font-weight: 800;
      color: var(--navy-800);
      padding: 14px 16px;
      font-size: 13px;
    }

    /* ── Insight boxes: elevated treatment ── */
    .insight-box {
      border-left: 4px solid transparent;
      border-image: linear-gradient(180deg, var(--accent), var(--navy-400)) 1;
      background: linear-gradient(135deg, #eff5f7 0%, #f9fbfb 100%);
      border-radius: 0 10px 10px 0;
      padding: 16px 20px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(9, 44, 83, .04);
    }

    .insight-box strong {
      color: var(--navy-800);
      font-weight: 800;
    }

    /* ── Flags: cleaner lines ── */
    .flags-list li {
      border-radius: 10px;
      padding: 20px 22px;
      border: 1px solid rgba(198, 219, 223, .7);
      border-left: 4px solid var(--navy-400);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
      background: linear-gradient(135deg, #f9fbfb 0%, #ffffff 100%);
    }

    .flags-list li:hover {
      border-left-color: var(--accent);
      box-shadow: 0 4px 16px rgba(9, 44, 83, .06);
    }

    .fl-num,
    .ac-num {
      width: 30px;
      height: 30px;
      font-size: 11px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--navy-600), var(--accent));
      box-shadow: 0 2px 6px rgba(9, 44, 83, .2);
    }

    .fl-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy-800);
    }

    .fl-desc {
      font-size: 12px;
      line-height: 1.65;
      margin-top: 5px;
    }

    .fl-impact {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--navy-400);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* ── Actions: premium treatment ── */
    .actions-list li {
      border-radius: 10px;
      padding: 20px 22px;
      border: 1px solid rgba(198, 219, 223, .7);
      border-left: 4px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
      background: linear-gradient(135deg, #f9fbfb 0%, #ffffff 100%);
    }

    .actions-list li:hover {
      border-left-color: var(--navy-400);
      box-shadow: 0 4px 16px rgba(9, 44, 83, .06);
    }

    .ac-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--navy-800);
    }

    .ac-detail {
      font-size: 12.5px;
      line-height: 1.65;
      margin-top: 6px;
    }

    .pill.owner {
      background: #eef4f5;
      color: var(--ink-3);
      border: 1px solid rgba(198, 219, 223, .6);
      font-weight: 800;
    }

    .pill.brand {
      background: linear-gradient(135deg, var(--navy-600), var(--accent));
      border: none;
      font-weight: 800;
    }

    /* ── Benchmarks: card-style metrics ── */
    .bench-grid {
      gap: 16px;
    }

    .bench-item {
      background: linear-gradient(145deg, #edf5f7 0%, #f6fafb 100%);
      border-radius: 12px;
      padding: 22px 24px;
      border: 1px solid rgba(198, 219, 223, .4);
      border-left: 5px solid var(--accent);
      box-shadow: 0 2px 8px rgba(9, 44, 83, .04);
    }

    .bench-item:hover {
      box-shadow: 0 4px 20px rgba(9, 44, 83, .08);
      transform: translateY(-2px);
      border-color: rgba(198, 219, 223, .7);
    }

    .bench-val {
      font-size: 28px;
      font-weight: 900;
      color: var(--navy-800);
      letter-spacing: -.8px;
      margin: 4px 0;
    }

    .bench-metric {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    .bench-target {
      font-size: 11px;
      color: var(--ink-3);
    }

    /* ── Timeline chips: refined ── */
    .chips {
      gap: 10px;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 24px;
      background: linear-gradient(135deg, #edf5f7 0%, #f4f8f9 100%);
      border: 1px solid rgba(198, 219, 223, .5);
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 1px 4px rgba(9, 44, 83, .04);
      transition: all .18s ease;
    }

    .chip:hover {
      box-shadow: 0 4px 12px rgba(9, 44, 83, .08);
      transform: translateY(-1px);
      background: linear-gradient(135deg, #e2edef 0%, #edf5f7 100%);
    }

    .chip strong {
      color: var(--navy-800);
      font-weight: 800;
    }

    .chip-dot {
      background: linear-gradient(135deg, var(--accent), var(--navy-400));
      box-shadow: 0 0 6px rgba(27, 118, 184, .3);
    }

    /* ── Bottom Line: Hero callout ── */
    .callout.hero-bottom {
      background: linear-gradient(135deg,
        var(--navy-800) 0%,
        var(--navy-700) 40%,
        var(--navy-600) 100%);
      color: rgba(255, 255, 255, .9);
      border-left: 5px solid var(--accent);
      border-radius: 0;
      margin: 40px 0 0;
      padding: 24px 48px;
      font-size: 14px;
      line-height: 1.75;
      position: relative;
      overflow: hidden;
    }

    .callout.hero-bottom::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .callout.hero-bottom strong {
      color: #fff;
      font-weight: 800;
    }

    /* ── Footer: branded gradient ── */
    .pg-footer {
      margin-top: 0;
      padding: 20px 48px;
      border-top: 2px solid var(--navy-400);
      background: linear-gradient(180deg, #eef4f5 0%, #e4eef0 100%);
    }

    .pg-footer-brand {
      color: var(--navy-800);
      font-weight: 800;
    }

    .conf-badge {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-600));
      color: rgba(255, 255, 255, .85);
      border: none;
      font-weight: 800;
      padding: 4px 12px;
    }

    /* ── Data source styling ── */
    .data-source {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 10px;
      padding-top: 8px;
      letter-spacing: .01em;
    }

    /* ── Responsive overrides ── */
    @media (max-width: 768px) {
      .hdr {
        padding: 28px 24px 0;
      }
      .hdr-meta {
        margin: 0 -24px;
        padding: 0 24px;
      }
      .hdr-title {
        font-size: 26px;
      }
      .infobar {
        padding: 12px 24px;
      }
      .exec-summary {
        padding: 20px 24px;
      }
      .kpi-grid {
        padding: 24px 24px 8px;
      }
      .knum {
        font-size: 26px;
      }
      .section {
        padding: 28px 24px 0;
      }
      .divider {
        margin: 0 24px;
      }
      .callout.hero-bottom {
        padding: 20px 24px;
      }
    }

  </style>
  <!-- No external dependencies -->
</head>
