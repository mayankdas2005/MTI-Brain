# ─── node_names.yml ─────────────────────────────────────────────────────────────
# Pipeline node definitions — single source of truth for node IDs, UI labels,
# LLM tiers, and streaming config.
#
# tier:   "fast" | "balanced" | "deep" | "none"
#           fast    → Haiku  (disambiguation, classification, chart spec)
#           balanced → Sonnet (intent resolution, synthesis)
#           deep    → Sonnet extended thinking / long context (SQL generation, execution repair)
#           none    → no LLM call; token tracking ignored for this node
#
# stream: "multi"              → MultiSectionStreamer (<reasoning> + <answer>)
#         ["<tag>", "<event>"] → SectionStreamer for one XML tag
#         null                 → no LLM tokens to stream (deterministic or non-streaming LLM call)
#
# label: null → node is hidden from the UI progress bar (e.g. compress)
# ─────────────────────────────────────────────────────────────────────────────────

nodes:
