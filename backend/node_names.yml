# ─── node_names.yml ─────────────────────────────────────────────────────────────
# Pipeline node definitions — single source of truth for node IDs, UI labels,
# LLM tiers, and streaming config.
#
# tier:   "fast" | "balanced" | "deep" | "none"
#           fast    → Haiku  (disambiguation, classification, chart spec)
#           balanced → Sonnet (intent resolution, synthesis)
#           deep    → Sonnet extended thinking / long context (SQL generation, execution repair)
#           none    → no LLM call; token tracking ignored for this node
#
# stream: "multi"              → MultiSectionStreamer (<reasoning> + <answer>)
#         ["<tag>", "<event>"] → SectionStreamer for one XML tag
#         null                 → no LLM tokens to stream (deterministic or non-streaming LLM call)
#
# label: null → node is hidden from the UI progress bar (e.g. compress)
# ─────────────────────────────────────────────────────────────────────────────────

nodes:
  - id: intake_classifier
    label: "Understanding your question"
    tier: fast
    stream: null

  - id: general_chat
    label: "Responding"
    tier: balanced
    stream: multi

  - id: context_fetcher
    label: "Loading schema"
    tier: none
    stream: null

  - id: intent_resolver
    label: "Interpreting your question"
    tier: balanced
    stream: [reasoning, reasoning.delta]

  - id: clarification
    label: "Requesting clarification"
    tier: fast
    stream: [reasoning, reasoning.delta]

  - id: query_compiler
    label: "Planning query"
    tier: none
    stream: null

  - id: filter_resolver
    label: "Resolving filters"
    tier: fast
    stream: null

  - id: sql_generator
    label: "Building query"
    tier: deep
    stream: [reasoning, reasoning.delta]

  - id: sql_validator
    label: "Validating query"
    tier: none
    stream: null

  - id: executor
    label: "Fetching data"
    tier: deep
    stream: [reasoning, reasoning.delta]

  - id: synthesis
    label: "Preparing your answer"
    tier: balanced
    stream: multi

  - id: chart_agent
    label: "Building chart"
    tier: fast
    stream: [reasoning, reasoning.delta]

  - id: error_response
    label: "Error occurred"
    tier: none
    stream: null

  - id: compress
    label: null
    tier: fast
    stream: null
