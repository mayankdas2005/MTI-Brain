# ─── config.yml ────────────────────────────────────────────────────────────────
# Non-secret application configuration. Commit this file to git.
# Secrets (DB credentials, JWT secret, API keys) belong in .env — never here.
#
# Override any value at deploy-time by setting the matching environment variable.
# Example: LOG_LEVEL=WARNING in the shell or CodeDeploy environment overrides
# the app.log_level value below, with no file edit required.
# ───────────────────────────────────────────────────────────────────────────────

app:
  name: "MTI Brain Backend"
  environment: development         # development | production
  debug: false                     # true enables SQLAlchemy query echo and FastAPI debug mode
  log_level: INFO                  # DEBUG | INFO | WARNING | ERROR

server:
  # Browser origins that may call the API.
  # Add prod origins here or override at deploy-time via CORS_ORIGINS env var.
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://100.21.28.155:3000"
    - "https://ai.milestnapps.com"
    - "http://0.0.0.0:3000"

auth:
  jwt_algorithm: HS256
  jwt_expiry_hours: 8

rate_limit:
  login_per_minute: 5              # Max login attempts per IP per minute
  ask_per_minute: 30               # Max /ask, /retry, /edit requests per IP per minute

postgres:                            # PostgreSQL / PgBouncer connection settings
  port: 5432
  ssl_mode: disable                # disable | require | verify-ca | verify-full
  ssl_root_cert: ""                # Path to CA cert when ssl_mode is verify-ca or verify-full

  pool:                            # SQLAlchemy pool (app ↔ PgBouncer sockets — NOT server connections)
    size: 2                        # Base connections kept open at all times
    max_overflow: 8                # Extra connections allowed above size (shed under peak load)
    recycle_seconds: 500           # Close and reopen connections older than N seconds
    timeout_seconds: 30            # Seconds to wait for a free connection before raising an error

  checkpoint_pool:                 # psycopg pool used by LangGraph checkpointer ↔ PgBouncer
    min_size: 1                    # Min connections to keep open
    max_size: 5                    # Max connections
    max_idle_seconds: 300          # Close idle connections after N seconds

neo4j:
  pool:
    max_connections: 10            # Bolt connection pool size (server bolt thread max is 40)
    connection_timeout_seconds: 10 # Seconds before a connection attempt times out
    acquisition_timeout_seconds: 10 # Seconds to wait for a free pool connection

redis:
  pool:
    max_connections: 20            # Cap on pooled Redis connections
    health_check_interval_seconds: 30  # Auto-PING idle connections; reconnects dead ones

circuit_breaker:
  # Pybreaker settings for the Postgres health-check circuit.
  fail_max: 5                      # Consecutive failures before opening the circuit
  reset_timeout_seconds: 30        # Seconds before the circuit half-opens to probe recovery

pipeline:
  recursion_limit: 80              # LangGraph recursion limit (advanced queries need headroom)

model_routing:
  llm_routing_enabled: true        # Model routing (Haiku / Sonnet / Opus)

prompt_cache:
  aws_bedrock_prompt_cache: true   # Enable AWS Bedrock prompt cache

feature_toggles:
  langfuse_enabled: true           # Enable Langfuse tracing and model usage tracking
  data_quality_checker_enabled: false  # When true: runs after executor; output feeds confidence + synthesis
  confidence_score_enabled: false  # When true: runs after executor; output feeds confidence + synthesis
